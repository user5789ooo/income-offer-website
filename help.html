<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help - Income Offers</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
    }

    .help-box {
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .telegram-btn {
      display: block;
      text-decoration: none;
      background: #229ED9;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    .back {
      display: block;
      margin-top: 18px;
      color: #222;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="help-box">

      <div class="icon">❓</div>

      <h1>Need Help?</h1>

      <p>
        If you need any help regarding an offer,
        contact us on Telegram.
      </p>

      <!-- Telegram link will be managed later from Admin Panel -->
      <a
        class="telegram-btn"
        href="https://t.me/YOUR_TELEGRAM_USERNAME"
        target="_blank">
        💬 Contact us on Telegram
      </a>

      <a class="back" href="index.html">
        ← Back to Home
      </a>

    </div>

  </main>

</body>
</html>
