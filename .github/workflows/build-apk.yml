name: Build Income Offers APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout website
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"


      - name: Prepare website assets
        run: |

          mkdir -p app/src/main/assets/www

          echo "Copying website files..."

          find . \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.html" \
              -o -name "*.css" \
              -o -name "*.js" \
              -o -name "*.json" \
              -o -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.webp" \
              -o -name "*.svg" \
              \) \
            -exec cp -f {} app/src/main/assets/www/ \;

          if [ -d "assets" ]; then
            cp -R assets app/src/main/assets/www/
          fi

          echo "Website files copied."

          find app/src/main/assets/www \
            -maxdepth 2 \
            -type f \
            | sort


      - name: Check Android project
        run: |
          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/incomeoffers/app/MainActivity.java
          test -f app/src/main/res/values/styles.xml

          echo "Android project OK."


      - name: Build Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Income-Offers-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
