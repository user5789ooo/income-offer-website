<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Income Offers - Offer Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
background:
radial-gradient(
circle at 15% 10%,
rgba(105,75,255,.16),
transparent 35%
),
radial-gradient(
circle at 90% 85%,
rgba(0,180,255,.09),
transparent 35%
),
#050505;
color:#fff;
font-family:'Geist',Arial,sans-serif;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button{
font:inherit;
}

.background{
position:fixed;
inset:0;
z-index:-2;
background:
radial-gradient(
circle at 50% 40%,
rgba(255,255,255,.025),
transparent 40%
);
}

header{
position:sticky;
top:0;
z-index:30;
border-bottom:1px solid rgba(255,255,255,.08);
background:rgba(5,5,5,.76);
backdrop-filter:blur(22px);
}

.nav{
max-width:1000px;
margin:auto;
padding:15px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-logo{
width:42px;
height:42px;
object-fit:cover;
border-radius:50%;
border:1px solid rgba(255,255,255,.35);
}

.brand-text{
display:flex;
flex-direction:column;
}

.brand-name{
font-size:16px;
font-weight:800;
}

.brand-owner{
margin-top:2px;
font-size:8px;
font-weight:700;
letter-spacing:.15em;
color:rgba(255,255,255,.38);
}

.back{
padding:10px 14px;
border:1px solid rgba(255,255,255,.1);
border-radius:999px;
background:rgba(255,255,255,.06);
color:rgba(255,255,255,.8);
font-size:12px;
transition:.2s;
}

.back:active{
transform:scale(.95);
}

.container{
max-width:820px;
margin:auto;
padding:38px 16px 110px;
}

.card{
overflow:hidden;
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
background:rgba(255,255,255,.055);
backdrop-filter:blur(20px);
box-shadow:0 25px 80px rgba(0,0,0,.3);
animation:cardIn .65s ease both;
}

@keyframes cardIn{

from{
opacity:0;
transform:translateY(25px) scale(.98);
}

to{
opacity:1;
transform:translateY(0) scale(1);
}

}

.image{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
display:block;
}

.placeholder{
width:100%;
aspect-ratio:16/9;
display:flex;
align-items:center;
justify-content:center;
background:#111;
font-size:55px;
}

.content{
padding:25px;
}

.eyebrow{
display:flex;
align-items:center;
gap:7px;
margin-bottom:12px;
color:rgba(255,255,255,.43);
font-size:10px;
font-weight:700;
letter-spacing:.1em;
}

.live-dot{
width:7px;
height:7px;
border-radius:50%;
background:#65ff9b;
box-shadow:0 0 14px #65ff9b;
}

h1{
font-size:clamp(
2rem,
6vw,
3.5rem
);
line-height:1.02;
letter-spacing:-.06em;
}

.description{
margin:17px 0 0;
color:rgba(255,255,255,.56);
font-size:14px;
line-height:1.75;
white-space:pre-line;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:25px;
}

.info-box{
padding:15px;
border:1px solid rgba(255,255,255,.08);
border-radius:15px;
background:rgba(255,255,255,.04);
}

.label{
margin-bottom:5px;
color:rgba(255,255,255,.33);
font-size:10px;
text-transform:uppercase;
letter-spacing:.08em;
}

.value{
font-size:13px;
font-weight:600;
}

.open{
width:100%;
height:54px;
margin-top:25px;
border:0;
border-radius:16px;
background:#fff;
color:#111;
font-size:14px;
font-weight:800;
cursor:pointer;
transition:.2s;
}

.open:active{
transform:scale(.97);
}

.open:disabled{
opacity:.4;
cursor:not-allowed;
}

.message{
margin-top:13px;
padding:12px;
border:1px solid rgba(255,255,255,.07);
border-radius:12px;
background:rgba(255,255,255,.04);
color:rgba(255,255,255,.5);
font-size:11px;
line-height:1.5;
text-align:center;
}

.error{
padding:55px 20px;
text-align:center;
}

.error-icon{
font-size:45px;
}

.error h2{
margin:12px 0 7px;
font-size:20px;
}

.error p{
color:rgba(255,255,255,.45);
font-size:12px;
line-height:1.6;
}

.error-link{
display:inline-flex;
margin-top:18px;
padding:11px 16px;
border-radius:999px;
background:#fff;
color:#111;
font-size:12px;
font-weight:800;
}

.ripple{
position:fixed;
z-index:9999;
width:8px;
height:8px;
border-radius:50%;
background:rgba(255,255,255,.45);
pointer-events:none;
transform:translate(-50%,-50%);
animation:ripple .55s ease-out forwards;
}

@keyframes ripple{

to{
opacity:0;
transform:
translate(-50%,-50%)
scale(12);
}

}

@media(max-width:520px){

.container{
padding:25px 12px 100px;
}

.content{
padding:21px;
}

.info{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="background"></div>

<header>

<nav class="nav">

<a
class="brand"
href="index.html"
>

<img
class="brand-logo"
src="assets/income-offers-logo.jpg"
alt="Income Offers"
>

<div class="brand-text">

<div class="brand-name">
Income Offers
</div>

<div class="brand-owner">
OWNER: SAHIL
</div>

</div>

</a>


<a
class="back"
href="offer.html"
>
← Back to Offers
</a>

</nav>

</header>


<main class="container">

<div
class="card"
id="card"
>

<div id="imageArea">

<div class="placeholder">
🎁
</div>

</div>


<div class="content">

<div class="eyebrow">

<span class="live-dot"></span>

OFFER DETAILS

</div>


<h1 id="title">
Loading offer...
</h1>


<p
class="description"
id="description"
>
Please wait while the offer details are loaded.
</p>


<div class="info">

<div class="info-box">

<div class="label">
Status
</div>

<div
class="value"
id="status"
>
Loading...
</div>

</div>


<div class="info-box">

<div class="label">
Added
</div>

<div
class="value"
id="date"
>
Loading...
</div>

</div>

</div>


<button
class="open"
id="openButton"
type="button"
disabled
>
🚀 Open Offer
</button>


<div
class="message"
id="message"
>
Loading offer information...
</div>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

/* =========================
   ELEMENTS
========================= */

const params =
new URLSearchParams(
window.location.search
);

const offerId =
params.get("id");

const title =
document.getElementById("title");

const description =
document.getElementById("description");

const status =
document.getElementById("status");

const date =
document.getElementById("date");

const imageArea =
document.getElementById("imageArea");

const openButton =
document.getElementById("openButton");

const message =
document.getElementById("message");

const card =
document.getElementById("card");

let currentOffer = null;


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

const div =
document.createElement("div");

div.textContent =
value == null
? ""
: String(value);

return div.innerHTML;

}


/* =========================
   DATE
========================= */

function formatDate(value){

if(!value){
return "Recently added";
}

const d =
new Date(value);

if(
Number.isNaN(
d.getTime()
)
){
return "Recently added";
}

return d.toLocaleDateString(
undefined,
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


/* =========================
   ERROR
========================= */

function showError(
heading,
text
){

card.innerHTML = `

<div class="error">

<div class="error-icon">
⚠️
</div>

<h2>
${escapeHtml(heading)}
</h2>

<p>
${escapeHtml(text)}
</p>

<a
class="error-link"
href="offer.html"
>
← Back to Offers
</a>

</div>

`;

}


/* =========================
   ACTIVITY LOG
========================= */

async function logActivity(
eventType,
offerIdValue = null,
action = null,
metadata = {}
){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getSession();

if(
error ||
!data ||
!data.session
){
return;
}

const result =
await supabaseClient
.from("activity_logs")
.insert({

user_id:
data.session.user.id,

offer_id:
offerIdValue,

event_type:
eventType,

page:
"offer-details.html",

metadata:
metadata,

action:
action

});

if(result.error){

console.error(
"Activity insert error:",
result.error
);

}

}catch(error){

console.error(
"Activity error:",
error
);

}

}


/* =========================
   UPDATE PROGRESS
========================= */

async function updateProgress(
offerIdValue
){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getSession();

if(
error ||
!data ||
!data.session
){
return;
}

const userId =
data.session.user.id;


/* Find existing progress */

const {
data:existing,
error:selectError
} =
await supabaseClient
.from("offer_progress")
.select("*")
.eq(
"user_id",
userId
)
.eq(
"offer_id",
offerIdValue
)
.maybeSingle();

if(selectError){

console.error(
"Progress lookup error:",
selectError
);

return;

}


const now =
new Date().toISOString();


if(!existing){

const {
error:insertError
} =
await supabaseClient
.from("offer_progress")
.insert({

user_id:
userId,

offer_id:
offerIdValue,

click_count:
0,

view_count:
1,

started:
false,

completed:
false,

created_at:
now,

updated_at:
now

});

if(insertError){

console.error(
"Progress insert error:",
insertError
);

}

return;

}


/* Update existing view count */

const {
error:updateError
} =
await supabaseClient
.from("offer_progress")
.update({

view_count:
(existing.view_count || 0) + 1,

updated_at:
now

})
.eq(
"id",
existing.id
);

if(updateError){

console.error(
"Progress update error:",
updateError
);

}

}


/* =========================
   REGISTER CLICK
========================= */

async function registerOfferClick(
offerIdValue
){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getSession();

if(
error ||
!data ||
!data.session
){
return;
}

const userId =
data.session.user.id;


/* Log click */

await logActivity(
"click",
offerIdValue,
"offer_click",
{
source:
"offer-details.html"
}
);


/* Find progress */

const {
data:existing,
error:selectError
} =
await supabaseClient
.from("offer_progress")
.select("*")
.eq(
"user_id",
userId
)
.eq(
"offer_id",
offerIdValue
)
.maybeSingle();

if(selectError){

console.error(
selectError
);

return;

}


const now =
new Date().toISOString();


if(!existing){

await supabaseClient
.from("offer_progress")
.insert({

user_id:
userId,

offer_id:
offerIdValue,

click_count:
1,

view_count:
1,

started:
true,

completed:
false,

first_clicked_at:
now,

last_clicked_at:
now,

created_at:
now,

updated_at:
now

});

return;

}


/* Update click progress */

const {
error:updateError
} =
await supabaseClient
.from("offer_progress")
.update({

click_count:
(existing.click_count || 0) + 1,

started:
true,

first_clicked_at:
existing.first_clicked_at ||
now,

last_clicked_at:
now,

updated_at:
now

})
.eq(
"id",
existing.id
);

if(updateError){

console.error(
updateError
);

}

}


/* =========================
   LOAD OFFER
========================= */

async function loadOffer(){

if(!offerId){

showError(
"Offer not found",
"No offer ID was provided."
);

return;

}


/* Check session */

const {
data:sessionData,
error:sessionError
} =
await supabaseClient
.auth
.getSession();

if(sessionError){

console.error(
sessionError
);

showError(
"Session error",
"Please login again."
);

return;

}


if(
!sessionData ||
!sessionData.session
){

window.location.replace(
"login.html"
);

return;

}


/* Load offer */

const {
data,
error
} =
await supabaseClient
.from("offers")
.select(
"id,created_at,title,description,image_url,offer_url,status"
)
.eq(
"id",
offerId
)
.single();


if(error){

console.error(
"Offer load error:",
error
);

showError(
"Unable to load offer",
"Please try again."
);

return;

}


if(!data){

showError(
"Offer not found",
"This offer does not exist."
);

return;

}


/* Active check */

if(
data.status !== "active"
){

showError(
"Offer unavailable",
"This offer is currently inactive."
);

return;

}


currentOffer =
data;


/* Image */

if(data.image_url){

imageArea.innerHTML = `

<img
class="image"
src="${escapeHtml(
data.image_url
)}"
alt="${escapeHtml(
data.title ||
"Offer"
)}"
>

`;

}else{

imageArea.innerHTML = `

<div class="placeholder">
🎁
</div>

`;

}


/* Content */

title.textContent =
data.title ||
"Untitled Offer";

description.textContent =
data.description ||
"No description available.";

status.textContent =
"Active";

date.textContent =
formatDate(
data.created_at
);

document.title =
(data.title ||
"Offer Details") +
" - Income Offers";


/* Button */

if(data.offer_url){

openButton.disabled =
false;

message.textContent =
"Review the offer details before continuing.";

}else{

openButton.disabled =
true;

message.textContent =
"This offer does not have an active destination link.";

}


/*
  Record a page view.

  event_type must be:
  view, click, start, complete
*/

await logActivity(
"view",
data.id,
"offer_view",
{
source:
"offer-details.html"
});


await updateProgress(
data.id
);

}


/* =========================
   OPEN OFFER
========================= */

openButton.addEventListener(
"click",
async function(){

if(
!currentOffer ||
!currentOffer.offer_url
){

message.textContent =
"Offer link is not available.";

return;

}


openButton.disabled =
true;

openButton.textContent =
"Opening...";


await registerOfferClick(
currentOffer.id
);


/*
  Open the configured
  offer destination.
*/

window.location.href =
currentOffer.offer_url;

});


/* =========================
   TOUCH EFFECT
========================= */

document.addEventListener(
"pointerdown",
function(event){

const target =
event.target.closest(
"button,a"
);

if(!target){
return;
}

const ripple =
document.createElement("span");

ripple.className =
"ripple";

ripple.style.left =
event.clientX + "px";

ripple.style.top =
event.clientY + "px";

document.body.appendChild(
ripple
);

setTimeout(
function(){

ripple.remove();

},
600
);

});


/* =========================
   START
========================= */

loadOffer();

</script>

</body>
</html>
