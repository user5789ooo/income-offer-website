<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>Offer Details - Nexum</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #050505;
      color: white;

      font-family:
        'Geist',
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      -webkit-font-smoothing: antialiased;

      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255,255,255,.08),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(255,255,255,.05),
          transparent 35%
        ),
        #050505;

      overflow: hidden;
    }

    .background::before {
      content: "";

      position: absolute;

      width: 450px;
      height: 450px;

      left: -200px;
      top: 20%;

      border-radius: 50%;

      background: white;

      filter: blur(130px);

      opacity: .08;

      animation:
        glowMove
        12s
        ease-in-out
        infinite alternate;
    }

    @keyframes glowMove {

      from {
        transform:
          translate(0,0)
          scale(1);
      }

      to {
        transform:
          translate(130px,-50px)
          scale(1.2);
      }

    }

    /* =========================
       HEADER
    ========================= */

    header {

      position: sticky;

      top: 0;

      z-index: 20;

      border-bottom:
        1px solid
        rgba(255,255,255,.08);

      background:
        rgba(5,5,5,.72);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);
    }

    .nav {

      max-width: 1000px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        17px 20px;
    }

    .brand {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      font-size: 18px;

      font-weight: 700;
    }

    .brand svg {

      width: 24px;
      height: 24px;

      fill: white;

      transition:
        transform .5s ease;
    }

    .brand:hover svg {

      transform:
        rotate(180deg);
    }

    .back-button {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        9px 14px;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 999px;

      background:
        rgba(255,255,255,.06);

      color:
        rgba(255,255,255,.75);

      font-size: 13px;

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .back-button:hover {

      background:
        rgba(255,255,255,.12);

      color: white;

      transform:
        translateX(-2px);
    }

    /* =========================
       MAIN
    ========================= */

    .container {

      width: 100%;

      max-width: 820px;

      margin: auto;

      padding:
        50px 20px 100px;
    }

    .offer-card {

      overflow: hidden;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 26px;

      background:
        rgba(255,255,255,.065);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        0 25px 90px
        rgba(0,0,0,.35);

      animation:
        cardIn
        .8s
        cubic-bezier(.16,1,.3,1);
    }

    @keyframes cardIn {

      from {

        opacity: 0;

        transform:
          translateY(30px)
          scale(.97);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

    /* =========================
       IMAGE
    ========================= */

    .image-wrap {

      position: relative;

      width: 100%;

      aspect-ratio:
        16 / 8;

      overflow: hidden;

      background:
        rgba(255,255,255,.05);
    }

    .offer-image {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      animation:
        imageIn
        1s
        cubic-bezier(.16,1,.3,1);
    }

    @keyframes imageIn {

      from {

        opacity: 0;

        transform:
          scale(1.06);
      }

      to {

        opacity: 1;

        transform:
          scale(1);
      }

    }

    .image-placeholder {

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 60px;

      color:
        rgba(255,255,255,.25);
    }

    .status {

      position: absolute;

      top: 15px;
      left: 15px;

      padding:
        7px 11px;

      border-radius: 999px;

      background:
        rgba(0,0,0,.65);

      border:
        1px solid
        rgba(255,255,255,.12);

      backdrop-filter:
        blur(10px);

      color:
        #8dffa9;

      font-size: 11px;

      font-weight: 600;

      text-transform:
        uppercase;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {

      padding:
        27px;
    }

    .eyebrow {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 12px;

      color:
        rgba(255,255,255,.45);

      font-size: 11px;

      font-weight: 600;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;
    }

    .dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        #8dffa9;

      box-shadow:
        0 0 12px
        rgba(141,255,169,.7);
    }

    h1 {

      margin: 0;

      font-size:
        clamp(
          2rem,
          6vw,
          3.4rem
        );

      line-height: 1.05;

      letter-spacing:
        -.05em;
    }

    .description {

      margin:
        17px 0 0;

      color:
        rgba(255,255,255,.58);

      font-size: 15px;

      line-height: 1.7;

      white-space:
        pre-line;
    }

    /* =========================
       INFO
    ========================= */

    .info {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          1fr
        );

      gap: 10px;

      margin-top: 25px;
    }

    .info-box {

      padding:
        15px;

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius: 15px;

      background:
        rgba(255,255,255,.045);
    }

    .info-label {

      color:
        rgba(255,255,255,.35);

      font-size: 11px;

      margin-bottom: 5px;

      text-transform:
        uppercase;
    }

    .info-value {

      color:
        rgba(255,255,255,.85);

      font-size: 13px;

      font-weight: 500;
    }

    /* =========================
       OPEN BUTTON
    ========================= */

    .open-button {

      width: 100%;

      margin-top: 25px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      padding:
        15px 20px;

      border: 0;

      border-radius: 999px;

      background:
        linear-gradient(
          to bottom,
          #ffffff,
          #dedede
        );

      color: #111;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        opacity .25s ease;
    }

    .open-button:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 15px 40px
        rgba(255,255,255,.12);
    }

    .open-button:active {

      transform:
        scale(.97);
    }

    .open-button:disabled {

      opacity: .5;

      cursor:
        not-allowed;

      transform: none;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {

      margin-top: 15px;

      padding:
        12px 14px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.05);

      color:
        rgba(255,255,255,.55);

      font-size: 12px;

      line-height: 1.5;

      text-align: center;
    }

    /* =========================
       ERROR
    ========================= */

    .error {

      max-width: 600px;

      margin: 80px auto;

      padding:
        35px 20px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 22px;

      background:
        rgba(255,255,255,.05);

      text-align: center;

      animation:
        cardIn
        .7s
        ease;
    }

    .error-icon {

      font-size: 45px;

      margin-bottom: 12px;
    }

    .error h2 {

      margin:
        0 0 8px;

      font-size: 22px;
    }

    .error p {

      margin: 0;

      color:
        rgba(255,255,255,.45);

      font-size: 13px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 520px) {

      .container {

        padding:
          30px 14px 100px;
      }

      .content {

        padding:
          21px;
      }

      .info {

        grid-template-columns:
          1fr;
      }

      .image-wrap {

        aspect-ratio:
          16 / 10;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          .01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          .01ms !important;
      }

    }
  </style>
</head>

<body>

  <div class="background"></div>

  <!-- HEADER -->

  <header>

    <nav class="nav">

      <a
        class="brand"
        href="index.html"
      >

        <svg
          viewBox="0 0 256 256"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="
            M128 128
            C128 198.692 70.692 256 0 256
            C0 185.308 57.308 128 128 128Z

            M128 128
            C198.692 128 256 185.308 256 256
            C185.308 256 128 198.692 128 128Z

            M0 0
            C70.692 0 128 57.308 128 128
            C57.308 128 0 70.692 0 0Z

            M256 0
            C256 70.692 198.692 128 128 128
            C128 57.308 185.308 0 256 0Z
          "/>
        </svg>

        <span>Nexum</span>

      </a>

      <a
        class="back-button"
        href="offer.html"
      >
        ← Back to Offers
      </a>

    </nav>

  </header>


  <!-- MAIN -->

  <main
    class="container"
    id="mainContent"
  >

    <div class="offer-card">

      <div
        class="image-wrap"
        id="imageWrap"
      >

        <div
          class="image-placeholder"
        >
          🎁
        </div>

        <span class="status">
          Loading
        </span>

      </div>


      <div class="content">

        <div class="eyebrow">

          <span class="dot"></span>

          <span id="category">
            Offer Details
          </span>

        </div>

        <h1 id="offerTitle">
          Loading offer...
        </h1>

        <p
          class="description"
          id="offerDescription"
        >
          Please wait while the offer details are loaded.
        </p>


        <div class="info">

          <div class="info-box">

            <div class="info-label">
              Status
            </div>

            <div
              class="info-value"
              id="offerStatus"
            >
              Loading...
            </div>

          </div>


          <div class="info-box">

            <div class="info-label">
              Added
            </div>

            <div
              class="info-value"
              id="offerDate"
            >
              Loading...
            </div>

          </div>

        </div>


        <button
          class="open-button"
          id="openButton"
          type="button"
          disabled
        >
          🚀 Open Offer
        </button>

        <div
          class="message"
          id="message"
        >
          Loading offer information...
        </div>

      </div>

    </div>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );

    const offerId =
      params.get("id");


    const imageWrap =
      document.getElementById(
        "imageWrap"
      );

    const offerTitle =
      document.getElementById(
        "offerTitle"
      );

    const offerDescription =
      document.getElementById(
        "offerDescription"
      );

    const offerStatus =
      document.getElementById(
        "offerStatus"
      );

    const offerDate =
      document.getElementById(
        "offerDate"
      );

    const openButton =
      document.getElementById(
        "openButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    let currentOffer = null;


    /* =========================
       DATE
    ========================= */

    function formatDate(
      value
    ) {

      if (!value) {
        return "Recently added";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "Recently added";
      }

      return date.toLocaleDateString(
        undefined,
        {
          day: "numeric",
          month: "short",
          year: "numeric"
        }
      );

    }


    /* =========================
       ACTIVITY
    ========================= */

    async function logActivity(
      action,
      offerId
    ) {

      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient
            .auth
            .getUser();

        if (!user) return;

        await supabaseClient
          .from("activity_logs")
          .insert({

            user_id:
              user.id,

            action:
              action,

            offer_id:
              offerId,

            page:
              "offer-details.html",

            metadata:
              {}

          });

      } catch (error) {

        console.log(
          "Activity logging skipped"
        );

      }

    }


    /* =========================
       ERROR PAGE
    ========================= */

    function showError(
      title,
      text
    ) {

      document.getElementById(
        "mainContent"
      ).innerHTML = `

        <div class="error">

          <div class="error-icon">
            ⚠️
          </div>

          <h2>
            ${title}
          </h2>

          <p>
            ${text}
          </p>

          <br>

          <a
            class="back-button"
            href="offer.html"
          >
            ← Back to Offers
          </a>

        </div>

      `;

    }


    /* =========================
       LOAD OFFER
    ========================= */

    async function loadOffer() {

      if (!offerId) {

        showError(
          "Offer not found",
          "No offer ID was provided."
        );

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("offers")
          .select("*")
          .eq("id", offerId)
          .eq("status", "active")
          .single();


      if (error || !data) {

        console.error(error);

        showError(
          "Offer unavailable",
          "This offer may have been removed or is no longer active."
        );

        return;

      }


      currentOffer =
        data;


      /* =====================
         IMAGE
      ===================== */

      if (data.image_url) {

        imageWrap.innerHTML = `

          <img
            class="offer-image"
            src="${escapeHtml(
              data.image_url
            )}"
            alt="${escapeHtml(
              data.title ||
              "Offer"
            )}"
          >

          <span class="status">
            ● Active
          </span>

        `;

      } else {

        imageWrap.innerHTML = `

          <div class="image-placeholder">
            🎁
          </div>

          <span class="status">
            ● Active
          </span>

        `;

      }


      /* =====================
         CONTENT
      ===================== */

      offerTitle.textContent =
        data.title ||
        "Untitled Offer";


      offerDescription.textContent =
        data.description ||
        "No description available.";


      offerStatus.textContent =
        data.status === "active"
          ? "Active"
          : "Inactive";


      offerDate.textContent =
        formatDate(
          data.created_at
        );


      openButton.disabled =
        !data.offer_url;


      if (data.offer_url) {

        message.textContent =
          "Tap the button below to continue to the offer.";

      } else {

        message.textContent =
          "The offer link has not been added yet.";

      }


      /* =====================
         PAGE TITLE
      ===================== */

      document.title =
        (data.title ||
          "Offer Details") +
        " - Nexum";


      /* =====================
         ACTIVITY
      ===================== */

      logActivity(
        "offer_view",
        data.id
      );

    }


    /* =========================
       OPEN OFFER
    ========================= */

    openButton.addEventListener(
      "click",
      async function() {

        if (
          !currentOffer ||
          !currentOffer.offer_url
        ) {

          message.textContent =
            "Offer link is not available.";

          return;

        }


        openButton.disabled =
          true;

        message.textContent =
          "Opening offer...";


        await logActivity(
          "offer_click",
          currentOffer.id
        );


        /*
          Small delay so the activity
          request can start before
          navigation.
        */

        setTimeout(
          function() {

            window.open(
              currentOffer.offer_url,
              "_blank",
              "noopener,noreferrer"
            );

            openButton.disabled =
              false;

            message.textContent =
              "Offer opened in a new tab.";

          },
          180
        );

      }
    );


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(
      value
    ) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        value ?? "";

      return div.innerHTML;

    }


    /* =========================
       START
    ========================= */

    loadOffer();

  </script>

</body>
</html>
