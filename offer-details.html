<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Offer Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#050505;
  color:white;
  font-family:'Geist',Arial,sans-serif;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

.background{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.08),transparent 35%),
    radial-gradient(circle at 90% 85%,rgba(255,255,255,.05),transparent 35%),
    #050505;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(5,5,5,.75);
  backdrop-filter:blur(20px);
}

.nav{
  max-width:1000px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:19px;
  font-weight:700;
}

.brand svg{
  width:25px;
  height:25px;
  fill:white;
}

.back{
  padding:10px 15px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;
  background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.8);
  font-size:13px;
}

.container{
  max-width:820px;
  margin:auto;
  padding:45px 20px 100px;
}

.card{
  overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  border-radius:25px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(20px);
}

.image{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
}

.placeholder{
  width:100%;
  aspect-ratio:16/9;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  font-size:55px;
}

.content{
  padding:26px;
}

.eyebrow{
  color:rgba(255,255,255,.45);
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:12px;
}

h1{
  margin:0;
  font-size:clamp(2rem,6vw,3.4rem);
  line-height:1.05;
  letter-spacing:-.05em;
}

.description{
  margin:17px 0 0;
  color:rgba(255,255,255,.58);
  font-size:15px;
  line-height:1.7;
  white-space:pre-line;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:25px;
}

.info-box{
  padding:15px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
  background:rgba(255,255,255,.04);
}

.label{
  color:rgba(255,255,255,.35);
  font-size:11px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.value{
  font-size:14px;
  font-weight:500;
}

.open{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:999px;
  background:white;
  color:#111;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.open:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.message{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.55);
  font-size:12px;
  text-align:center;
  line-height:1.5;
}

.error{
  padding:50px 20px;
  text-align:center;
}

.error h2{
  margin:10px 0;
}

.error p{
  color:rgba(255,255,255,.5);
  font-size:13px;
}

@media(max-width:520px){
  .container{
    padding:30px 14px 100px;
  }

  .content{
    padding:21px;
  }

  .info{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="background"></div>

<header>
<nav class="nav">

<a class="brand" href="index.html">

<svg viewBox="0 0 256 256">
<path d="
M128 128
C128 198.692 70.692 256 0 256
C0 185.308 57.308 128 128 128Z
M128 128
C198.692 128 256 185.308 256 256
C185.308 256 128 198.692 128 128Z
M0 0
C70.692 0 128 57.308 128 128
C57.308 128 0 70.692 0 0Z
M256 0
C256 70.692 198.692 128 128 128
C128 57.308 185.308 0 256 0Z"/>
</svg>

<span>Offers</span>

</a>

<a class="back" href="offer.html">
← Back to Offers
</a>

</nav>
</header>


<main class="container">

<div class="card" id="card">

<div id="imageArea">
<div class="placeholder">🎁</div>
</div>

<div class="content">

<div class="eyebrow">
● OFFER DETAILS
</div>

<h1 id="title">
Loading offer...
</h1>

<p class="description" id="description">
Please wait while the offer details are loaded.
</p>

<div class="info">

<div class="info-box">
<div class="label">Status</div>
<div class="value" id="status">
Loading...
</div>
</div>

<div class="info-box">
<div class="label">Added</div>
<div class="value" id="date">
Loading...
</div>
</div>

</div>

<button
class="open"
id="openButton"
disabled
>
🚀 Open Offer
</button>

<div class="message" id="message">
Loading offer information...
</div>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

/*
IMPORTANT:
supabase-config.js already creates:

const supabaseClient = ...

So DO NOT create another client here.
*/


const params =
new URLSearchParams(
window.location.search
);

const offerId =
params.get("id");


const title =
document.getElementById("title");

const description =
document.getElementById("description");

const status =
document.getElementById("status");

const date =
document.getElementById("date");

const imageArea =
document.getElementById("imageArea");

const openButton =
document.getElementById("openButton");

const message =
document.getElementById("message");


let currentOffer = null;


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

const div =
document.createElement("div");

div.textContent =
value ?? "";

return div.innerHTML;

}


/* =========================
   DATE
========================= */

function formatDate(value){

if(!value){
return "Recently added";
}

const d =
new Date(value);

if(Number.isNaN(d.getTime())){
return "Recently added";
}

return d.toLocaleDateString(
undefined,
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


/* =========================
   ACTIVITY
========================= */

async function logActivity(
action,
offerIdValue=null
){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getUser();

if(error || !data.user){

console.log(
"Activity user unavailable",
error
);

return;

}

const result =
await supabaseClient
.from("activity_logs")
.insert({
user_id:data.user.id,
action:action,
offer_id:offerIdValue,
page:"offer-details.html",
metadata:{}
});

if(result.error){

console.error(
"Activity insert error:",
result.error
);

}

}catch(error){

console.error(
"Activity error:",
error
);

}

}


/* =========================
   ERROR
========================= */

function showError(
heading,
text
){

document.getElementById(
"card"
).innerHTML = `

<div class="error">

<div style="font-size:45px">
⚠️
</div>

<h2>
${escapeHtml(heading)}
</h2>

<p>
${escapeHtml(text)}
</p>

<br>

<a
class="back"
href="offer.html"
>
← Back to Offers
</a>

</div>

`;

}


/* =========================
   LOAD OFFER
========================= */

async function loadOffer(){

if(!offerId){

showError(
"Offer not found",
"No offer ID was provided."
);

return;

}


/*
Check login first.
*/

const {
data:sessionData,
error:sessionError
} =
await supabaseClient
.auth
.getSession();

if(sessionError){

console.error(
sessionError
);

showError(
"Session error",
"Please login again."
);

return;

}

if(!sessionData.session){

window.location.replace(
"login.html"
);

return;

}


/*
Load exact offer.
*/

const {
data,
error
} =
await supabaseClient
.from("offers")
.select("*")
.eq("id",offerId)
.single();


if(error){

console.error(
"Offer load error:",
error
);

showError(
"Unable to load offer",
error.message ||
"Please try again."
);

return;

}


if(!data){

showError(
"Offer not found",
"This offer does not exist."
);

return;

}


/*
Only active offers can be opened.
*/

if(data.status !== "active"){

showError(
"Offer unavailable",
"This offer is currently inactive."
);

return;

}


currentOffer =
data;


/* IMAGE */

if(data.image_url){

imageArea.innerHTML = `

<img
class="image"
src="${escapeHtml(data.image_url)}"
alt="${escapeHtml(data.title || "Offer")}"
>

`;

}else{

imageArea.innerHTML = `

<div class="placeholder">
🎁
</div>

`;

}


/* CONTENT */

title.textContent =
data.title ||
"Untitled Offer";

description.textContent =
data.description ||
"No description available.";

status.textContent =
"Active";

date.textContent =
formatDate(data.created_at);


/* LINK */

if(data.offer_url){

openButton.disabled =
false;

message.textContent =
"Tap the button below to continue to the offer.";

}else{

openButton.disabled =
true;

message.textContent =
"This offer does not have an offer link yet.";

}


/* PAGE TITLE */

document.title =
(data.title || "Offer Details") +
" - Offers";


/*
Record page view.
Don't wait for it.
*/

logActivity(
"offer_view",
data.id
);

}


/* =========================
   OPEN OFFER
========================= */

openButton.addEventListener(
"click",
async function(){

if(
!currentOffer ||
!currentOffer.offer_url
){

message.textContent =
"Offer link is not available.";

return;

}


const url =
currentOffer.offer_url;


/*
Log click.
*/

logActivity(
"offer_click",
currentOffer.id
);


/*
Use direct navigation.
This avoids popup blocking.
*/

message.textContent =
"Opening offer...";

window.location.href =
url;

}
);


/* =========================
   START
========================= */

loadOffer();

</script>

</body>
</html>
