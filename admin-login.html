<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    .icon {
      text-align: center;
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="icon">🔐</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Login to manage your website
    </p>

    <form id="loginForm">

      <label for="email">Admin Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        autocomplete="email"
        required>

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required>

      <button
        type="submit"
        id="loginButton">
        Login
      </button>

    </form>

    <p id="message" class="message"></p>

    <a href="index.html" class="back">
      ← Back to Home
    </a>

  </div>


  <!-- Supabase library -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase configuration -->

  <script src="supabase-config.js"></script>


  <script>

    const ADMIN_UUID =
      "8f49db4a-d528-49c1-b815-f6bc15e1c868";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        const button =
          document.getElementById("loginButton");


        button.disabled = true;

        message.textContent =
          "Logging in...";


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          console.error(error);

          message.textContent =
            "Login failed: " + error.message;

          button.disabled = false;

          return;
        }


        if (!data.user ||
            data.user.id !== ADMIN_UUID) {

          await supabaseClient.auth.signOut();

          message.textContent =
            "Access denied. This account is not the Admin.";

          button.disabled = false;

          return;
        }


        message.textContent =
          "Login successful. Opening Admin Panel...";


        window.location.href =
          "admin.html";

      });

  </script>

</body>
</html>
