<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .icon {
      text-align: center;
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="icon">🔐</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Login to manage your website
    </p>

    <form id="loginForm">

      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        placeholder="Enter username"
        required>

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required>

      <button type="submit">
        Login
      </button>

    </form>

    <p id="message" class="message"></p>

    <a href="index.html" class="back">
      ← Back to Home
    </a>

  </div>

  <script>
    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value;

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        /*
          IMPORTANT:
          This is only the login screen.

          Real admin authentication will be added
          later using a secure backend/database.
        */

        if (username && password) {

          message.textContent =
            "Login system will be connected securely in the next step.";

        } else {

          message.textContent =
            "Please enter username and password.";

        }

      });
  </script>

</body>
</html>
