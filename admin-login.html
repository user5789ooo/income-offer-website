<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SAHIL - Admin Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  filter:blur(90px);
  top:-180px;
  left:-120px;
  animation:floatOne 8s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  width:380px;
  height:380px;
  border-radius:50%;
  background:rgba(255,255,255,.045);
  filter:blur(90px);
  right:-150px;
  bottom:-160px;
  animation:floatTwo 10s ease-in-out infinite alternate;
}

@keyframes floatOne{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(80px,70px);
  }
}

@keyframes floatTwo{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(-70px,-60px);
  }
}

.login-box{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  padding:30px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(25px);
  box-shadow:
    0 30px 100px rgba(0,0,0,.55);
  animation:boxIn .7s cubic-bezier(.16,1,.3,1);
}

@keyframes boxIn{
  from{
    opacity:0;
    transform:translateY(30px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.logo{
  width:72px;
  height:72px;
  margin:0 auto 20px;
  border-radius:21px;
  background:white;
  color:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:800;
  box-shadow:0 10px 40px rgba(255,255,255,.12);
  animation:logoPulse 2.5s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.05);
  }
}

h1{
  text-align:center;
  font-size:30px;
  letter-spacing:-.04em;
}

.subtitle{
  margin-top:8px;
  text-align:center;
  color:rgba(255,255,255,.45);
  font-size:13px;
}

label{
  display:block;
  margin:22px 0 8px;
  color:rgba(255,255,255,.75);
  font-size:13px;
  font-weight:600;
}

input{
  width:100%;
  padding:15px 16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  outline:none;
  background:rgba(255,255,255,.06);
  color:white;
  font-size:15px;
  transition:
    border-color .2s,
    background .2s,
    transform .2s;
}

input:focus{
  border-color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.09);
  transform:translateY(-1px);
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:55px;
}

.eye{
  position:absolute;
  top:50%;
  right:5px;
  width:45px;
  height:45px;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:white;
  cursor:pointer;
  font-size:19px;
}

.login-button{
  width:100%;
  margin-top:24px;
  padding:15px;
  border:0;
  border-radius:999px;
  background:white;
  color:#111;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:
    transform .2s,
    opacity .2s;
}

.login-button:hover{
  transform:translateY(-2px);
}

.login-button:active{
  transform:scale(.98);
}

.login-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  min-height:20px;
  margin-top:15px;
  text-align:center;
  font-size:13px;
  line-height:1.5;
}

.back{
  display:block;
  margin-top:22px;
  text-align:center;
  color:rgba(255,255,255,.4);
  font-size:13px;
  text-decoration:none;
}

.back:hover{
  color:white;
}

.admin-badge{
  margin:22px auto 0;
  width:max-content;
  padding:6px 11px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.45);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

</style>

</head>

<body>

<div class="login-box">

  <div class="logo">
    S
  </div>

  <h1>
    Admin Access
  </h1>

  <p class="subtitle">
    Sign in to manage SAHIL
  </p>


  <form id="adminLoginForm">

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter admin email"
      autocomplete="email"
      required
    >


    <label for="password">
      Password
    </label>

    <div class="password-box">

      <input
        id="password"
        type="password"
        placeholder="Enter admin password"
        autocomplete="current-password"
        required
      >

      <button
        class="eye"
        id="eyeButton"
        type="button"
      >
        👁️
      </button>

    </div>


    <button
      class="login-button"
      id="loginButton"
      type="submit"
    >
      Login
    </button>

  </form>


  <div
    class="message"
    id="message"
  ></div>


  <div class="admin-badge">
    Restricted Admin Area
  </div>


  <a
    class="back"
    href="index.html"
  >
    ← Back to Home
  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

const ADMIN_UUID =
"8f49db4a-d528-49c1-b815-f6bc15e1c868";


const form =
document.getElementById(
  "adminLoginForm"
);

const emailInput =
document.getElementById(
  "email"
);

const passwordInput =
document.getElementById(
  "password"
);

const loginButton =
document.getElementById(
  "loginButton"
);

const message =
document.getElementById(
  "message"
);

const eyeButton =
document.getElementById(
  "eyeButton"
);


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success=false
){

  message.textContent =
    text;

  message.style.color =
    success
      ? "#8dffa9"
      : "#ff7777";

}


/* =========================
   PASSWORD VISIBILITY
========================= */

eyeButton.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      eyeButton.textContent =
        "🙈";

    }else{

      passwordInput.type =
        "password";

      eyeButton.textContent =
        "👁️";

    }

  }
);


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkExistingAdmin(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if(
      !error &&
      data &&
      data.user &&
      data.user.id === ADMIN_UUID
    ){

      window.location.replace(
        "admin.html"
      );

    }

  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================
   LOGIN
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    if(!email || !password){

      showMessage(
        "Please enter email and password."
      );

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Signing in...";


    showMessage(
      "Checking admin access...",
      true
    );


    try{

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email:
              email,

            password:
              password

          });


      if(error){

        console.error(
          "Admin login error:",
          error
        );

        showMessage(
          "Invalid email or password."
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        return;

      }


      if(
        !data ||
        !data.user ||
        !data.session
      ){

        showMessage(
          "Unable to create a session."
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        return;

      }


      /*
        Verify the authenticated user
        is the authorized admin.
      */

      if(
        data.user.id !==
        ADMIN_UUID
      ){

        await supabaseClient
          .auth
          .signOut();

        showMessage(
          "Access denied."
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        return;

      }


      showMessage(
        "Admin login successful.",
        true
      );


      loginButton.textContent =
        "Opening Dashboard...";


      setTimeout(
        function(){

          window.location.replace(
            "admin.html"
          );

        },
        600
      );


    }catch(error){

      console.error(
        "Admin login exception:",
        error
      );

      showMessage(
        "Something went wrong. Please try again."
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }

  }
);


/* =========================
   START
========================= */

checkExistingAdmin();

</script>

</body>
</html>
