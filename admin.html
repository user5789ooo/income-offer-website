<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Admin Dashboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6fa;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
}

header h1{
  font-size:22px;
}

header p{
  margin-top:5px;
  font-size:13px;
  opacity:.8;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.section{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.section h2{
  margin-bottom:15px;
  font-size:19px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:15px;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.primary{
  width:100%;
  margin-top:16px;
  background:#111827;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.offer-item,
.activity-item{
  border:1px solid #e5e7eb;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.offer-item h3,
.activity-item h3{
  margin-bottom:7px;
}

.offer-item p,
.activity-item p{
  color:#666;
  font-size:14px;
  line-height:1.5;
  margin-bottom:5px;
  word-break:break-word;
}

.offer-image{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

.status{
  display:inline-block;
  margin-top:9px;
  font-size:13px;
  font-weight:bold;
}

.active{
  color:#16803a;
}

.inactive{
  color:#777;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.actions button{
  flex:1;
  min-width:100px;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#f5f6fa;
  font-size:14px;
  line-height:1.5;
}

.logout{
  width:100%;
  background:#fee2e2;
  color:#991b1b;
  margin-bottom:30px;
}

.loading{
  text-align:center;
  color:#777;
  padding:15px;
}

.refresh{
  width:100%;
  margin-bottom:15px;
  background:#e5e7eb;
}

.activity-action{
  display:inline-block;
  margin-bottom:10px;
  padding:6px 10px;
  border-radius:999px;
  background:#111827;
  color:white;
  font-size:12px;
  font-weight:bold;
}

.activity-time{
  color:#777;
  font-size:12px;
  margin-top:10px;
}

.user-email{
  color:#111827;
  font-weight:bold;
}

.offer-name{
  color:#111827;
  font-weight:bold;
}

.top-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.top-actions button{
  flex:1;
}

@media(max-width:500px){

  .container{
    padding:12px;
  }

  .section{
    padding:16px;
  }

  .actions{
    flex-direction:column;
  }

  .actions button{
    width:100%;
  }

}

</style>

</head>


<body>


<header>

<h1>
🔐 Admin Dashboard
</h1>

<p>
Manage Income Offers & User Activity
</p>

</header>


<main class="container">


<!-- ADMIN STATUS -->

<section class="section">

<h2>
👤 Admin Account
</h2>

<p id="adminEmail">
Checking admin session...
</p>

<div class="top-actions">

<button
class="secondary"
id="refreshAllButton"
>
↻ Refresh All
</button>

<button
class="secondary"
id="homeButton"
>
🏠 Website
</button>

</div>

</section>


<!-- ADD / EDIT OFFER -->

<section class="section">

<h2 id="formTitle">
➕ Add New Offer
</h2>

<input
type="hidden"
id="editId"
>

<label>
Offer Name
</label>

<input
type="text"
id="offerName"
placeholder="Example: New User Offer"
>

<label>
Description
</label>

<textarea
id="offerDescription"
placeholder="Write offer details..."
></textarea>

<label>
Image URL
</label>

<input
type="url"
id="offerImage"
placeholder="https://example.com/image.jpg"
>

<label>
Offer Link
</label>

<input
type="url"
id="offerLink"
placeholder="https://example.com/offer"
>

<label>
Status
</label>

<select id="offerStatus">

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>

<button
class="primary"
id="saveButton"
>
Save Offer
</button>

<button
class="primary secondary"
id="cancelButton"
style="display:none"
>
Cancel Edit
</button>

<div id="message"></div>

</section>


<!-- CURRENT OFFERS -->

<section class="section">

<h2>
🎁 Current Offers
</h2>

<div id="offerList">

<div class="loading">
Loading offers...
</div>

</div>

</section>


<!-- USER ACTIVITY -->

<section class="section">

<h2>
📊 User Activity
</h2>

<button
class="refresh"
id="refreshActivityButton"
>
↻ Refresh Activity
</button>

<div id="activityList">

<div class="loading">
Loading user activity...
</div>

</div>

</section>


<!-- LOGOUT -->

<button
class="logout"
id="logoutButton"
>
🚪 Logout
</button>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script
src="supabase-config.js">
</script>


<script>


/* =========================
   ADMIN
========================= */

const ADMIN_UUID =
"8f49db4a-d528-49c1-b815-f6bc15e1c868";


/*
 IMPORTANT:

 এখানে আর createClient()
 করা হয়নি।

 supabaseClient এসেছে
 supabase-config.js থেকে।
*/


/* =========================
   ELEMENTS
========================= */

const adminEmail =
document.getElementById(
  "adminEmail"
);

const offerList =
document.getElementById(
  "offerList"
);

const activityList =
document.getElementById(
  "activityList"
);

const message =
document.getElementById(
  "message"
);

const saveButton =
document.getElementById(
  "saveButton"
);

const cancelButton =
document.getElementById(
  "cancelButton"
);

const logoutButton =
document.getElementById(
  "logoutButton"
);


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  message.innerHTML =
    `<div class="message">
      ${escapeHtml(text)}
    </div>`;

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* =========================
   ADMIN SESSION
========================= */

async function getAdminSession(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .getSession();


    if(error){

      console.error(error);

      return null;

    }


    const session =
      data.session;


    if(!session){

      window.location.replace(
        "admin-login.html"
      );

      return null;

    }


    if(
      session.user.id !==
      ADMIN_UUID
    ){

      await supabaseClient
        .auth
        .signOut();

      window.location.replace(
        "admin-login.html"
      );

      return null;

    }


    adminEmail.textContent =
      "Logged in as: " +
      (session.user.email ||
       "Admin");


    return session;

  }catch(error){

    console.error(error);

    window.location.replace(
      "admin-login.html"
    );

    return null;

  }

}


/* =========================
   LOAD OFFERS
========================= */

async function loadOffers(){

  const session =
    await getAdminSession();

  if(!session){
    return;
  }


  offerList.innerHTML =
    `<div class="loading">
      Loading offers...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("offers")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    offerList.innerHTML =
      `<div class="loading">
        Unable to load offers.
        <br><br>
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    offerList.innerHTML =
      `<div class="loading">
        No offers found.
      </div>`;

    return;

  }


  offerList.innerHTML =
    "";


  data.forEach(
    function(offer){

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "offer-item";


      item.innerHTML = `

        ${
          offer.image_url
          ?
          `
          <img
            class="offer-image"
            src="${escapeHtml(
              offer.image_url
            )}"
            alt="Offer"
          >
          `
          :
          ""
        }

        <h3>
          ${escapeHtml(
            offer.title ||
            "Untitled Offer"
          )}
        </h3>

        <p>
          ${escapeHtml(
            offer.description ||
            ""
          )}
        </p>

        <p>
          🔗
          ${escapeHtml(
            offer.offer_url ||
            "No offer link"
          )}
        </p>

        <span
          class="status ${
            offer.status === "active"
            ? "active"
            : "inactive"
          }"
        >
          ●
          ${escapeHtml(
            offer.status ||
            "unknown"
          )}
        </span>

        <div class="actions">

          <button
            class="secondary"
            data-edit="${escapeHtml(
              offer.id
            )}"
          >
            ✏️ Edit
          </button>

          <button
            class="secondary"
            data-toggle="${escapeHtml(
              offer.id
            )}"
            data-status="${escapeHtml(
              offer.status
            )}"
          >
            ${
              offer.status === "active"
              ? "⏸️ Turn OFF"
              : "▶️ Turn ON"
            }
          </button>

          <button
            class="danger"
            data-delete="${escapeHtml(
              offer.id
            )}"
          >
            🗑️ Delete
          </button>

        </div>
      `;


      offerList.appendChild(
        item
      );

    }
  );


  /* EDIT */

  offerList
    .querySelectorAll(
      "[data-edit]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            editOffer(
              button.dataset.edit
            );

          }
        );

      }
    );


  /* TOGGLE */

  offerList
    .querySelectorAll(
      "[data-toggle]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            toggleOffer(
              button.dataset.toggle,
              button.dataset.status
            );

          }
        );

      }
    );


  /* DELETE */

  offerList
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            deleteOffer(
              button.dataset.delete
            );

          }
        );

      }
    );

}


/* =========================
   SAVE OFFER
========================= */

async function saveOffer(){

  const session =
    await getAdminSession();

  if(!session){
    return;
  }


  const name =
    document
      .getElementById(
        "offerName"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "offerDescription"
      )
      .value
      .trim();


  const image =
    document
      .getElementById(
        "offerImage"
      )
      .value
      .trim();


  const link =
    document
      .getElementById(
        "offerLink"
      )
      .value
      .trim();


  const status =
    document
      .getElementById(
        "offerStatus"
      )
      .value;


  const editId =
    document
      .getElementById(
        "editId"
      )
      .value;


  if(!name){

    showMessage(
      "Please enter an offer name."
    );

    return;

  }


  saveButton.disabled =
    true;

  saveButton.textContent =
    editId
    ? "Updating..."
    : "Saving...";


  const offerData = {

    title:name,

    description:description,

    image_url:image,

    offer_url:link,

    status:status

  };


  let result;


  if(editId){

    result =
      await supabaseClient
        .from("offers")
        .update(
          offerData
        )
        .eq(
          "id",
          editId
        );

  }else{

    result =
      await supabaseClient
        .from("offers")
        .insert([
          offerData
        ]);

  }


  if(result.error){

    console.error(
      result.error
    );

    showMessage(
      "Error: " +
      result.error.message
    );

    saveButton.disabled =
      false;

    saveButton.textContent =
      editId
      ? "Update Offer"
      : "Save Offer";

    return;

  }


  showMessage(
    editId
    ? "Offer updated successfully! ✅"
    : "Offer added successfully! ✅"
  );


  cancelEdit();

  await loadOffers();

}


/* =========================
   EDIT OFFER
========================= */

async function editOffer(id){

  const session =
    await getAdminSession();

  if(!session){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("offers")
    .select("*")
    .eq(
      "id",
      id
    )
    .single();


  if(error){

    alert(
      "Unable to load offer: " +
      error.message
    );

    return;

  }


  document.getElementById(
    "editId"
  ).value =
    data.id;


  document.getElementById(
    "offerName"
  ).value =
    data.title || "";


  document.getElementById(
    "offerDescription"
  ).value =
    data.description || "";


  document.getElementById(
    "offerImage"
  ).value =
    data.image_url || "";


  document.getElementById(
    "offerLink"
  ).value =
    data.offer_url || "";


  document.getElementById(
    "offerStatus"
  ).value =
    data.status || "active";


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Edit Offer";


  saveButton.textContent =
    "Update Offer";


  cancelButton.style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  document.getElementById(
    "editId"
  ).value =
    "";


  document.getElementById(
    "offerName"
  ).value =
    "";


  document.getElementById(
    "offerDescription"
  ).value =
    "";


  document.getElementById(
    "offerImage"
  ).value =
    "";


  document.getElementById(
    "offerLink"
  ).value =
    "";


  document.getElementById(
    "offerStatus"
  ).value =
    "active";


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Add New Offer";


  saveButton.textContent =
    "Save Offer";


  saveButton.disabled =
    false;


  cancelButton.style.display =
    "none";

}


/* =========================
   TOGGLE OFFER
========================= */

async function toggleOffer(
  id,
  currentStatus
){

  const session =
    await getAdminSession();

  if(!session){
    return;
  }


  const newStatus =
    currentStatus === "active"
    ? "inactive"
    : "active";


  const {
    error
  } =
  await supabaseClient
    .from("offers")
    .update({
      status:newStatus
    })
    .eq(
      "id",
      id
    );


  if(error){

    alert(
      "Unable to change offer status:\n" +
      error.message
    );

    return;

  }


  await loadOffers();

}


/* =========================
   DELETE OFFER
========================= */

async function deleteOffer(id){

  const session =
    await getAdminSession();

  if(!session){
    return;
  }


  const confirmed =
    confirm(
      "Are you sure you want to delete this offer?"
    );


  if(!confirmed){
    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("offers")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    alert(
      "Unable to delete offer:\n" +
      error.message
    );

    return;

  }


  await loadOffers();

}


/* =========================
   USER ACTIVITY
========================= */

async function loadUserActivity(){

  const session =
    await getAdminSession();

  if(!session){
    return;
  }


  activityList.innerHTML =
    `<div class="loading">
      Loading user activity...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("activity_logs")
    .select(`
      id,
      user_id,
      action,
      offer_id,
      page,
      metadata,
      created_at
    `)
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(100);


  if(error){

    console.error(error);

    activityList.innerHTML =
      `<div class="loading">
        Unable to load activity.
        <br><br>
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    activityList.innerHTML =
      `<div class="loading">
        No user activity yet.
        <br><br>
        Login from the website or open an offer,
        then refresh this section.
      </div>`;

    return;

  }


  activityList.innerHTML =
    "";


  /*
    We load profile/offer information
    separately so activity does not
    disappear just because a foreign
    table relationship is unavailable.
  */

  const userIds = [
    ...new Set(
      data
        .map(
          item => item.user_id
        )
        .filter(Boolean)
    )
  ];


  const offerIds = [
    ...new Set(
      data
        .map(
          item => item.offer_id
        )
        .filter(Boolean)
    )
  ];


  let profiles = [];
  let offers = [];


  if(userIds.length){

    const profileResult =
      await supabaseClient
        .from("profiles")
        .select(
          "id,email"
        )
        .in(
          "id",
          userIds
        );


    if(!profileResult.error){

      profiles =
        profileResult.data || [];

    }

  }


  if(offerIds.length){

    const offerResult =
      await supabaseClient
        .from("offers")
        .select(
          "id,title"
        )
        .in(
          "id",
          offerIds
        );


    if(!offerResult.error){

      offers =
        offerResult.data || [];

    }

  }


  data.forEach(
    function(activity){

      const profile =
        profiles.find(
          item =>
            item.id ===
            activity.user_id
        );


      const offer =
        offers.find(
          item =>
            item.id ===
            activity.offer_id
        );


      const email =
        profile?.email ||
        "User ID: " +
        (activity.user_id || "Unknown");


      const offerName =
        offer?.title ||
        (activity.offer_id
          ? "Offer ID: " +
            activity.offer_id
          : "—");


      const date =
        activity.created_at
        ? new Date(
            activity.created_at
          ).toLocaleString()
        : "Unknown";


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "activity-item";


      item.innerHTML = `

        <div class="activity-action">

          ⚡
          ${escapeHtml(
            activity.action ||
            "Unknown Action"
          )}

        </div>


        <h3>

          👤

          <span class="user-email">

            ${escapeHtml(
              email
            )}

          </span>

        </h3>


        <p>

          🎁
          <strong>Offer:</strong>

          <span class="offer-name">

            ${escapeHtml(
              offerName
            )}

          </span>

        </p>


        <p>

          📄
          <strong>Page:</strong>

          ${escapeHtml(
            activity.page ||
            "—"
          )}

        </p>


        <p>

          🆔
          <strong>User ID:</strong>

          ${escapeHtml(
            activity.user_id ||
            "—"
          )}

        </p>
