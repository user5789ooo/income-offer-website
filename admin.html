<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      margin-top: 5px;
      font-size: 13px;
      opacity: .8;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .section h2 {
      margin-bottom: 15px;
      font-size: 19px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 16px;
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111;
    }

    .danger {
      background: #111827;
      color: white;
    }

    .offer-item {
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .offer-item h3 {
      margin-bottom: 7px;
    }

    .offer-item p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .offer-image {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .status {
      display: inline-block;
      margin-top: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    .active {
      color: #16803a;
    }

    .inactive {
      color: #777;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      min-width: 100px;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #f5f6fa;
      font-size: 14px;
      line-height: 1.5;
    }

    .logout {
      width: 100%;
      background: #e5e7eb;
      margin-bottom: 30px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>🔐 Admin Dashboard</h1>
  <p>Manage Income Offers</p>
</header>

<main class="container">

  <!-- ADD / EDIT OFFER -->

  <section class="section">

    <h2 id="formTitle">➕ Add New Offer</h2>

    <input type="hidden" id="editId">

    <label>Offer Name</label>
    <input
      type="text"
      id="offerName"
      placeholder="Example: New User Offer">

    <label>Description</label>
    <textarea
      id="offerDescription"
      placeholder="Write offer details..."></textarea>

    <label>Image URL</label>
    <input
      type="url"
      id="offerImage"
      placeholder="https://example.com/image.jpg">

    <label>Offer Link</label>
    <input
      type="url"
      id="offerLink"
      placeholder="https://example.com/offer">

    <label>Status</label>

    <select id="offerStatus">
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>

    <button
      class="primary"
      id="saveButton"
      onclick="saveOffer()">
      Save Offer
    </button>

    <button
      class="primary secondary"
      id="cancelButton"
      onclick="cancelEdit()"
      style="display:none;">
      Cancel Edit
    </button>

    <div id="message"></div>

  </section>


  <!-- OFFERS -->

  <section class="section">

    <h2>🎁 Current Offers</h2>

    <div id="offerList">
      <div class="loading">
        Loading offers...
      </div>
    </div>

  </section>


  <!-- TELEGRAM -->

  <section class="section">

    <h2>❓ Help / Telegram</h2>

    <label>Telegram Help Link</label>

    <input
      type="url"
      id="telegramLink"
      placeholder="https://t.me/yourusername">

    <button
      class="primary"
      onclick="saveTelegram()">
      Save Telegram Link
    </button>

    <div id="telegramMessage"></div>

  </section>


  <button
    class="logout"
    onclick="logout()">
    Logout
  </button>

</main>


<!-- Supabase library -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your Supabase configuration -->

<script src="supabase-config.js"></script>


<script>

  const ADMIN_UUID =
    "8f49db4a-d528-49c1-b815-f6bc15e1c868";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // Check Admin Login

  async function checkAdmin() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

      window.location.href = "admin-login.html";
      return false;

    }

    if (user.id !== ADMIN_UUID) {

      alert("Access denied.");

      await supabaseClient.auth.signOut();

      window.location.href = "admin-login.html";

      return false;

    }

    return true;
  }


  // Load Offers

  async function loadOffers() {

    const allowed = await checkAdmin();

    if (!allowed) return;

    const offerList =
      document.getElementById("offerList");

    const { data, error } =
      await supabaseClient
        .from("offers")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      offerList.innerHTML =
        "<div class='loading'>Unable to load offers.</div>";

      return;
    }

    if (!data || data.length === 0) {

      offerList.innerHTML =
        "<div class='loading'>No offers found.</div>";

      return;
    }

    offerList.innerHTML = "";

    data.forEach(function(offer) {

      const item =
        document.createElement("div");

      item.className = "offer-item";

      item.innerHTML = `

        ${
          offer.image_url
            ? `<img class="offer-image"
                 src="${escapeHtml(offer.image_url)}"
                 alt="Offer">`
            : ""
        }

        <h3>${escapeHtml(
          offer.title || "Untitled Offer"
        )}</h3>

        <p>${escapeHtml(
          offer.description || ""
        )}</p>

        <span class="status ${
          offer.status === "active"
            ? "active"
            : "inactive"
        }">
          ● ${offer.status}
        </span>

        <div class="actions">

          <button
            class="secondary"
            onclick="editOffer('${offer.id}')">
            ✏️ Edit
          </button>

          <button
            class="secondary"
            onclick="toggleOffer(
              '${offer.id}',
              '${offer.status}'
            )">
            ${
              offer.status === "active"
                ? "⏸️ Turn OFF"
                : "▶️ Turn ON"
            }
          </button>

          <button
            class="danger"
            onclick="deleteOffer('${offer.id}')">
            🗑️ Delete
          </button>

        </div>
      `;

      offerList.appendChild(item);

    });
  }


  // Save New / Edited Offer

  async function saveOffer() {

    const allowed = await checkAdmin();

    if (!allowed) return;

    const name =
      document.getElementById("offerName").value.trim();

    const description =
      document.getElementById("offerDescription").value.trim();

    const image =
      document.getElementById("offerImage").value.trim();

    const link =
      document.getElementById("offerLink").value.trim();

    const status =
      document.getElementById("offerStatus").value;

    const editId =
      document.getElementById("editId").value;

    if (!name) {

      showMessage(
        "Please enter an offer name."
      );

      return;
    }

    const offerData = {

      title: name,

      description: description,

      image_url: image,

      offer_url: link,

      status: status

    };


    let result;


    if (editId) {

      result =
        await supabaseClient
          .from("offers")
          .update(offerData)
          .eq("id", editId);

    } else {

      result =
        await supabaseClient
          .from("offers")
          .insert([offerData]);

    }


    if (result.error) {

      console.error(result.error);

      showMessage(
        "Error: " +
        result.error.message
      );

      return;
    }


    showMessage(
      editId
        ? "Offer updated successfully! ✅"
        : "Offer added successfully! ✅"
    );

    cancelEdit();

    await loadOffers();

  }


  // Edit Offer

  async function editOffer(id) {

    const allowed = await checkAdmin();

    if (!allowed) return;

    const { data, error } =
      await supabaseClient
        .from("offers")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {

      alert(
        "Unable to load offer."
      );

      return;
    }


    document.getElementById("editId").value =
      data.id;

    document.getElementById("offerName").value =
      data.title || "";

    document.getElementById("offerDescription").value =
      data.description || "";

    document.getElementById("offerImage").value =
      data.image_url || "";

    document.getElementById("offerLink").value =
      data.offer_url || "";

    document.getElementById("offerStatus").value =
      data.status || "active";


    document.getElementById("formTitle").textContent =
      "✏️ Edit Offer";

    document.getElementById("saveButton").textContent =
      "Update Offer";

    document.getElementById("cancelButton").style.display =
      "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // Cancel Edit

  function cancelEdit() {

    document.getElementById("editId").value = "";

    document.getElementById("offerName").value = "";

    document.getElementById("offerDescription").value = "";

    document.getElementById("offerImage").value = "";

    document.getElementById("offerLink").value = "";

    document.getElementById("offerStatus").value = "active";

    document.getElementById("formTitle").textContent =
      "➕ Add New Offer";

    document.getElementById("saveButton").textContent =
      "Save Offer";

    document.getElementById("cancelButton").style.display =
      "none";

  }


  // Turn ON / OFF

  async function toggleOffer(id, currentStatus) {

    const allowed = await checkAdmin();

    if (!allowed) return;

    const newStatus =
      currentStatus === "active"
        ? "inactive"
        : "active";

    const { error } =
      await supabaseClient
        .from("offers")
        .update({
          status: newStatus
        })
        .eq("id", id);

    if (error) {

      alert(
        "Unable to change offer status."
      );

      return;
    }

    await loadOffers();

  }


  // Delete Offer

  async function deleteOffer(id) {

    const allowed = await checkAdmin();

    if (!allowed) return;

    const confirmed =
      confirm(
        "Are you sure you want to delete this offer?"
      );

    if (!confirmed) return;

    const { error } =
      await supabaseClient
        .from("offers")
        .delete()
        .eq("id", id);

    if (error) {

      alert(
        "Unable to delete offer."
      );

      return;
    }

    await loadOffers();

  }


  // Telegram

  async function saveTelegram() {

    alert(
      "Telegram settings will be connected to a settings table in the next step."
    );

  }


  // Logout

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "admin-login.html";

  }


  // Message

  function showMessage(text) {

    document.getElementById("message").innerHTML =
      `<div class="message">${escapeHtml(text)}</div>`;

  }


  // HTML Escape

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text ?? "";

    return div.innerHTML;

  }


  // Start

  loadOffers();

</script>

</body>
</html>
