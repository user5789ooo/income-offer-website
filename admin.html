<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6fa;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
}

header h1{
  font-size:22px;
}

header p{
  margin-top:5px;
  font-size:13px;
  opacity:.8;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.section{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.section h2{
  margin-bottom:15px;
  font-size:19px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:15px;
  cursor:pointer;
}

.primary{
  width:100%;
  margin-top:16px;
  background:#111827;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111;
}

.danger{
  background:#dc2626;
  color:white;
}

.offer-item,
.activity-item{
  border:1px solid #e5e7eb;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.offer-item h3,
.activity-item h3{
  margin-bottom:7px;
}

.offer-item p,
.activity-item p{
  color:#666;
  font-size:14px;
  line-height:1.5;
  margin-bottom:5px;
  word-break:break-word;
}

.offer-image{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

.status{
  display:inline-block;
  margin-top:9px;
  font-size:13px;
  font-weight:bold;
}

.active{
  color:#16803a;
}

.inactive{
  color:#777;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.actions button{
  flex:1;
  min-width:100px;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#f5f6fa;
  font-size:14px;
  line-height:1.5;
}

.logout{
  width:100%;
  background:#dc2626;
  color:white;
  margin-bottom:30px;
}

.loading{
  text-align:center;
  color:#777;
  padding:15px;
}

.refresh{
  width:100%;
  margin-bottom:15px;
  background:#e5e7eb;
  color:#111;
}

.activity-action{
  display:inline-block;
  margin-bottom:10px;
  padding:6px 10px;
  border-radius:999px;
  background:#111827;
  color:white;
  font-size:12px;
  font-weight:bold;
}

.activity-time{
  color:#777;
  font-size:12px;
  margin-top:10px;
}

.user-id{
  font-family:monospace;
  font-size:12px;
  word-break:break-all;
}

.link{
  color:#2563eb;
  word-break:break-all;
}

</style>

</head>

<body>


<header>

<h1>🔐 Admin Dashboard</h1>

<p>
Manage Offers & User Activity
</p>

</header>


<main class="container">


<!-- =========================
     ADD / EDIT OFFER
========================= -->

<section class="section">

<h2 id="formTitle">
➕ Add New Offer
</h2>

<input
type="hidden"
id="editId"
>

<label>
Offer Name
</label>

<input
type="text"
id="offerName"
placeholder="Example: Welcome Offer"
>

<label>
Description
</label>

<textarea
id="offerDescription"
placeholder="Write offer details..."
></textarea>

<label>
Image URL
</label>

<input
type="url"
id="offerImage"
placeholder="https://example.com/image.jpg"
>

<label>
Offer Link
</label>

<input
type="url"
id="offerLink"
placeholder="https://example.com/offer"
>

<label>
Status
</label>

<select id="offerStatus">

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>


<button
class="primary"
id="saveButton"
type="button"
>
Save Offer
</button>


<button
class="primary secondary"
id="cancelButton"
type="button"
style="display:none"
>
Cancel Edit
</button>


<div id="message"></div>

</section>



<!-- =========================
     CURRENT OFFERS
========================= -->

<section class="section">

<h2>
🎁 Current Offers
</h2>

<div id="offerList">

<div class="loading">
Loading offers...
</div>

</div>

</section>



<!-- =========================
     USER ACTIVITY
========================= -->

<section class="section">

<h2>
📊 User Activity
</h2>

<button
class="refresh"
id="refreshActivity"
type="button"
>
↻ Refresh Activity
</button>

<div id="activityList">

<div class="loading">
Loading user activity...
</div>

</div>

</section>



<!-- =========================
     TELEGRAM
========================= -->

<section class="section">

<h2>
📢 Telegram
</h2>

<p style="color:#666;font-size:14px;line-height:1.5">

Current Telegram channel:

</p>

<br>

<a
class="link"
href="https://t.me/IncomeOffersOfficia"
target="_blank"
rel="noopener"
>
https://t.me/IncomeOffersOfficia
</a>

</section>



<button
class="logout"
id="logoutButton"
type="button"
>
Logout
</button>


</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

/*
====================================================
IMPORTANT

supabase-config.js already creates:

const supabaseClient = ...

DO NOT create another supabaseClient here.
====================================================
*/


const ADMIN_UUID =
"8f49db4a-d528-49c1-b815-f6bc15e1c868";


let adminUser = null;


/* =========================
   ELEMENTS
========================= */

const offerList =
document.getElementById("offerList");

const activityList =
document.getElementById("activityList");

const message =
document.getElementById("message");



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

const div =
document.createElement("div");

div.textContent =
value ?? "";

return div.innerHTML;

}



/* =========================
   MESSAGE
========================= */

function showMessage(text){

message.innerHTML =
`
<div class="message">
${escapeHtml(text)}
</div>
`;

}



/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getUser();


if(error){

console.error(
"Auth error:",
error
);

window.location.replace(
"admin-login.html"
);

return false;

}


if(!data.user){

window.location.replace(
"admin-login.html"
);

return false;

}


if(data.user.id !== ADMIN_UUID){

alert(
"Access denied."
);

await supabaseClient
.auth
.signOut();

window.location.replace(
"admin-login.html"
);

return false;

}


adminUser =
data.user;

return true;

}catch(error){

console.error(error);

window.location.replace(
"admin-login.html"
);

return false;

}

}



/* =========================
   LOAD OFFERS
========================= */

async function loadOffers(){

offerList.innerHTML =
`
<div class="loading">
Loading offers...
</div>
`;


const {
data,
error
} =
await supabaseClient
.from("offers")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(
"Offers error:",
error
);

offerList.innerHTML =
`
<div class="message">
Unable to load offers.
<br><br>
${escapeHtml(error.message)}
</div>
`;

return;

}


if(!data || data.length === 0){

offerList.innerHTML =
`
<div class="loading">
No offers found.
</div>
`;

return;

}


offerList.innerHTML = "";


data.forEach(
function(offer){

const item =
document.createElement("div");

item.className =
"offer-item";


const title =
offer.title ||
"Untitled Offer";


const description =
offer.description ||
"";


const status =
offer.status ||
"unknown";


item.innerHTML =
`

${
offer.image_url
?
`
<img
class="offer-image"
src="${escapeHtml(
offer.image_url
)}"
alt="Offer"
>
`
:
""
}


<h3>
${escapeHtml(title)}
</h3>


<p>
${escapeHtml(description)}
</p>


${
offer.offer_url
?
`
<p>
🔗
<a
class="link"
href="${escapeHtml(
offer.offer_url
)}"
target="_blank"
rel="noopener"
>
Open Offer Link
</a>
</p>
`
:
`
<p>
🔗 No offer link
</p>
`
}


<span
class="status ${
status === "active"
?
"active"
:
"inactive"
}"
>
● ${escapeHtml(status)}
</span>


<div class="actions">


<button
class="secondary edit-btn"
data-id="${escapeHtml(offer.id)}"
type="button"
>
✏️ Edit
</button>


<button
class="secondary toggle-btn"
data-id="${escapeHtml(offer.id)}"
data-status="${escapeHtml(status)}"
type="button"
>
${
status === "active"
?
"⏸️ Turn OFF"
:
"▶️ Turn ON"
}
</button>


<button
class="danger delete-btn"
data-id="${escapeHtml(offer.id)}"
type="button"
>
🗑️ Delete
</button>


</div>

`;


offerList.appendChild(item);

}
);


/*
Attach buttons after rendering.
*/

document
.querySelectorAll(".edit-btn")
.forEach(
button => {

button.addEventListener(
"click",
function(){

editOffer(
button.dataset.id
);

}
);

}
);


document
.querySelectorAll(".toggle-btn")
.forEach(
button => {

button.addEventListener(
"click",
function(){

toggleOffer(
button.dataset.id,
button.dataset.status
);

}
);

}
);


document
.querySelectorAll(".delete-btn")
.forEach(
button => {

button.addEventListener(
"click",
function(){

deleteOffer(
button.dataset.id
);

}
);

}
);

}



/* =========================
   SAVE OFFER
========================= */

async function saveOffer(){

const name =
document
.getElementById("offerName")
.value
.trim();


const description =
document
.getElementById("offerDescription")
.value
.trim();


const image =
document
.getElementById("offerImage")
.value
.trim();


const link =
document
.getElementById("offerLink")
.value
.trim();


const status =
document
.getElementById("offerStatus")
.value;


const editId =
document
.getElementById("editId")
.value;


if(!name){

showMessage(
"Please enter an offer name."
);

return;

}


const offerData = {

title:name,

description:description,

image_url:image || null,

offer_url:link || null,

status:status

};


let result;


if(editId){

result =
await supabaseClient
.from("offers")
.update(offerData)
.eq(
"id",
editId
);

}else{

result =
await supabaseClient
.from("offers")
.insert([
offerData
]);

}


if(result.error){

console.error(
"Save error:",
result.error
);

showMessage(
"Error: " +
result.error.message
);

return;

}


showMessage(
editId
?
"Offer updated successfully! ✅"
:
"Offer added successfully! ✅"
);


cancelEdit();

await loadOffers();

}



/* =========================
   EDIT OFFER
========================= */

async function editOffer(id){

const {
data,
error
} =
await supabaseClient
.from("offers")
.select("*")
.eq(
"id",
id
)
.single();


if(error){

alert(
"Unable to load offer: " +
error.message
);

return;

}


document.getElementById(
"editId"
).value =
data.id;


document.getElementById(
"offerName"
).value =
data.title || "";


document.getElementById(
"offerDescription"
).value =
data.description || "";


document.getElementById(
"offerImage"
).value =
data.image_url || "";


document.getElementById(
"offerLink"
).value =
data.offer_url || "";


document.getElementById(
"offerStatus"
).value =
data.status || "active";


document.getElementById(
"formTitle"
).textContent =
"✏️ Edit Offer";


document.getElementById(
"saveButton"
).textContent =
"Update Offer";


document.getElementById(
"cancelButton"
).style.display =
"block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}



/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

document.getElementById(
"editId"
).value =
"";


document.getElementById(
"offerName"
).value =
"";


document.getElementById(
"offerDescription"
).value =
"";


document.getElementById(
"offerImage"
).value =
"";


document.getElementById(
"offerLink"
).value =
"";


document.getElementById(
"offerStatus"
).value =
"active";


document.getElementById(
"formTitle"
).textContent =
"➕ Add New Offer";


document.getElementById(
"saveButton"
).textContent =
"Save Offer";


document.getElementById(
"cancelButton"
).style.display =
"none";

}



/* =========================
   TOGGLE OFFER
========================= */

async function toggleOffer(
id,
currentStatus
){

const newStatus =
currentStatus === "active"
?
"inactive"
:
"active";


const {
error
} =
await supabaseClient
.from("offers")
.update({
status:newStatus
})
.eq(
"id",
id
);


if(error){

alert(
"Unable to change status:\n" +
error.message
);

return;

}


await loadOffers();

}



/* =========================
   DELETE OFFER
========================= */

async function deleteOffer(id){

const confirmed =
confirm(
"Are you sure you want to delete this offer?"
);


if(!confirmed){
return;
}


const {
error
} =
await supabaseClient
.from("offers")
.delete()
.eq(
"id",
id
);


if(error){

alert(
"Unable to delete offer:\n" +
error.message
);

return;

}


await loadOffers();

}



/* =========================
   USER ACTIVITY
========================= */

async function loadUserActivity(){

activityList.innerHTML =
`
<div class="loading">
Loading user activity...
</div>
`;


const {
data,
error
} =
await supabaseClient
.from("activity_logs")
.select("*")
.order(
"created_at",
{
ascending:false
}
)
.limit(100);


if(error){

console.error(
"Activity error:",
error
);

activityList.innerHTML =
`
<div class="message">

Unable to load activity.

<br><br>

${escapeHtml(
error.message
)}

</div>
`;

return;

}


if(!data || data.length === 0){

activityList.innerHTML =
`
<div class="loading">
No user activity yet.
</div>
`;

return;

}


activityList.innerHTML = "";


/*
Get offer titles separately.
This avoids depending on
Supabase relationship configuration.
*/

const offerIds =
[
...new Set(
data
.map(item => item.offer_id)
.filter(Boolean)
)
];


let offerMap = {};


if(offerIds.length){

const {
data:offers
} =
await supabaseClient
.from("offers")
.select(
"id,title"
)
.in(
"id",
offerIds
);


if(offers){

offers.forEach(
offer => {

offerMap[
offer.id
] =
offer.title;

}
);

}

}


data.forEach(
function(activity){

const item =
document.createElement("div");

item.className =
"activity-item";


const action =
activity.action ||
"Unknown action";


const userId =
activity.user_id ||
"Unknown user";


const offerTitle =
activity.offer_id
?
(
offerMap[
activity.offer_id
]
||
"Offer deleted / unavailable"
)
:
"—";


const page =
activity.page ||
"—";


const time =
activity.created_at
?
new Date(
activity.created_at
).toLocaleString()
:
"Unknown";


item.innerHTML =
`

<div class="activity-action">

⚡
${escapeHtml(action)}

</div>


<h3>
👤 User Activity
</h3>


<p>
🎁
<strong>Offer:</strong>
${escapeHtml(offerTitle)}
</p>


<p>
📄
<strong>Page:</strong>
${escapeHtml(page)}
</p>


<p>
🆔
<strong>User ID:</strong>
</p>


<p class="user-id">
${escapeHtml(userId)}
</p>


<div class="activity-time">
🕒 ${escapeHtml(time)}
</div>

`;


activityList.appendChild(item);

}
);

}



/* =========================
   LOGOUT
========================= */

async function logout(){

const {
error
} =
await supabaseClient
.auth
.signOut();


if(error){

alert(
"Logout error:\n" +
error.message
);

return;

}


window.location.replace(
"admin-login.html"
);

}



/* =========================
   BUTTONS
========================= */

document
.getElementById("saveButton")
.addEventListener(
"click",
saveOffer
);


document
.getElementById("cancelButton")
.addEventListener(
"click",
cancelEdit
);


document
.getElementById("refreshActivity")
.addEventListener(
"click",
loadUserActivity
);


document
.getElementById("logoutButton")
.addEventListener(
"click",
logout
);



/* =========================
   START
========================= */

async function startAdmin(){

const allowed =
await checkAdmin();

if(!allowed){
return;
}


await loadOffers();

await loadUserActivity();

}


startAdmin();

</script>

</body>
</html>
