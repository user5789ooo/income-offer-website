<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Income Offers - Admin</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:#050505;
color:white;
}

header{
position:sticky;
top:0;
z-index:20;
padding:18px 20px;
border-bottom:1px solid rgba(255,255,255,.08);
background:rgba(5,5,5,.82);
backdrop-filter:blur(20px);
}

header h1{
font-size:22px;
}

header p{
margin-top:5px;
color:rgba(255,255,255,.45);
font-size:12px;
}

.container{
width:100%;
max-width:900px;
margin:auto;
padding:20px 15px 60px;
}

.section{
margin-bottom:18px;
padding:20px;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
background:rgba(255,255,255,.055);
box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.section h2{
margin-bottom:16px;
font-size:18px;
}

label{
display:block;
margin:13px 0 6px;
color:rgba(255,255,255,.7);
font-size:13px;
font-weight:bold;
}

input,
textarea,
select{
width:100%;
padding:13px;
border:1px solid rgba(255,255,255,.1);
border-radius:11px;
outline:none;
background:#111;
color:white;
font-size:14px;
}

input:focus,
textarea:focus,
select:focus{
border-color:rgba(255,255,255,.3);
}

textarea{
min-height:100px;
resize:vertical;
}

button{
border:0;
border-radius:11px;
padding:12px 15px;
cursor:pointer;
font-size:14px;
font-weight:600;
}

.primary{
width:100%;
margin-top:16px;
background:white;
color:#111;
}

.secondary{
background:rgba(255,255,255,.08);
color:white;
border:1px solid rgba(255,255,255,.08);
}

.danger{
background:#c62828;
color:white;
}

.logout{
width:100%;
margin:10px 0 30px;
background:#c62828;
color:white;
}

.message{
margin-top:12px;
padding:11px;
border-radius:11px;
background:rgba(255,255,255,.05);
color:rgba(255,255,255,.65);
font-size:12px;
line-height:1.5;
}

.offer-item,
.activity-item{
margin-bottom:12px;
padding:15px;
border:1px solid rgba(255,255,255,.08);
border-radius:15px;
background:rgba(255,255,255,.035);
}

.offer-item:last-child,
.activity-item:last-child{
margin-bottom:0;
}

.offer-item h3,
.activity-item h3{
margin-bottom:7px;
font-size:15px;
}

.offer-item p,
.activity-item p{
margin-bottom:6px;
color:rgba(255,255,255,.5);
font-size:12px;
line-height:1.5;
word-break:break-word;
}

.offer-image{
width:100%;
max-height:200px;
margin-bottom:12px;
border-radius:11px;
object-fit:cover;
}

.status{
display:inline-block;
margin-top:7px;
font-size:11px;
font-weight:bold;
}

.active{
color:#65ff9b;
}

.inactive{
color:#999;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px;
}

.actions button{
flex:1;
min-width:90px;
}

.loading{
padding:20px;
color:rgba(255,255,255,.4);
text-align:center;
font-size:13px;
}

.refresh{
width:100%;
margin-bottom:14px;
background:rgba(255,255,255,.08);
color:white;
}

.activity-action{
display:inline-block;
margin-bottom:10px;
padding:6px 10px;
border-radius:999px;
background:white;
color:#111;
font-size:10px;
font-weight:bold;
}

.activity-time{
margin-top:10px;
color:rgba(255,255,255,.3);
font-size:10px;
}

.user-id{
font-family:monospace;
font-size:11px !important;
color:rgba(255,255,255,.65) !important;
}

.link{
color:#69b7ff;
word-break:break-all;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:18px;
}

.stat{
padding:16px;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
background:rgba(255,255,255,.05);
}

.stat-number{
font-size:24px;
font-weight:bold;
}

.stat-label{
margin-top:5px;
color:rgba(255,255,255,.38);
font-size:10px;
}

@media(max-width:600px){

.stats{
grid-template-columns:1fr;
}

.section{
padding:16px;
}

}

</style>

</head>

<body>

<header>

<h1>
🔐 Income Offers Admin
</h1>

<p>
Owner: SAHIL • Admin Dashboard
</p>

</header>


<main class="container">


<!-- STATS -->

<div class="stats">

<div class="stat">

<div
class="stat-number"
id="userCount"
>
0
</div>

<div class="stat-label">
Activity Users
</div>

</div>


<div class="stat">

<div
class="stat-number"
id="offerCount"
>
0
</div>

<div class="stat-label">
Active Offers
</div>

</div>


<div class="stat">

<div
class="stat-number"
id="activityCount"
>
0
</div>

<div class="stat-label">
Total Activities
</div>

</div>

</div>


<!-- OFFER FORM -->

<section class="section">

<h2 id="formTitle">
➕ Add New Offer
</h2>

<input
type="hidden"
id="editId"
>


<label>
Offer Name
</label>

<input
type="text"
id="offerName"
placeholder="Example: Welcome Offer"
>


<label>
Description
</label>

<textarea
id="offerDescription"
placeholder="Write offer details..."
></textarea>


<label>
Image URL
</label>

<input
type="url"
id="offerImage"
placeholder="https://example.com/image.jpg"
>


<label>
Offer Link
</label>

<input
type="url"
id="offerLink"
placeholder="https://example.com/offer"
>


<label>
Status
</label>

<select id="offerStatus">

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>


<button
class="primary"
id="saveButton"
type="button"
>
Save Offer
</button>


<button
class="primary secondary"
id="cancelButton"
type="button"
style="display:none"
>
Cancel Edit
</button>


<div id="message"></div>

</section>


<!-- OFFERS -->

<section class="section">

<h2>
🎁 Current Offers
</h2>

<div id="offerList">

<div class="loading">
Loading offers...
</div>

</div>

</section>


<!-- ACTIVITY -->

<section class="section">

<h2>
📊 User Activity
</h2>

<button
class="refresh"
id="refreshActivity"
type="button"
>
↻ Refresh Activity
</button>

<div id="activityList">

<div class="loading">
Loading user activity...
</div>

</div>

</section>


<!-- TELEGRAM -->

<section class="section">

<h2>
📢 Telegram
</h2>

<p
style="
color:rgba(255,255,255,.45);
font-size:12px;
line-height:1.5;
"
>
Support channel
</p>

<br>

<a
class="link"
href="https://t.me/IncomeOffersOfficia"
target="_blank"
rel="noopener"
>
https://t.me/IncomeOffersOfficia
</a>

</section>


<button
class="logout"
id="logoutButton"
type="button"
>
Logout
</button>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

/*
IMPORTANT

supabase-config.js already creates:

supabaseClient

Do not create another client here.
*/


const ADMIN_UUID =
"8f49db4a-d528-49c1-b815-f6bc15e1c868";


const offerList =
document.getElementById(
"offerList"
);

const activityList =
document.getElementById(
"activityList"
);

const message =
document.getElementById(
"message"
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

const div =
document.createElement("div");

div.textContent =
value ?? "";

return div.innerHTML;

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

message.innerHTML =
`
<div class="message">
${escapeHtml(text)}
</div>
`;

}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getUser();


if(error || !data.user){

window.location.replace(
"admin-login.html"
);

return false;

}


if(
data.user.id !==
ADMIN_UUID
){

alert(
"Access denied."
);

await supabaseClient
.auth
.signOut();

window.location.replace(
"admin-login.html"
);

return false;

}


return true;

}catch(error){

console.error(error);

window.location.replace(
"admin-login.html"
);

return false;

}

}


/* =========================
   LOAD OFFERS
========================= */

async function loadOffers(){

offerList.innerHTML =
`
<div class="loading">
Loading offers...
</div>
`;


const {
data,
error
} =
await supabaseClient
.from("offers")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

offerList.innerHTML =
`
<div class="message">
Unable to load offers.
<br><br>
${escapeHtml(error.message)}
</div>
`;

return;

}


const activeOffers =
(data || []).filter(
offer =>
offer.status === "active"
).length;


document.getElementById(
"offerCount"
).textContent =
activeOffers;


if(
!data ||
data.length === 0
){

offerList.innerHTML =
`
<div class="loading">
No offers found.
</div>
`;

return;

}


offerList.innerHTML = "";


data.forEach(
function(offer){

const item =
document.createElement("div");

item.className =
"offer-item";


item.innerHTML = `

${
offer.image_url
?
`
<img
class="offer-image"
src="${escapeHtml(
offer.image_url
)}"
alt="Offer"
>
`
:
""
}

<h3>
${escapeHtml(
offer.title ||
"Untitled Offer"
)}
</h3>

<p>
${escapeHtml(
offer.description ||
"No description"
)}
</p>

<p>

🔗

${
offer.offer_url
?
`
<a
class="link"
href="${escapeHtml(
offer.offer_url
)}"
target="_blank"
rel="noopener"
>
Open Offer Link
</a>
`
:
"No offer link"
}

</p>

<span
class="status ${
offer.status === "active"
?
"active"
:
"inactive"
}"
>
● ${escapeHtml(
offer.status ||
"unknown"
)}
</span>

<div class="actions">

<button
class="secondary edit-btn"
type="button"
>
✏️ Edit
</button>

<button
class="secondary toggle-btn"
type="button"
>
${
offer.status === "active"
?
"⏸️ Turn OFF"
:
"▶️ Turn ON"
}
</button>

<button
class="danger delete-btn"
type="button"
>
🗑️ Delete
</button>

</div>

`;


item
.querySelector(".edit-btn")
.addEventListener(
"click",
function(){

editOffer(
offer.id
);

}
);


item
.querySelector(".toggle-btn")
.addEventListener(
"click",
function(){

toggleOffer(
offer.id,
offer.status
);

}
);


item
.querySelector(".delete-btn")
.addEventListener(
"click",
function(){

deleteOffer(
offer.id
);

}
);


offerList.appendChild(item);

}

);

}


/* =========================
   SAVE OFFER
========================= */

async function saveOffer(){

const editId =
document.getElementById(
"editId"
).value.trim();


const title =
document.getElementById(
"offerName"
).value.trim();


const description =
document.getElementById(
"offerDescription"
).value.trim();


const imageUrl =
document.getElementById(
"offerImage"
).value.trim();


const offerUrl =
document.getElementById(
"offerLink"
).value.trim();


const status =
document.getElementById(
"offerStatus"
).value;


if(!title){

showMessage(
"Please enter an offer name."
);

return;

}


const offerData = {

title:title,

description:
description || null,

image_url:
imageUrl || null,

offer_url:
offerUrl || null,

status:status

};


let result;


if(editId){

result =
await supabaseClient
.from("offers")
.update(offerData)
.eq(
"id",
editId
);

}else{

result =
await supabaseClient
.from("offers")
.insert([
offerData
]);

}


if(result.error){

console.error(
result.error
);

showMessage(
"Save failed: " +
result.error.message
);

return;

}


showMessage(
editId
?
"Offer updated successfully."
:
"Offer created successfully."
);


cancelEdit();

await loadOffers();

}


/* =========================
   EDIT
========================= */

async function editOffer(id){

const {
data,
error
} =
await supabaseClient
.from("offers")
.select("*")
.eq(
"id",
id
)
.single();


if(error){

alert(
"Unable to load offer."
);

return;

}


document.getElementById(
"editId"
).value =
data.id;


document.getElementById(
"offerName"
).value =
data.title || "";


document.getElementById(
"offerDescription"
).value =
data.description || "";


document.getElementById(
"offerImage"
).value =
data.image_url || "";


document.getElementById(
"offerLink"
).value =
data.offer_url || "";


document.getElementById(
"offerStatus"
).value =
data.status || "active";


document.getElementById(
"formTitle"
).textContent =
"✏️ Edit Offer";


document.getElementById(
"saveButton"
).textContent =
"Update Offer";


document.getElementById(
"cancelButton"
).style.display =
"block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

document.getElementById(
"editId"
).value =
"";

document.getElementById(
"offerName"
).value =
"";

document.getElementById(
"offerDescription"
).value =
"";

document.getElementById(
"offerImage"
).value =
"";

document.getElementById(
"offerLink"
).value =
"";

document.getElementById(
"offerStatus"
).value =
"active";

document.getElementById(
"formTitle"
).textContent =
"➕ Add New Offer";

document.getElementById(
"saveButton"
).textContent =
"Save Offer";

document.getElementById(
"cancelButton"
).style.display =
"none";

}


/* =========================
   TOGGLE
========================= */

async function toggleOffer(
id,
currentStatus
){

const newStatus =
currentStatus === "active"
?
"inactive"
:
"active";


const {
error
} =
await supabaseClient
.from("offers")
.update({
status:newStatus
})
.eq(
"id",
id
);


if(error){

alert(
"Unable to change status:\n" +
error.message
);

return;

}


await loadOffers();

}


/* =========================
   DELETE
========================= */

async function deleteOffer(id){

if(
!confirm(
"Are you sure you want to delete this offer?"
)
){

return;

}


const {
error
} =
await supabaseClient
.from("offers")
.delete()
.eq(
"id",
id
);


if(error){

alert(
"Unable to delete offer:\n" +
error.message
);

return;

}


await loadOffers();

}


/* =========================
   ACTIVITY LABEL
========================= */

function activityLabel(item){

const type =
item.event_type ||
item.action ||
"activity";


const map = {

view:"👀 Viewed Offer",

click:"🚀 Opened Offer",

start:"▶️ Started Offer",

complete:"✅ Completed Offer",

offer_view:"👀 Viewed Offer",

offer_open:"🎁 Opened Offer",

offer_click:"🚀 Opened Offer",

offers_page_view:"📋 Viewed Offers",

login:"🔐 Login",

signup:"✨ Account Created"

};


return (
map[type] ||
"⚡ " + type
);

}


/* =========================
   LOAD ACTIVITY
========================= */

async function loadUserActivity(){

activityList.innerHTML =
`
<div class="loading">
Loading user activity...
</div>
`;


const {
data,
error
} =
await supabaseClient
.from("activity_logs")
.select("*")
.order(
"created_at",
{
ascending:false
}
)
.limit(100);


if(error){

console.error(
"Activity error:",
error
);

activityList.innerHTML =
`
<div class="message">
Unable to load activity.
<br><br>
${escapeHtml(
error.message
)}
</div>
`;

return;

}


if(
!data ||
data.length === 0
){

activityList.innerHTML =
`
<div class="loading">
No user activity yet.
</div>
`;

document.getElementById(
"activityCount"
).textContent =
"0";

document.getElementById(
"userCount"
).textContent =
"0";

return;

}


document.getElementById(
"activityCount"
).textContent =
data.length;


/*
Count unique users.
*/

const uniqueUsers =
new Set(
data
.map(
item =>
item.user_id
)
.filter(Boolean)
);


document.getElementById(
"userCount"
).textContent =
uniqueUsers.size;


activityList.innerHTML = "";


/*
Load offer names.
*/

const offerIds =
[
...new Set(
data
.map(
item =>
item.offer_id
)
.filter(Boolean)
)
];


let offerMap = {};


if(
offerIds.length > 0
){

const {
data:offers
} =
await supabaseClient
.from("offers")
.select(
"id,title"
)
.in(
"id",
offerIds
);


if(offers){

offers.forEach(
offer => {

offerMap[
offer.id
] =
offer.title;

}
);

}


}


data.forEach(
function(item){

const activity =
document.createElement(
"div"
);

activity.className =
"activity-item";


const userId =
item.user_id ||
"Unknown";


const offerTitle =
item.offer_id
?
(
offerMap[
item.offer_id
]
||
"Unavailable"
)
:
"—";


const page =
item.page ||
"—";


const eventName =
activityLabel(item);


const time =
item.created_at
?
new Date(
item.created_at
).toLocaleString()
:
"Unknown";


activity.innerHTML = `

<div class="activity-action">
${escapeHtml(
eventName
)}
</div>

<h3>
👤 User Activity
</h3>

<p>
🆔 <strong>User UID</strong>
</p>

<p class="user-id">
${escapeHtml(
userId
)}
</p>

<p>
🎁 <strong>Offer:</strong>
${escapeHtml(
offerTitle
)}
</p>

<p>
📄 <strong>Page:</strong>
${escapeHtml(
page
)}
</p>

<div class="activity-time">
🕒 ${escapeHtml(
time
)}
</div>

`;


activityList.appendChild(
activity
);

}

);

}


/* =========================
   LOGOUT
========================= */

async function logout(){

const {
error
} =
await supabaseClient
.auth
.signOut();


if(error){

alert(
"Logout failed:\n" +
error.message
);

return;

}


window.location.replace(
"admin-login.html"
);

}


/* =========================
   EVENTS
========================= */

document
.getElementById(
"saveButton"
)
.addEventListener(
"click",
saveOffer
);


document
.getElementById(
"cancelButton"
)
.addEventListener(
"click",
cancelEdit
);


document
.getElementById(
"refreshActivity"
)
.addEventListener(
"click",
loadUserActivity
);


document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
logout
);


/* =========================
   START
========================= */

async function start(){

const allowed =
await checkAdmin();


if(!allowed){
return;
}


await loadOffers();

await loadUserActivity();

}


start();

</script>

</body>
</html>
