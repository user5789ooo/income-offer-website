<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Income Offers</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.8;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .offer-title {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .offer {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .offer img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .offer h3 {
      margin-bottom: 8px;
    }

    .offer p {
      color: #666;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .offer button {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      color: #777;
    }

    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
    }

    .bottom-menu a {
      text-decoration: none;
      color: #222;
      font-size: 13px;
      text-align: center;
    }

    .bottom-menu span {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .page-space {
      height: 70px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Income Offers</h1>
    <p>Latest offers in one place</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>Welcome 👋</h2>
      <p>Check the latest available offers below.</p>
    </section>

    <h2 class="offer-title">🎁 Available Offers</h2>

    <div id="offerList">
      <div class="empty">
        Loading offers...
      </div>
    </div>

    <div class="page-space"></div>

  </main>

  <nav class="bottom-menu">

    <a href="index.html">
      <span>🏠</span>
      Home
    </a>

    <a href="index.html">
      <span>🎁</span>
      Offers
    </a>

    <a href="history.html">
      <span>📜</span>
      History
    </a>

    <a href="help.html">
      <span>❓</span>
      Help
    </a>

  </nav>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase configuration -->
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function loadOffers() {

      const offerList = document.getElementById("offerList");

      const { data, error } = await supabaseClient
        .from("offers")
        .select("*")
        .eq("status", "active")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);

        offerList.innerHTML = `
          <div class="empty">
            Unable to load offers.
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {
        offerList.innerHTML = `
          <div class="empty">
            No active offers available right now.
          </div>
        `;

        return;
      }

      offerList.innerHTML = "";

      data.forEach(function(offer) {

        const card = document.createElement("div");

        card.className = "offer";

        card.innerHTML = `
          ${
            offer.image_url
              ? `<img src="${offer.image_url}" alt="Offer">`
              : ""
          }

          <h3>${escapeHtml(offer.title || "Offer")}</h3>

          <p>
            ${escapeHtml(
              offer.description || "No description available."
            )}
          </p>

          <button onclick="openOffer('${encodeURIComponent(
            offer.offer_url || ""
          )}')">
            View Offer
          </button>
        `;

        offerList.appendChild(card);
      });
    }

    function openOffer(url) {

      const decodedUrl = decodeURIComponent(url);

      if (!decodedUrl) {
        alert("Offer link is not available.");
        return;
      }

      window.open(decodedUrl, "_blank");
    }

    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

    loadOffers();
  </script>

</body>
</html>
