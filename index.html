<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>Income Offers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        'Geist',
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background: #050505;
      color: white;

      -webkit-font-smoothing: antialiased;

      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100svh;

      min-height: 620px;

      overflow: hidden;

      isolation: isolate;
    }

    .hero::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: -1;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.12),
          rgba(0,0,0,.30)
        );
    }

    .hero-video {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: -2;

      transform: scale(1.02);

      animation:
        videoZoom 18s ease-in-out infinite alternate;
    }

    @keyframes videoZoom {

      from {
        transform: scale(1.02);
      }

      to {
        transform: scale(1.08);
      }

    }

    .hero-content {
      position: relative;

      z-index: 10;

      display: flex;
      flex-direction: column;

      width: 100%;
      height: 100%;
    }

    /* =========================
       NAV
    ========================= */

    .nav {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 20px;

      animation:
        navDrop .8s cubic-bezier(.16,1,.3,1);
    }

    @keyframes navDrop {

      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .brand {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      color: #010101;

      font-size: 18px;

      font-weight: 600;
    }

    .brand svg {
      width: 24px;
      height: 24px;

      fill: #010101;

      flex-shrink: 0;

      transition:
        transform .5s cubic-bezier(.16,1,.3,1);
    }

    .brand:hover svg {
      transform:
        rotate(180deg)
        scale(1.08);
    }

    .desktop-nav {
      display: none;

      align-items: center;

      gap: 12px;
    }

    .nav-pill {
      display: flex;

      align-items: center;

      gap: 4px;

      padding: 6px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.10);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);
    }

    .nav-link {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      padding: 6px 16px;

      border-radius: 999px;

      color:
        rgba(255,255,255,.80);

      font-size: 14px;

      font-weight: 500;

      transition:
        background .25s ease,
        color .25s ease,
        transform .25s ease;
    }

    .nav-link:hover {
      background:
        rgba(255,255,255,.10);

      color: white;

      transform:
        translateY(-1px);
    }

    .cta {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      border: 0;

      border-radius: 999px;

      padding: 11px 20px;

      background:
        linear-gradient(
          to bottom,
          #2B2B2B,
          #101010
        );

      color: white;

      font-size: 14px;

      font-weight: 500;

      cursor: pointer;

      transition:
        opacity .2s ease,
        transform .2s ease,
        box-shadow .25s ease;
    }

    .cta:hover {
      opacity: .92;

      transform:
        translateY(-2px);

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.35);
    }

    .cta:active {
      transform:
        scale(.96);
    }

    /* =========================
       MOBILE BUTTON
    ========================= */

    .menu-button {
      position: relative;

      z-index: 60;

      display: flex;

      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(255,255,255,.10);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      color: #010101;

      cursor: pointer;

      transition:
        transform .25s ease,
        background .25s ease;
    }

    .menu-button:active {
      transform: scale(.9);
    }

    .menu-button svg {
      position: absolute;

      width: 20px;
      height: 20px;

      transition:
        transform .3s ease,
        opacity .3s ease;
    }

    .menu-icon {
      transform:
        rotate(0)
        scale(1);

      opacity: 1;
    }

    .close-icon {
      transform:
        rotate(-90deg)
        scale(0);

      opacity: 0;
    }

    .menu-button.open .menu-icon {
      transform:
        rotate(90deg)
        scale(0);

      opacity: 0;
    }

    .menu-button.open .close-icon {
      transform:
        rotate(0)
        scale(1);

      opacity: 1;
    }

    /* =========================
       MOBILE DRAWER
    ========================= */

    .mobile-backdrop {
      position: fixed;

      inset: 0;

      z-index: 40;

      background:
        rgba(0,0,0,.80);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .3s ease;
    }

    .mobile-backdrop.open {
      opacity: 1;

      pointer-events: auto;
    }

    .mobile-drawer {
      position: fixed;

      right: 0;
      top: 0;

      z-index: 50;

      display: flex;

      flex-direction: column;

      width: 288px;
      height: 100%;

      padding-top: 24px;

      background:
        rgba(0,0,0,.90);

      backdrop-filter:
        blur(24px);

      -webkit-backdrop-filter:
        blur(24px);

      transform:
        translateX(100%);

      transition:
        transform .5s
        cubic-bezier(.16,1,.3,1);
    }

    .mobile-drawer.open {
      transform:
        translateX(0);
    }

    .mobile-links {
      display: flex;

      flex-direction: column;

      gap: 8px;

      padding:
        80px 24px 0;
    }

    .mobile-link {
      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        14px 16px;

      border-radius: 12px;

      color:
        rgba(255,255,255,.80);

      font-size: 16px;

      font-weight: 500;

      opacity: 0;

      transform:
        translateX(24px);

      transition:
        background .2s ease,
        color .2s ease,
        opacity .4s ease,
        transform .4s ease;
    }

    .mobile-drawer.open
    .mobile-link {
      opacity: 1;

      transform:
        translateX(0);
    }

    .mobile-link:nth-child(1) {
      transition-delay:
        60ms;
    }

    .mobile-link:nth-child(2) {
      transition-delay:
        120ms;
    }

    .mobile-link:nth-child(3) {
      transition-delay:
        180ms;
    }

    .mobile-link:nth-child(4) {
      transition-delay:
        240ms;
    }

    .mobile-link:nth-child(5) {
      transition-delay:
        300ms;
    }

    .mobile-link:hover {
      background:
        rgba(255,255,255,.10);

      color: white;
    }

    .mobile-cta-wrap {
      margin-top: auto;

      padding:
        0 24px 40px;

      opacity: 0;

      transform:
        translateY(16px);

      transition:
        opacity .4s ease .3s,
        transform .4s ease .3s;
    }

    .mobile-drawer.open
    .mobile-cta-wrap {
      opacity: 1;

      transform:
        translateY(0);
    }

    .mobile-cta-wrap .cta {
      width: 100%;

      padding: 14px;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      display: flex;

      flex-direction: column;

      gap: 24px;

      width: 100%;

      margin-top: auto;

      padding:
        0 20px 32px;
    }

    .hero-left {
      max-width: 620px;

      animation:
        heroText
        1s
        .15s
        both
        cubic-bezier(.16,1,.3,1);
    }

    @keyframes heroText {

      from {
        opacity: 0;

        transform:
          translateY(35px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }

    .eyebrow {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 12px;

      color:
        rgba(1,1,1,.70);

      font-size: 12px;

      font-weight: 500;

      letter-spacing: .08em;

      text-transform:
        uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        #010101;

      box-shadow:
        0 0 12px
        rgba(255,255,255,.8);

      animation:
        pulseDot
        1.8s
        ease-in-out
        infinite;
    }

    @keyframes pulseDot {

      0%,
      100% {
        transform: scale(1);

        opacity: .7;
      }

      50% {
        transform: scale(1.5);

        opacity: 1;
      }

    }

    h1 {
      margin: 0;

      max-width: 620px;

      color:
        #010101;

      font-size: 2rem;

      line-height: 1.1;

      font-weight: 600;

      letter-spacing:
        -.045em;
    }

    .hero-description {
      max-width: 500px;

      margin:
        16px 0 0;

      color:
        rgba(1,1,1,.70);

      font-size: 14px;

      line-height: 1.55;
    }

    /* =========================
       EMAIL
    ========================= */

    .email-cta {
      display: flex;

      flex-direction: column;

      gap: 12px;

      margin-top: 24px;

      width: 100%;
    }

    .email-input {
      width: 100%;

      padding:
        13px 20px;

      border: 0;

      outline: none;

      border-radius: 999px;

      background: white;

      color:
        #111827;

      font-size: 14px;

      transition:
        box-shadow .25s ease,
        transform .25s ease;
    }

    .email-input:focus {
      box-shadow:
        0 0 0 3px
        rgba(255,255,255,.25);

      transform:
        translateY(-1px);
    }

    .email-input::placeholder {
      color:
        #9ca3af;
    }

    .email-cta .cta {
      width: 100%;

      padding:
        13px 24px;
    }

    /* =========================
       CARDS
    ========================= */

    .cards {
      display: flex;

      flex-direction: column;

      gap: 16px;

      width: 100%;
    }

    .glass-card {
      width: 100%;

      padding: 20px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.10);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      border:
        1px solid
        rgba(255,255,255,.06);

      transition:
        transform .35s
        cubic-bezier(.16,1,.3,1),
        background .35s ease,
        box-shadow .35s ease;
    }

    .glass-card:hover {
      transform:
        translateY(-6px);

      background:
        rgba(255,255,255,.14);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);
    }

    .cards .glass-card:first-child {
      animation:
        cardIn
        .9s
        .3s
        both
        cubic-bezier(.16,1,.3,1);
    }

    .cards .glass-card:last-child {
      animation:
        cardIn
        .9s
        .45s
        both
        cubic-bezier(.16,1,.3,1);
    }

    @keyframes cardIn {

      from {
        opacity: 0;

        transform:
          translateY(30px)
          scale(.96);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

    .stats-number {
      color:
        #010101;

      font-family:
        'Silkscreen',
        cursive;

      font-size: 2rem;

      line-height: 1;

      font-weight: 400;

      letter-spacing:
        -.04em;
    }

    .stats-body {
      margin-top: 14px;

      color:
        rgba(1,1,1,.70);

      font-size: 14px;

      line-height: 1.55;
    }

    .testimonial-header {
      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 14px;
    }

    .stratify-icon {
      display: flex;

      align-items: center;

      justify-content: center;

      width: 24px;
      height: 24px;

      border-radius: 6px;

      background:
        #010101;

      color: white;

      font-size: 13px;

      font-weight: 700;
    }

    .stratify-name {
      color:
        #010101;

      font-size: 14px;

      font-weight: 600;
    }

    .quote {
      margin: 0;

      color:
        rgba(1,1,1,.80);

      font-size: 14px;

      line-height: 1.55;
    }

    .testimonial-footer {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-top: 20px;
    }

    .avatar {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      object-fit: cover;

      background:
        rgba(255,255,255,.20);
    }

    .person-name {
      color:
        #010101;

      font-size: 14px;

      font-weight: 600;
    }

    .person-role {
      margin-top: 2px;

      color:
        rgba(1,1,1,.60);

      font-size: 12px;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 24px;

      z-index: 100;

      padding:
        11px 17px;

      border-radius: 999px;

      background:
        rgba(15,15,15,.92);

      color: white;

      font-size: 13px;

      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%, 20px);

      transition:
        opacity .3s ease,
        transform .3s ease;

      backdrop-filter:
        blur(12px);
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%,0);
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 640px) {

      .nav {
        padding:
          24px 32px;
      }

      .main {
        padding:
          0 32px 48px;

        gap: 32px;
      }

      h1 {
        font-size:
          2.5rem;
      }

      .email-cta {
        display: inline-flex;

        flex-direction: row;

        align-items: center;

        width: auto;

        padding: 6px;

        border-radius: 999px;

        background: white;
      }

      .email-input {
        width: 256px;

        padding:
          8px 16px;

        border-radius: 0;

        background:
          transparent;
      }

      .email-cta .cta {
        width: auto;

        padding:
          10px 24px;
      }

      .cards {
        flex-direction: row;
      }

      .glass-card {
        width: 256px;

        padding: 24px;
      }

      .stats-number {
        font-size:
          2.25rem;
      }

    }

    @media (min-width: 768px) {

      .nav {
        padding:
          24px 40px;
      }

      .desktop-nav {
        display: flex;
      }

      .menu-button {
        display: none;
      }

      .brand,
      .brand svg {
        color: white;
        fill: white;
      }

      .main {
        padding-left:
          40px;

        padding-right:
          40px;
      }

      .hero-left {
        max-width:
          540px;
      }

    }

    @media (min-width: 1024px) {

      .nav {
        padding-left:
          48px;

        padding-right:
          48px;
      }

      .main {
        flex-direction:
          row;

        align-items:
          flex-end;

        justify-content:
          space-between;

        padding-left:
          48px;

        padding-right:
          48px;

        padding-bottom:
          64px;
      }

      h1 {
        font-size:
          3.5rem;
      }

      .hero-description {
        display: none;
      }

      .cards {
        width: auto;

        gap: 20px;
      }

      .brand,
      .brand svg,
      h1,
      .stats-number,
      .stats-body,
      .quote,
      .stratify-name,
      .person-name,
      .person-role,
      .eyebrow {
        color: white;
      }

      .eyebrow-dot {
        background: white;
      }

      .stats-body {
        color:
          rgba(255,255,255,.70);
      }

      .quote {
        color:
          rgba(255,255,255,.80);
      }

      .person-role {
        color:
          rgba(255,255,255,.60);
      }

    }

    @media (max-width: 420px) {

      .hero {
        min-height:
          680px;
      }

      h1 {
        font-size:
          1.85rem;
      }

      .glass-card {
        padding:
          18px;
      }

    }

    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        scroll-behavior:
          auto !important;

        transition-duration:
          .01ms !important;

        animation-duration:
          .01ms !important;

        animation-iteration-count:
          1 !important;
      }

    }
  </style>
</head>

<body>

  <section class="hero">

    <video
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
    >
      <source
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260803_192301_9231ed6b-c55c-4a48-909c-4ebe11cf2e11.mp4"
        type="video/mp4"
      >
    </video>

    <div class="hero-content">

      <!-- NAV -->

      <nav class="nav">

        <a
          class="brand"
          href="index.html"
          data-sound
        >

          <svg
            viewBox="0 0 256 256"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="
              M128 128
              C128 198.692 70.692 256 0 256
              C0 185.308 57.308 128 128 128Z

              M128 128
              C198.692 128 256 185.308 256 256
              C185.308 256 128 198.692 128 128Z

              M0 0
              C70.692 0 128 57.308 128 128
              C57.308 128 0 70.692 0 0Z

              M256 0
              C256 70.692 198.692 128 128 128
              C128 57.308 185.308 0 256 0Z
            "/>
          </svg>

          <span>nexum</span>

        </a>

        <!-- DESKTOP -->

        <div class="desktop-nav">

          <div class="nav-pill">

            <a
              class="nav-link"
              href="offer.html"
              data-sound
            >
              Modules
            </a>

            <a
              class="nav-link"
              href="offer.html"
              data-sound
            >
              Clientele
            </a>

            <a
              class="nav-link"
              href="offer.html"
              data-sound
            >
              Solutions
            </a>

            <a
              class="nav-link"
              href="history.html"
              data-sound
            >
              My History
            </a>

          </div>

          <a
            class="cta"
            href="login.html"
            data-sound
          >
            Login / Sign up
          </a>

        </div>

        <!-- MOBILE -->

        <button
          class="menu-button"
          id="menuB
