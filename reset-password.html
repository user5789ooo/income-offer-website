<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050507">

<title>Income Offers - Reset Password</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(105,75,255,.20),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(0,180,255,.10),
      transparent 35%
    ),
    #050505;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.box{
  width:100%;
  max-width:430px;

  padding:30px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:28px;

  background:
    rgba(255,255,255,.055);

  backdrop-filter:blur(25px);

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.5);

  animation:
    boxIn .7s ease both;
}

@keyframes boxIn{

  from{
    opacity:0;
    transform:
      translateY(30px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

.logo{
  width:76px;
  height:76px;

  margin:
    0 auto 20px;

  display:block;

  object-fit:cover;

  border-radius:50%;

  border:
    2px solid
    rgba(255,255,255,.4);

  box-shadow:
    0 0 30px
    rgba(105,75,255,.35);
}

h1{
  text-align:center;

  font-size:32px;

  letter-spacing:-.05em;
}

.subtitle{
  margin:
    9px 0 28px;

  text-align:center;

  color:
    rgba(255,255,255,.5);

  font-size:14px;

  line-height:1.5;
}

label{
  display:block;

  margin:
    15px 0 8px;

  color:
    rgba(255,255,255,.8);

  font-size:13px;

  font-weight:700;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;
  height:54px;

  padding:
    0 50px 0 16px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:16px;

  outline:none;

  background:
    rgba(255,255,255,.065);

  color:#fff;

  font-size:16px;

  transition:.2s ease;
}

input::placeholder{
  color:
    rgba(255,255,255,.3);
}

input:focus{

  border-color:
    rgba(150,130,255,.7);

  box-shadow:
    0 0 0 4px
    rgba(105,75,255,.12);
}

.eye{
  position:absolute;

  right:4px;
  top:50%;

  width:44px;
  height:44px;

  transform:
    translateY(-50%);

  border:0;

  background:transparent;

  color:#fff;

  cursor:pointer;

  font-size:18px;
}

.update{
  width:100%;
  height:54px;

  margin-top:20px;

  border:0;

  border-radius:16px;

  background:#fff;

  color:#080808;

  font-weight:800;

  cursor:pointer;

  transition:.2s ease;
}

.update:active{
  transform:scale(.97);
}

.update:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  min-height:22px;

  margin-top:16px;

  text-align:center;

  font-size:13px;

  line-height:1.5;
}

.success{
  display:none;

  margin-top:18px;

  padding:15px;

  border:
    1px solid
    rgba(101,255,155,.2);

  border-radius:15px;

  background:
    rgba(101,255,155,.06);

  color:#8dffa9;

  text-align:center;

  font-size:13px;

  line-height:1.5;
}

.success.show{
  display:block;
}

.back{
  display:block;

  margin-top:20px;

  text-align:center;

  color:
    rgba(255,255,255,.4);

  text-decoration:none;

  font-size:13px;
}

</style>

</head>


<body>


<div class="box">


<img
  class="logo"
  src="assets/income-offers-logo.jpg"
  alt="Income Offers"
  onerror="this.style.display='none'"
>


<h1>
Reset Password
</h1>


<p
  class="subtitle"
  id="subtitle"
>
Create a new password for your account.
</p>


<form id="resetForm">


<label for="password">
New Password
</label>


<div class="input-wrap">

<input
  id="password"
  type="password"
  placeholder="Enter new password"
  autocomplete="new-password"
  minlength="6"
  required
>


<button
  class="eye"
  id="passwordEye"
  type="button"
  aria-label="Show password"
>
👁️
</button>

</div>


<label for="confirmPassword">
Confirm Password
</label>


<div class="input-wrap">

<input
  id="confirmPassword"
  type="password"
  placeholder="Enter password again"
  autocomplete="new-password"
  minlength="6"
  required
>


<button
  class="eye"
  id="confirmEye"
  type="button"
  aria-label="Show password"
>
👁️
</button>

</div>


<button
  class="update"
  id="updateButton"
  type="submit"
>
Update Password
</button>


</form>


<div
  class="message"
  id="message"
></div>


<div
  class="success"
  id="successBox"
>
✓ Password updated successfully.
<br>
You can now login with your new password.
</div>


<a
  class="back"
  href="login.html"
>
← Back to Login
</a>


</div>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase-config.js"></script>


<script>

/*
====================================================
INCOME OFFERS
PASSWORD RESET
====================================================

This page is opened from the Supabase
password-reset email.

It updates the authenticated recovery
session password.

====================================================
*/


const form =
document.getElementById(
  "resetForm"
);

const passwordInput =
document.getElementById(
  "password"
);

const confirmPasswordInput =
document.getElementById(
  "confirmPassword"
);

const passwordEye =
document.getElementById(
  "passwordEye"
);

const confirmEye =
document.getElementById(
  "confirmEye"
);

const updateButton =
document.getElementById(
  "updateButton"
);

const message =
document.getElementById(
  "message"
);

const successBox =
document.getElementById(
  "successBox"
);


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success = false
){

  message.textContent =
    text;

  message.style.color =
    success
      ? "#8dffa9"
      : "#ff7777";

}


/* =========================
   PASSWORD EYE
========================= */

passwordEye.addEventListener(
  "click",
  function(){

    const hidden =
      passwordInput.type ===
      "password";

    passwordInput.type =
      hidden
        ? "text"
        : "password";

    passwordEye.textContent =
      hidden
        ? "🙈"
        : "👁️";

  }
);


confirmEye.addEventListener(
  "click",
  function(){

    const hidden =
      confirmPasswordInput.type ===
      "password";

    confirmPasswordInput.type =
      hidden
        ? "text"
        : "password";

    confirmEye.textContent =
      hidden
        ? "🙈"
        : "👁️";

  }
);


/* =========================
   CHECK RECOVERY SESSION
========================= */

async function checkRecoverySession(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .getSession();


    if(error){

      console.error(
        "SESSION ERROR:",
        error
      );

      showMessage(
        "Unable to verify the reset link."
      );

      updateButton.disabled =
        true;

      return;

    }


    if(
      !data ||
      !data.session
    ){

      showMessage(
        "This password reset link is invalid or has expired."
      );

      updateButton.disabled =
        true;

      return;

    }


    /*
    Recovery session exists.
    User can now update password.
    */

    console.log(
      "Password recovery session ready."
    );


  }catch(error){

    console.error(
      "SESSION EXCEPTION:",
      error
    );

    showMessage(
      "Unable to verify the reset link."
    );

    updateButton.disabled =
      true;

  }

}


/* =========================
   UPDATE PASSWORD
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const password =
      passwordInput.value;

    const confirmPassword =
      confirmPasswordInput.value;


    if(password.length < 6){

      showMessage(
        "Password must be at least 6 characters."
      );

      return;

    }


    if(password !== confirmPassword){

      showMessage(
        "Passwords do not match."
      );

      return;

    }


    updateButton.disabled =
      true;

    updateButton.textContent =
      "Updating...";


    showMessage(
      "Updating your password...",
      true
    );


    try{

      const {
        data,
        error
      } =
      await supabaseClient
        .auth
        .updateUser({

          password:
            password

        });


      if(error){

        console.error(
          "PASSWORD UPDATE ERROR:",
          error
        );

        showMessage(
          error.message ||
          "Could not update password."
        );

        updateButton.disabled =
          false;

        updateButton.textContent =
          "Update Password";

        return;

      }


      /*
      ==============================================
      SUCCESS
      ==============================================
      */

      successBox.classList.add(
        "show"
      );

      showMessage(
        "Password updated successfully.",
        true
      );

      updateButton.textContent =
        "Password Updated ✓";


      /*
      Sign out the recovery session.
      Then user can login normally.
      */

      await supabaseClient
        .auth
        .signOut();


      setTimeout(
        function(){

          window.location.replace(
            "login.html"
          );

        },
        1800
      );


    }catch(error){

      console.error(
        "PASSWORD UPDATE EXCEPTION:",
        error
      );

      showMessage(
        "Something went wrong. Please try again."
      );

      updateButton.disabled =
        false;

      updateButton.textContent =
        "Update Password";

    }

  }
);


/* =========================
   START
========================= */

checkRecoverySession();

</script>

</body>

</html>
