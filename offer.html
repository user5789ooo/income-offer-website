<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#16072f"
>

<title>Income Offers - Offers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;

  background:
    #07020f;

  color:#fff;

  font-family:
    'Geist',
    Arial,
    sans-serif;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}


/* =====================================================
   ROYAL BACKGROUND
===================================================== */

.background{
  position:fixed;

  inset:0;

  z-index:-5;

  overflow:hidden;

  background:

    radial-gradient(
      circle at 8% 5%,
      rgba(92,45,255,.48),
      transparent 30%
    ),

    radial-gradient(
      circle at 92% 18%,
      rgba(33,111,255,.30),
      transparent 28%
    ),

    radial-gradient(
      circle at 50% 75%,
      rgba(128,45,255,.20),
      transparent 38%
    ),

    linear-gradient(
      135deg,
      #08020f 0%,
      #100526 42%,
      #06112a 100%
    );
}

.background::before{
  content:"";

  position:absolute;

  width:650px;
  height:650px;

  left:-250px;
  top:250px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(105,48,255,.24),
      transparent 68%
    );

  filter:blur(25px);

  animation:
    backgroundFloat
    12s
    ease-in-out
    infinite
    alternate;
}

.background::after{
  content:"";

  position:absolute;

  width:600px;
  height:600px;

  right:-250px;
  bottom:-180px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(0,174,255,.20),
      transparent 68%
    );

  filter:blur(25px);

  animation:
    backgroundFloat2
    14s
    ease-in-out
    infinite
    alternate;
}

@keyframes backgroundFloat{

  from{
    transform:
      translate(0,0)
      scale(1);
  }

  to{
    transform:
      translate(100px,-70px)
      scale(1.18);
  }

}

@keyframes backgroundFloat2{

  from{
    transform:
      translate(0,0)
      scale(1);
  }

  to{
    transform:
      translate(-100px,-80px)
      scale(1.2);
  }

}


/* =====================================================
   SPLASH SCREEN
===================================================== */

.splash{
  position:fixed;

  inset:0;

  z-index:99999;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  background:

    radial-gradient(
      circle at 50% 45%,
      rgba(102,50,255,.30),
      transparent 28%
    ),

    linear-gradient(
      145deg,
      #05020b,
      #12042a 50%,
      #031323
    );

  transition:
    opacity .8s ease,
    visibility .8s ease;
}

.splash.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash-logo-wrap{
  position:relative;

  width:250px;
  height:250px;

  display:flex;

  align-items:center;
  justify-content:center;
}

.splash-logo{
  position:relative;

  z-index:5;

  width:150px;
  height:150px;

  object-fit:cover;

  border-radius:50%;

  border:
    2px solid
    rgba(148,110,255,.75);

  box-shadow:

    0 0 25px
    rgba(105,50,255,.8),

    0 0 65px
    rgba(78,67,255,.45),

    0 0 110px
    rgba(0,180,255,.20);

  animation:
    logoFloat
    2.5s
    ease-in-out
    infinite;
}

@keyframes logoFloat{

  0%,100%{
    transform:
      scale(1)
      rotate(0deg);
  }

  50%{
    transform:
      scale(1.045)
      rotate(2deg);
  }

}

.splash-ring{
  position:absolute;

  left:50%;
  top:50%;

  border-radius:50%;

  border:
    1px solid
    rgba(132,87,255,.42);

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.ring-one{
  width:185px;
  height:185px;

  animation:
    ringPulse
    3s
    ease-out
    infinite;
}

.ring-two{
  width:220px;
  height:220px;

  animation:
    ringPulse
    3s
    ease-out
    infinite
    .7s;
}

.ring-three{
  width:255px;
  height:255px;

  animation:
    ringPulse
    3s
    ease-out
    infinite
    1.4s;
}

@keyframes ringPulse{

  0%{
    opacity:.8;

    transform:
      translate(-50%,-50%)
      scale:.72;
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(1.08);
  }

}

.splash-title{
  margin-top:18px;

  font-size:30px;

  font-weight:800;

  letter-spacing:-.04em;

  text-shadow:
    0 0 25px
    rgba(126,76,255,.45);
}

.splash-owner{
  margin-top:7px;

  color:
    rgba(255,255,255,.40);

  font-size:10px;

  font-weight:700;

  letter-spacing:.28em;
}

.splash-loader{
  width:120px;
  height:3px;

  margin-top:185px;

  overflow:hidden;

  border-radius:999px;

  background:
    rgba(255,255,255,.08);
}

.splash-loader span{
  display:block;

  width:45%;
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #6b35ff,
      #8b5cff,
      #20c8ff
    );

  animation:
    loaderMove
    1.5s
    ease-in-out
    infinite;
}

@keyframes loaderMove{

  0%{
    transform:translateX(-120%);
  }

  100%{
    transform:translateX(280%);
  }

}


/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;

  top:0;

  z-index:50;

  border-bottom:
    1px solid
    rgba(146,104,255,.16);

  background:
    rgba(8,3,18,.70);

  backdrop-filter:
    blur(24px);

  -webkit-backdrop-filter:
    blur(24px);
}

.nav{
  max-width:1200px;

  margin:auto;

  padding:
    15px 20px;

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;

  align-items:center;

  gap:10px;
}

.brand-logo{
  width:42px;
  height:42px;

  object-fit:cover;

  border-radius:50%;

  border:
    1px solid
    rgba(160,125,255,.65);

  box-shadow:
    0 0 20px
    rgba(105,55,255,.35);
}

.brand-text{
  display:flex;
  flex-direction:column;
}

.brand-name{
  font-size:17px;
  font-weight:800;
}

.brand-owner{
  margin-top:2px;

  font-size:8px;

  font-weight:700;

  letter-spacing:.16em;

  color:
    rgba(185,165,255,.55);
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button{
  width:44px;
  height:44px;

  border:
    1px solid
    rgba(157,115,255,.30);

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      rgba(111,60,255,.18),
      rgba(24,110,255,.10)
    );

  color:#fff;

  cursor:pointer;

  font-size:23px;

  box-shadow:
    0 8px 30px
    rgba(69,35,160,.22);

  transition:.25s;
}

.menu-button:active{
  transform:scale(.92);
}


/* =====================================================
   SIDE MENU
===================================================== */

.menu-backdrop{
  position:fixed;

  inset:0;

  z-index:80;

  background:
    rgba(3,1,10,.70);

  backdrop-filter:
    blur(8px);

  opacity:0;

  pointer-events:none;

  transition:.3s;
}

.menu-backdrop.open{
  opacity:1;

  pointer-events:auto;
}

.side-menu{
  position:fixed;

  top:0;
  right:0;

  z-index:90;

  width:315px;
  max-width:88%;

  height:100%;

  padding:24px 20px;

  overflow-y:auto;

  background:

    linear-gradient(
      160deg,
      #100522,
      #07152d
    );

  border-left:
    1px solid
    rgba(145,105,255,.20);

  transform:
    translateX(100%);

  transition:
    .4s
    cubic-bezier(.16,1,.3,1);
}

.side-menu.open{
  transform:
    translateX(0);
}

.menu-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:22px;
}

.menu-head h2{
  font-size:20px;
}

.close-btn{
  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.08);

  color:#fff;

  font-size:20px;

  cursor:pointer;
}

.profile-box{
  padding:16px;

  margin-bottom:14px;

  border:
    1px solid
    rgba(142,105,255,.20);

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(102,50,255,.14),
      rgba(0,153,255,.08)
    );
}

.profile-box strong{
  display:block;

  font-size:14px;
}

.profile-box span{
  display:block;

  margin-top:5px;

  color:
    rgba(220,210,255,.48);

  font-size:11px;

  word-break:break-all;
}

.menu-item{
  display:flex;

  align-items:center;

  gap:11px;

  width:100%;

  padding:14px;

  margin-bottom:8px;

  border:
    1px solid
    rgba(140,105,255,.10);

  border-radius:13px;

  background:
    rgba(255,255,255,.045);

  color:#fff;

  font-size:14px;

  text-align:left;

  cursor:pointer;

  transition:.2s;
}

.menu-item:hover{
  background:
    rgba(108,58,255,.16);

  border-color:
    rgba(143,105,255,.24);
}

.telegram{
  margin-top:15px;

  padding:17px;

  border-radius:17px;

  background:

    linear-gradient(
      135deg,
      #176eff,
      #7135ff
    );

  box-shadow:
    0 12px 35px
    rgba(68,55,255,.22);
}

.telegram strong{
  display:block;

  margin-bottom:6px;
}

.telegram p{
  margin:
    0 0 13px;

  color:
    rgba(255,255,255,.80);

  font-size:11px;

  line-height:1.5;
}

.telegram a{
  display:block;

  padding:11px;

  border-radius:10px;

  background:#fff;

  color:#101020;

  text-align:center;

  font-size:12px;

  font-weight:800;
}


/* =====================================================
   HERO
===================================================== */

.hero{
  max-width:1200px;

  margin:auto;

  padding:
    58px 20px 32px;
}

.eyebrow{
  display:flex;

  align-items:center;

  gap:9px;

  color:
    #b5a5ff;

  font-size:11px;

  font-weight:800;

  letter-spacing:.12em;
}

.live-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:
    #65ffa4;

  box-shadow:
    0 0 15px
    #65ffa4;

  animation:
    livePulse
    1.8s
    infinite;
}

@keyframes livePulse{

  0%,100%{
    opacity:.45;
    transform:scale(.8);
  }

  50%{
    opacity:1;
    transform:scale(1.15);
  }

}

h1{
  margin-top:13px;

  max-width:800px;

  font-size:
    clamp(
      2.65rem,
      7vw,
      5.3rem
    );

  line-height:.98;

  letter-spacing:-.065em;

  background:
    linear-gradient(
      100deg,
      #ffffff 20%,
      #c6b6ff 55%,
      #5ccfff 100%
    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;
}

.hero-description{
  max-width:650px;

  margin-top:20px;

  color:
    rgba(224,215,255,.58);

  font-size:14px;

  line-height:1.75;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  max-width:1200px;

  margin:auto;

  padding:
    0 20px 22px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;
}

.count{
  color:
    rgba(216,207,255,.52);

  font-size:12px;
}

.refresh{
  padding:
    11px 17px;

  border:
    1px solid
    rgba(151,112,255,.24);

  border-radius:999px;

  background:

    linear-gradient(
      135deg,
      rgba(106,55,255,.14),
      rgba(24,143,255,.10)
    );

  color:#fff;

  cursor:pointer;

  box-shadow:
    0 8px 25px
    rgba(69,43,150,.18);

  transition:.25s;
}

.refresh:hover{
  border-color:
    rgba(174,143,255,.42);

  transform:
    translateY(-2px);
}

.refresh:disabled{
  opacity:.5;

  cursor:not-allowed;
}


/* =====================================================
   OFFER CONTAINER
===================================================== */

.container{
  max-width:1200px;

  margin:auto;

  padding:
    0 20px 120px;
}

.offer-grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(260px,1fr)
    );

  gap:18px;
}


/* =====================================================
   OFFER CARD
===================================================== */

.offer-card{
  position:relative;

  overflow:hidden;

  border:
    1px solid
    rgba(147,108,255,.20);

  border-radius:24px;

  background:

    linear-gradient(
      145deg,
      rgba(112,61,255,.12),
      rgba(13,31,67,.48)
    );

  backdrop-filter:
    blur(18px);

  box-shadow:

    0 15px 50px
    rgba(3,1,15,.35),

    inset 0 1px 0
    rgba(255,255,255,.06);

  opacity:0;

  animation:
    cardIn
    .65s
    cubic-bezier(.16,1,.3,1)
    forwards;

  transition:.3s;
}

.offer-card::before{
  content:"";

  position:absolute;

  left:-30%;
  top:-50%;

  width:160%;
  height:100%;

  background:
    linear-gradient(
      110deg,
      transparent 35%,
      rgba(255,255,255,.08),
      transparent 65%
    );

  transform:
    translateX(-40%)
    rotate(10deg);

  transition:.7s;

  pointer-events:none;
}

.offer-card:hover::before{
  transform:
    translateX(40%)
    rotate(10deg);
}

.offer-card:hover{
  transform:
    translateY(-7px);

  border-color:
    rgba(166,130,255,.42);

  box-shadow:

    0 22px 65px
    rgba(45,20,130,.35),

    0 0 35px
    rgba(85,45,255,.10);
}

@keyframes cardIn{

  from{
    opacity:0;

    transform:
      translateY(28px)
      scale(.97);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}

.offer-image{
  width:100%;

  aspect-ratio:16/9;

  object-fit:cover;

  display:block;

  background:#110722;
}

.offer-body{
  padding:19px;
}

.offer-title{
  margin:
    0 0 8px;

  font-size:19px;

  font-weight:700;
}

.offer-description{
  min-height:45px;

  color:
    rgba(222,215,255,.55);

  font-size:13px;

  line-height:1.6;
}

.offer-footer{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-top:18px;
}

.date{
  color:
    rgba(209,198,255,.38);

  font-size:10px;
}

.open-btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:
    10px 16px;

  border-radius:999px;

  background:

    linear-gradient(
      135deg,
      #ffffff,
      #dcd2ff
    );

  color:#120a25;

  font-size:12px;

  font-weight:800;

  box-shadow:
    0 7px 25px
    rgba(127,85,255,.20);

  transition:.2s;
}

.open-btn:hover{
  transform:
    translateY(-2px);

  box-shadow:
    0 10px 30px
    rgba(127,85,255,.35);
}

.open-btn:active{
  transform:scale(.94);
}


/* =====================================================
   STATE
===================================================== */

.state{
  grid-column:1/-1;

  padding:
    65px 20px;

  border:
    1px solid
    rgba(146,106,255,.18);

  border-radius:22px;

  background:

    linear-gradient(
      145deg,
      rgba(105,55,255,.10),
      rgba(20,55,100,.08)
    );

  text-align:center;
}

.state-icon{
  font-size:38px;
}

.state h2{
  margin:
    12px 0 7px;

  font-size:20px;
}

.state p{
  color:
    rgba(216,206,255,.45);

  font-size:12px;

  line-height:1.6;
}

.state-error{
  margin-top:14px;

  padding:10px;

  border-radius:10px;

  background:
    rgba(255,70,100,.08);

  color:
    rgba(255,145,160,.85);

  font-size:11px;

  line-height:1.5;

  word-break:break-word;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
  position:fixed;

  left:50%;
  bottom:15px;

  z-index:40;

  transform:
    translateX(-50%);

  width:
    min(
      calc(100% - 30px),
      460px
    );

  display:flex;

  padding:7px;

  border:
    1px solid
    rgba(154,118,255,.24);

  border-radius:999px;

  background:

    linear-gradient(
      135deg,
      rgba(13,7,28,.90),
      rgba(7,23,48,.90)
    );

  backdrop-filter:
    blur(22px);

  box-shadow:

    0 18px 55px
    rgba(0,0,0,.55),

    0 0 30px
    rgba(82,44,200,.12);
}

.bottom-link{
  flex:1;

  padding:
    8px 4px;

  border-radius:999px;

  color:
    rgba(218,210,255,.42);

  text-align:center;

  font-size:10px;

  transition:.25s;
}

.bottom-link span{
  display:block;

  margin-bottom:3px;

  font-size:17px;
}

.bottom-link.active{
  color:#fff;

  background:

    linear-gradient(
      135deg,
      rgba(112,58,255,.40),
      rgba(25,137,255,.22)
    );

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.08);
}


/* =====================================================
   RIPPLE
===================================================== */

.ripple{
  position:fixed;

  z-index:9999;

  width:8px;
  height:8px;

  border-radius:50%;

  background:
    rgba(180,155,255,.55);

  pointer-events:none;

  transform:
    translate(-50%,-50%);

  animation:
    ripple
    .55s
    ease-out
    forwards;
}

@keyframes ripple{

  to{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(12);
  }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

  .menu-button{
    display:none;
  }

  .nav{
    padding-left:32px;
    padding-right:32px;
  }

  .hero,
  .toolbar,
  .container{
    padding-left:32px;
    padding-right:32px;
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:520px){

  .brand-logo{
    width:40px;
    height:40px;
  }

  .brand-name{
    font-size:16px;
  }

  .hero{
    padding-top:48px;
  }

  .offer-grid{
    grid-template-columns:1fr;
  }

  .splash-title{
    font-size:28px;
  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:
      .01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      .01ms !important;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background"></div>


<!-- =====================================================
     OPENING SPLASH
===================================================== -->

<div
  class="splash"
  id="splash"
>

  <div class="splash-logo-wrap">

    <div class="splash-ring ring-one"></div>
    <div class="splash-ring ring-two"></div>
    <div class="splash-ring ring-three"></div>

    <img
      src="assets/income-offers-logo.jpg"
      class="splash-logo"
      alt="Income Offers"
    >

  </div>

  <div class="splash-title">
    Income Offers
  </div>

  <div class="splash-owner">
    OWNER: SAHIL
  </div>

  <div class="splash-loader">
    <span></span>
  </div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<nav class="nav">

  <a
    class="brand"
    href="index.html"
  >

    <img
      class="brand-logo"
      src="assets/income-offers-logo.jpg"
      alt="Income Offers"
      onerror="this.style.display='none'"
    >
