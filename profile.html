<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SAHIL - My Profile</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:white;
  padding:20px;
  overflow-x:hidden;
}

.background{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(255,255,255,.08),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(255,255,255,.05),
      transparent 35%
    ),
    #050505;
}

.container{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:25px 0 60px;
  animation:pageIn .7s cubic-bezier(.16,1,.3,1);
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.back{
  color:rgba(255,255,255,.55);
  text-decoration:none;
  font-size:13px;
}

.back:hover{
  color:white;
}

.brand{
  font-size:18px;
  font-weight:700;
}

.card{
  padding:28px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:26px;
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(25px);
  box-shadow:0 30px 90px rgba(0,0,0,.45);
}

.avatar{
  width:82px;
  height:82px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  color:#111;
  font-size:34px;
  font-weight:800;
  box-shadow:0 10px 45px rgba(255,255,255,.12);
  animation:avatarPulse 3s ease-in-out infinite;
}

@keyframes avatarPulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.04);
  }
}

h1{
  text-align:center;
  font-size:28px;
  letter-spacing:-.04em;
}

.subtitle{
  margin-top:7px;
  text-align:center;
  color:rgba(255,255,255,.42);
  font-size:13px;
}

.info-list{
  margin-top:28px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.info{
  padding:16px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
  background:rgba(255,255,255,.045);
}

.label{
  color:rgba(255,255,255,.35);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:7px;
}

.value{
  color:white;
  font-size:14px;
  line-height:1.5;
  word-break:break-all;
}

.uid{
  font-family:monospace;
  color:rgba(255,255,255,.75);
  font-size:12px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#8dffa9;
  font-size:13px;
  font-weight:600;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#8dffa9;
  box-shadow:0 0 12px #8dffa9;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:24px;
}

.action{
  width:100%;
  padding:14px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;
  background:rgba(255,255,255,.07);
  color:white;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
}

.action:hover{
  background:rgba(255,255,255,.12);
}

.logout{
  color:#ff8585;
}

.message{
  margin-top:15px;
  min-height:18px;
  text-align:center;
  color:rgba(255,255,255,.45);
  font-size:12px;
}

.loading{
  text-align:center;
  padding:50px 20px;
  color:rgba(255,255,255,.45);
}

.error{
  text-align:center;
  padding:40px 20px;
}

.error h2{
  margin:12px 0 8px;
}

.error p{
  color:rgba(255,255,255,.45);
  font-size:13px;
}

@media(max-width:480px){

  body{
    padding:14px;
  }

  .card{
    padding:22px 18px;
  }

}

</style>

</head>

<body>

<div class="background"></div>

<main class="container">

  <div class="top">

    <div class="brand">
      SAHIL
    </div>

    <a
      class="back"
      href="offer.html"
    >
      ← Offers
    </a>

  </div>


  <section
    class="card"
    id="profileCard"
  >

    <div class="loading">
      Loading profile...
    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

const profileCard =
document.getElementById(
  "profileCard"
);


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if(error){

      console.error(error);

      showError(
        "Session Error",
        "Please login again."
      );

      return;

    }


    const user =
      data.user;


    if(!user){

      window.location.replace(
        "login.html"
      );

      return;

    }


    /*
      Load profile information.
    */

    const {
      data:profile,
      error:profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    if(profileError){

      console.error(
        "Profile error:",
        profileError
      );

    }


    const email =
      user.email ||
      "User";


    const role =
      profile &&
      profile.role
        ? profile.role
        : "user";


    const initial =
      email
        .charAt(0)
        .toUpperCase();


    profileCard.innerHTML = `

      <div class="avatar">
        ${escapeHtml(initial)}
      </div>


      <h1>
        My Profile
      </h1>


      <p class="subtitle">
        Your SAHIL account information
      </p>


      <div class="info-list">


        <div class="info">

          <div class="label">
            Email
          </div>

          <div class="value">
            ${escapeHtml(email)}
          </div>

        </div>


        <div class="info">

          <div class="label">
            User ID
          </div>

          <div class="value uid">
            ${escapeHtml(user.id)}
          </div>

        </div>


        <div class="info">

          <div class="label">
            Account Role
          </div>

          <div class="value">
            ${escapeHtml(role)}
          </div>

        </div>


        <div class="info">

          <div class="label">
            Account Status
          </div>

          <div class="status">

            <span class="status-dot"></span>

            Active

          </div>

        </div>


      </div>


      <div class="actions">

        <a
          class="action"
          href="history.html"
        >
          📜 View Activity History
        </a>


        <a
          class="action"
          href="offer.html"
        >
          🎁 View Offers
        </a>


        <button
          class="action logout"
          id="logoutButton"
          type="button"
        >
          🚪 Logout
        </button>

      </div>


      <div
        class="message"
        id="message"
      ></div>

    `;


    /*
      Logout
    */

    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        logout
      );


  }catch(error){

    console.error(
      "Profile error:",
      error
    );

    showError(
      "Unable to Load Profile",
      "Please refresh and try again."
    );

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  const button =
    document.getElementById(
      "logoutButton"
    );

  if(button){

    button.disabled =
      true;

    button.textContent =
      "Logging out...";

  }


  const {
    error
  } =
    await supabaseClient
      .auth
      .signOut();


  if(error){

    console.error(error);

    const message =
      document.getElementById(
        "message"
      );

    if(message){

      message.textContent =
        "Logout failed. Please try again.";

      message.style.color =
        "#ff7777";

    }

    if(button){

      button.disabled =
        false;

      button.textContent =
        "🚪 Logout";

    }

    return;

  }


  window.location.replace(
    "index.html"
  );

}


/* =========================
   ERROR
========================= */

function showError(
  title,
  text
){

  profileCard.innerHTML = `

    <div class="error">

      <div style="font-size:42px">
        ⚠️
      </div>

      <h2>
        ${escapeHtml(title)}
      </h2>

      <p>
        ${escapeHtml(text)}
      </p>

      <br>

      <a
        class="action"
        href="login.html"
      >
        Login
      </a>

    </div>

  `;

}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
