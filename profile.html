<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Income Offers - Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
background:
radial-gradient(
circle at 15% 10%,
rgba(105,75,255,.18),
transparent 35%
),
radial-gradient(
circle at 90% 85%,
rgba(0,180,255,.10),
transparent 35%
),
#050505;
color:#fff;
font-family:'Geist',Arial,sans-serif;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button{
font:inherit;
}

.background{
position:fixed;
inset:0;
z-index:-2;
background:
radial-gradient(
circle at 50% 50%,
rgba(255,255,255,.025),
transparent 40%
);
}


/* HEADER */

header{
position:sticky;
top:0;
z-index:30;
border-bottom:1px solid rgba(255,255,255,.08);
background:rgba(5,5,5,.76);
backdrop-filter:blur(22px);
}

.nav{
max-width:900px;
margin:auto;
padding:15px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-logo{
width:42px;
height:42px;
object-fit:cover;
border-radius:50%;
border:1px solid rgba(255,255,255,.35);
box-shadow:0 0 22px rgba(105,75,255,.22);
}

.brand-text{
display:flex;
flex-direction:column;
}

.brand-name{
font-size:16px;
font-weight:800;
}

.brand-owner{
margin-top:2px;
font-size:8px;
font-weight:700;
letter-spacing:.15em;
color:rgba(255,255,255,.38);
}

.back{
padding:10px 14px;
border:1px solid rgba(255,255,255,.1);
border-radius:999px;
background:rgba(255,255,255,.06);
color:rgba(255,255,255,.75);
font-size:12px;
}


/* MAIN */

.container{
max-width:650px;
margin:auto;
padding:40px 16px 110px;
animation:pageIn .7s ease both;
}

@keyframes pageIn{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* PROFILE CARD */

.profile-card{
overflow:hidden;
border:1px solid rgba(255,255,255,.1);
border-radius:26px;
background:rgba(255,255,255,.055);
backdrop-filter:blur(22px);
box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.profile-top{
padding:30px 22px 24px;
text-align:center;
}

.avatar{
width:92px;
height:92px;
margin:0 auto 17px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#fff;
color:#111;
font-size:38px;
font-weight:800;
border:3px solid rgba(255,255,255,.18);
box-shadow:
0 0 35px rgba(105,75,255,.25);
animation:avatarFloat 4s ease-in-out infinite;
}

@keyframes avatarFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-5px);
}

}

.profile-name{
font-size:24px;
font-weight:800;
letter-spacing:-.04em;
}

.profile-email{
margin-top:6px;
color:rgba(255,255,255,.48);
font-size:12px;
word-break:break-all;
}

.account-badge{
display:inline-flex;
align-items:center;
gap:6px;
margin-top:14px;
padding:7px 12px;
border:1px solid rgba(101,255,155,.18);
border-radius:999px;
background:rgba(101,255,155,.07);
color:#8dffa9;
font-size:10px;
font-weight:700;
}

.badge-dot{
width:6px;
height:6px;
border-radius:50%;
background:#65ff9b;
box-shadow:0 0 10px #65ff9b;
}


/* UID */

.uid-section{
margin:0 20px 20px;
padding:15px;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
background:rgba(255,255,255,.035);
}

.uid-label{
display:block;
margin-bottom:7px;
color:rgba(255,255,255,.32);
font-size:9px;
font-weight:700;
letter-spacing:.1em;
text-transform:uppercase;
}

.uid-row{
display:flex;
align-items:center;
gap:8px;
}

.uid{
min-width:0;
flex:1;
overflow:hidden;
color:rgba(255,255,255,.68);
font-family:monospace;
font-size:11px;
text-overflow:ellipsis;
white-space:nowrap;
}

.copy-button{
padding:7px 10px;
border:1px solid rgba(255,255,255,.1);
border-radius:9px;
background:rgba(255,255,255,.07);
color:#fff;
font-size:10px;
cursor:pointer;
}


/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:0 20px 20px;
}

.stat{
padding:17px;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
background:rgba(255,255,255,.035);
}

.stat-number{
font-size:22px;
font-weight:800;
}

.stat-label{
margin-top:5px;
color:rgba(255,255,255,.38);
font-size:10px;
}


/* ACTIONS */

.actions{
display:flex;
flex-direction:column;
gap:9px;
padding:0 20px 22px;
}

.action{
display:flex;
align-items:center;
justify-content:space-between;
width:100%;
padding:15px;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
background:rgba(255,255,255,.045);
color:#fff;
font-size:13px;
font-weight:600;
text-align:left;
cursor:pointer;
transition:.2s;
}

.action:hover{
background:rgba(255,255,255,.09);
transform:translateY(-1px);
}

.action-left{
display:flex;
align-items:center;
gap:11px;
}

.action-icon{
font-size:18px;
}

.logout{
color:#ff8d8d;
}


/* MESSAGE */

.message{
min-height:20px;
padding:0 20px 20px;
color:rgba(255,255,255,.42);
font-size:11px;
text-align:center;
}


/* BOTTOM NAV */

.bottom-nav{
position:fixed;
left:50%;
bottom:15px;
z-index:40;
width:min(
calc(100% - 30px),
460px
);
transform:translateX(-50%);
display:flex;
padding:7px;
border:1px solid rgba(255,255,255,.1);
border-radius:999px;
background:rgba(10,10,10,.84);
backdrop-filter:blur(20px);
box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.bottom-link{
flex:1;
padding:8px 4px;
border-radius:999px;
color:rgba(255,255,255,.42);
text-align:center;
font-size:10px;
}

.bottom-link span{
display:block;
margin-bottom:3px;
font-size:17px;
}

.bottom-link.active{
color:#fff;
background:rgba(255,255,255,.1);
}


@media(max-width:480px){

.container{
padding:28px 12px 110px;
}

.profile-top{
padding-top:25px;
}

}

</style>

</head>

<body>

<nav class="nav">

<a
class="brand"
href="index.html"
>

<img
class="brand-logo"
src="assets/income-offers-logo.jpg"
alt="Income Offers"
>

<div class="brand-text">

<div class="brand-name">
Income Offers
</div>

<div class="brand-owner">
OWNER: SAHIL
</div>

</div>

</a>


<a
class="back"
href="offer.html"
>
← Offers
</a>

</nav>

</header>


<main class="container">

<div class="profile-card">


<div class="profile-top">

<div
class="avatar"
id="avatar"
>
S
</div>


<div
class="profile-name"
id="profileName"
>
Loading...
</div>


<div
class="profile-email"
id="profileEmail"
>
Loading...
</div>


<div class="account-badge">

<span class="badge-dot"></span>

Verified Account

</div>

</div>


<div class="uid-section">

<span class="uid-label">
User UID
</span>

<div class="uid-row">

class="uid"
id="uid"
>
Loading...
</span>

<button
class="copy-button"
id="copyUid"

>

</button>

</div>

</div>


<div class="stats">

<div class="stat">

<div
class="stat-number"
id="activityCount"
>
0
</div>

<div class="stat-label">
Activities
</div>

</div>


<div class="stat">

<div
class="stat-number"
id="offerCount"
>
0
</div>

<div class="stat-label">
Offer Interactions
</div>

</div>

</div>


<div class="actions">


<a
class="action"
href="offer.html"
>

<span class="action-left">

<span class="action-icon">
🎁
</span>

<span>
Browse Offers
</span>

</span>

<span>

>

</span>

<a

>

🏠
</span>

<span>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

/* =========================
   ELEMENTS
========================= */

const profileName =
document.getElementById(
"profileName"
);

const profileEmail =
document.getElementById(
"profileEmail"
);

const uidElement =
document.getElementById(
"uid"
);

const avatar =
document.getElementById(
"avatar"
);

const activityCount =
document.getElementById(
"activityCount"
);

const offerCount =
document.getElementById(
"offerCount"
);

const message =
document.getElementById(
"message"
);

const copyUid =
document.getElementById(
"copyUid"
);

const logoutButton =
document.getElementById(
"logoutButton"
);


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

const {
data,
error
} =
await supabaseClient
.auth
.getSession();


if(error){

console.error(error);

window.location.replace(
"login.html"
);

return;

}


if(
!data ||
!data.session ||
!data.session.user
){

window.location.replace(
"login.html"
);

return;

}


const user =
data.session.user;

const email =
user.email ||
"User";


/* Basic profile */

profileName.textContent =
email.split("@")[0] ||
"User";

profileEmail.textContent =
email;

uidElement.textContent =
user.id;

avatar.textContent =
(
email.charAt(0) ||
"S"
).toUpperCase();


/* =========================
   ACTIVITY COUNT
========================= */

const {
count:activities,
error:activityError
} =
await supabaseClient
.from("activity_logs")
.select(
"id",
{
count:"exact",
head:true
}
)
.eq(
"user_id",
user.id
);


if(activityError){

console.error(
"Activity count error:",
activityError
);

}else{

activityCount.textContent =
activities || 0;

}


/* =========================
   OFFER INTERACTIONS
========================= */

const {
count:offers,
error:offerError
} =
await supabaseClient
.from("activity_logs")
.select(
"id",
{
count:"exact",
head:true
}
)
.eq(
"user_id",
user.id
)
.not(
"offer_id",
"is",
null
);


if(offerError){

console.error(
"Offer count error:",
offerError
);

}else{

offerCount.textContent =
offers || 0;

}

}


/* =========================
   COPY UID
========================= */

copyUid.addEventListener(
"click",
async function(){

const value =
uidElement.textContent;


if(
!value ||
value === "Loading..."
){
return;
}


try{

await navigator.clipboard.writeText(
value
);

copyUid.textContent =
"Copied";

message.textContent =
"UID copied successfully.";

setTimeout(
function(){

copyUid.textContent =
"Copy";

message.textContent =
"";

},
1500
);

}catch(error){

console.error(error);

message.textContent =
"Unable to copy UID.";

}

});


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
"click",
async function(){

logoutButton.disabled =
true;

logoutButton.querySelector(
"span:last-child"
).textContent =
"";


message.textContent =
"Logging out...";


const {
error
} =
await supabaseClient
.auth
.signOut();


if(error){

console.error(error);

logoutButton.disabled =
false;

message.textContent =
"Logout failed. Please try again.";

return;

}


window.location.replace(
"login.html"
);

});


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
