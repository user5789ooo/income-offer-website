<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Income Offers - History</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
min-height:100vh;
background:
radial-gradient(
circle at 10% 10%,
rgba(105,75,255,.16),
transparent 32%
),
radial-gradient(
circle at 90% 90%,
rgba(0,180,255,.08),
transparent 35%
),
#050505;
color:#fff;
font-family:'Geist',Arial,sans-serif;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

.background{
position:fixed;
inset:0;
z-index:-2;
background:
radial-gradient(
circle at 50% 50%,
rgba(255,255,255,.025),
transparent 40%
);
}


/* HEADER */

header{
position:sticky;
top:0;
z-index:30;
border-bottom:1px solid rgba(255,255,255,.08);
background:rgba(5,5,5,.76);
backdrop-filter:blur(22px);
}

.nav{
max-width:900px;
margin:auto;
padding:15px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-logo{
width:42px;
height:42px;
object-fit:cover;
border-radius:50%;
border:1px solid rgba(255,255,255,.35);
box-shadow:0 0 20px rgba(105,75,255,.2);
}

.brand-text{
display:flex;
flex-direction:column;
}

.brand-name{
font-size:16px;
font-weight:800;
}

.brand-owner{
margin-top:2px;
font-size:8px;
font-weight:700;
letter-spacing:.15em;
color:rgba(255,255,255,.38);
}

.back{
padding:10px 14px;
border:1px solid rgba(255,255,255,.1);
border-radius:999px;
background:rgba(255,255,255,.06);
color:rgba(255,255,255,.75);
font-size:12px;
transition:.2s;
}

.back:active{
transform:scale(.95);
}


/* MAIN */

.container{
width:100%;
max-width:900px;
margin:auto;
padding:45px 20px 110px;
animation:pageIn .7s ease both;
}

@keyframes pageIn{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.eyebrow{
display:inline-flex;
align-items:center;
gap:8px;
color:rgba(255,255,255,.43);
font-size:10px;
font-weight:700;
letter-spacing:.1em;
text-transform:uppercase;
}

.dot{
width:7px;
height:7px;
border-radius:50%;
background:#65ff9b;
box-shadow:0 0 14px #65ff9b;
animation:pulse 1.8s infinite;
}

@keyframes pulse{

0%,100%{
opacity:.4;
transform:scale(.8);
}

50%{
opacity:1;
transform:scale(1.15);
}

}

h1{
margin:13px 0 8px;
font-size:clamp(
2.3rem,
7vw,
3.9rem
);
line-height:1;
letter-spacing:-.06em;
}

.subtitle{
margin:0;
color:rgba(255,255,255,.46);
font-size:14px;
line-height:1.6;
}


/* USER UID */

.uid-box{
margin-top:20px;
padding:13px 15px;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
background:rgba(255,255,255,.04);
}

.uid-label{
display:block;
margin-bottom:5px;
color:rgba(255,255,255,.32);
font-size:9px;
font-weight:700;
letter-spacing:.1em;
text-transform:uppercase;
}

.uid-value{
display:block;
overflow:hidden;
color:rgba(255,255,255,.65);
font-family:monospace;
font-size:11px;
text-overflow:ellipsis;
white-space:nowrap;
}


/* HISTORY */

.history-list{
display:flex;
flex-direction:column;
gap:12px;
margin-top:25px;
}

.history-item{
display:flex;
align-items:center;
gap:14px;
padding:16px;
border:1px solid rgba(255,255,255,.08);
border-radius:17px;
background:rgba(255,255,255,.055);
backdrop-filter:blur(16px);
opacity:0;
transform:translateY(18px);
animation:itemIn .55s ease forwards;
transition:.25s;
}

.history-item:hover{
background:rgba(255,255,255,.08);
border-color:rgba(255,255,255,.15);
transform:translateY(-3px);
}

@keyframes itemIn{

to{
opacity:1;
transform:translateY(0);
}

}

.activity-icon{
width:44px;
height:44px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:13px;
background:rgba(255,255,255,.08);
font-size:19px;
}

.activity-content{
min-width:0;
flex:1;
}

.activity-title{
margin:0;
font-size:14px;
font-weight:700;
line-height:1.35;
}

.activity-description{
margin:4px 0 0;
color:rgba(255,255,255,.42);
font-size:11px;
line-height:1.45;
}

.activity-time{
flex-shrink:0;
color:rgba(255,255,255,.3);
font-size:10px;
text-align:right;
}


/* STATE */

.state{
padding:60px 20px;
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
background:rgba(255,255,255,.04);
text-align:center;
}

.state-icon{
font-size:42px;
margin-bottom:12px;
}

.state h2{
margin:0 0 8px;
font-size:20px;
}

.state p{
margin:0;
color:rgba(255,255,255,.43);
font-size:12px;
line-height:1.6;
}


/* BOTTOM NAV */

.bottom-nav{
position:fixed;
left:50%;
bottom:15px;
z-index:40;
width:min(
calc(100% - 30px),
460px
);
transform:translateX(-50%);
display:flex;
padding:7px;
border:1px solid rgba(255,255,255,.1);
border-radius:999px;
background:rgba(10,10,10,.84);
backdrop-filter:blur(20px);
box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.bottom-link{
flex:1;
padding:8px 4px;
border-radius:999px;
color:rgba(255,255,255,.42);
text-align:center;
font-size:10px;
transition:.2s;
}

.bottom-link span{
display:block;
margin-bottom:3px;
font-size:17px;
}

.bottom-link.active{
color:#fff;
background:rgba(255,255,255,.1);
}


@media(max-width:520px){

.container{
padding:35px 14px 110px;
}

.history-item{
align-items:flex-start;
}

.activity-time{
display:none;
}

}

</style>

</head>

<body>

<div class="background"></div>


<header>

<nav class="nav">

<a
class="brand"
href="index.html"
>

<img
class="brand-logo"
src="assets/income-offers-logo.jpg"
alt="Income Offers"
>

<div class="brand-text">

<div class="brand-name">
Income Offers
</div>

<div class="brand-owner">
OWNER: SAHIL
</div>

</div>

</a>


<a
class="back"
href="offer.html"
>
← Offers
</a>

</nav>

</header>


<main class="container">

<div class="eyebrow">

<span class="dot"></span>

YOUR ACTIVITY

</div>


<h1>
History
</h1>


<p class="subtitle">
See your recent activity and offer interactions.
</p>


<div class="uid-box">

<span class="uid-label">
Your UID
</span>

<span
class="uid-value"
id="uidValue"
>
Loading...
</span>

</div>


<div
class="history-list"
id="historyList"
>

<div class="state">

<div class="state-icon">
⏳
</div>

<h2>
Loading history
</h2>

<p>
Please wait...
</p>

</div>

</div>

</main>


<nav class="bottom-nav">

<a
class="bottom-link"
href="index.html"
>
<span>🏠</span>
Home
</a>


<a
class="bottom-link"
href="offer.html"
>
<span>🎁</span>
Offers
</a>


<a
class="bottom-link active"
href="history.html"
>
<span>📜</span>
History
</a>


<a
class="bottom-link"
href="profile.html"
>
<span>👤</span>
Profile
</a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

/*
  supabase-config.js already creates
  supabaseClient.
*/


const historyList =
document.getElementById(
"historyList"
);

const uidValue =
document.getElementById(
"uidValue"
);


/* =========================
   ACTIVITY INFO
========================= */

function getActivityInfo(
eventType
){

const activities = {

view:{
icon:"👀",
title:"Viewed an offer",
description:
"You viewed an offer or offer details."
},

click:{
icon:"🚀",
title:"Opened an offer",
description:
"You continued to an offer."
},

start:{
icon:"▶️",
title:"Offer started",
description:
"You started an offer."
},

complete:{
icon:"✅",
title:"Offer completed",
description:
"You completed an offer."
}

};

return (
activities[eventType] ||
{
icon:"•",
title:"Activity",
description:
"A recent activity was recorded."
}
);

}


/* =========================
   TIME
========================= */

function formatTime(
value
){

if(!value){
return "";
}

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
){
return "";
}

return date.toLocaleString(
undefined,
{
day:"numeric",
month:"short",
hour:"numeric",
minute:"2-digit"
}
);

}


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

const {
data,
error
} =
await supabaseClient
.auth
.getSession();


if(error){

console.error(error);

showError();

return;

}


if(
!data ||
!data.session ||
!data.session.user
){

window.location.replace(
"login.html"
);

return;

}


const user =
data.session.user;


/*
  Show actual authenticated UID.
*/

uidValue.textContent =
user.id;


/*
  Only fetch this user's
  activity records.
*/

const {
data:activities,
error:activityError
} =
await supabaseClient
.from("activity_logs")
.select(
"id,event_type,offer_id,page,created_at"
)
.eq(
"user_id",
user.id
)
.order(
"created_at",
{
ascending:false
}
)
.limit(50);


if(activityError){

console.error(
"History error:",
activityError
);

showError();

return;

}


if(
!activities ||
activities.length === 0
){

historyList.innerHTML = `

<div class="state">

<div class="state-icon">
📜
</div>

<h2>
No activity yet
</h2>

<p>
Your offer activity will appear here.
</p>

</div>

`;

return;

}


historyList.innerHTML = "";


activities.forEach(
function(
item,
index
){

const info =
getActivityInfo(
item.event_type
);


const element =
document.createElement(
"div"
);

element.className =
"history-item";

element.style.animationDelay =
Math.min(
index * 60,
600
) + "ms";


element.innerHTML = `

<div class="activity-icon">
${info.icon}
</div>

<div class="activity-content">

<p class="activity-title">
${info.title}
</p>

<p class="activity-description">
${info.description}
</p>

</div>

<div class="activity-time">
${formatTime(
item.created_at
)}
</div>

`;


historyList.appendChild(
element
);

}

);

}


/* =========================
   ERROR
========================= */

function showError(){

historyList.innerHTML = `

<div class="state">

<div class="state-icon">
⚠️
</div>

<h2>
Unable to load history
</h2>

<p>
Please refresh and try again.
</p>

</div>

`;

}


/* =========================
   START
========================= */

loadHistory();

</script>

</body>
</html>
