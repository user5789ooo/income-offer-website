<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>History - Income Offers</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .history-title {
      margin-bottom: 15px;
    }

    .history-item {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .history-item h3 {
      margin-bottom: 7px;
    }

    .history-item p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      color: #777;
    }

    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
    }

    .bottom-menu a {
      text-decoration: none;
      color: #222;
      font-size: 13px;
      text-align: center;
    }

    .bottom-menu span {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .page-space {
      height: 70px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📜 History</h1>
  </header>

  <main class="container">

    <h2 class="history-title">Your Activity</h2>

    <div class="empty">
      <p>No activity yet.</p>
      <p>Your offer activity will appear here.</p>
    </div>

    <div class="page-space"></div>

  </main>

  <nav class="bottom-menu">

    <a href="index.html">
      <span>🏠</span>
      Home
    </a>

    <a href="index.html">
      <span>🎁</span>
      Offers
    </a>

    <a href="history.html">
      <span>📜</span>
      History
    </a>

    <a href="help.html">
      <span>❓</span>
      Help
    </a>

  </nav>

</body>
</html>
