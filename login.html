<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Income Offers - Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(105,75,255,.20),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(0,180,255,.10),
      transparent 35%
    ),
    #050505;
  color:#fff;
  font-family:'Geist',Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
}

.login-box{
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(25px);
  box-shadow:0 30px 90px rgba(0,0,0,.5);
  animation:boxIn .7s ease both;
}

@keyframes boxIn{
  from{
    opacity:0;
    transform:translateY(30px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.logo{
  width:76px;
  height:76px;
  margin:0 auto 20px;
  display:block;
  object-fit:cover;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.45);
  box-shadow:0 0 30px rgba(105,75,255,.35);
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }
}

h1{
  text-align:center;
  font-size:32px;
  letter-spacing:-.05em;
}

.subtitle{
  margin:9px 0 28px;
  text-align:center;
  color:rgba(255,255,255,.5);
  font-size:14px;
  line-height:1.5;
}

label{
  display:block;
  margin:0 0 8px;
  color:rgba(255,255,255,.8);
  font-size:13px;
  font-weight:700;
}

input{
  width:100%;
  height:54px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  outline:none;
  background:rgba(255,255,255,.065);
  color:#fff;
  font-size:16px;
  transition:.2s ease;
}

input::placeholder{
  color:rgba(255,255,255,.3);
}

input:focus{
  border-color:rgba(150,130,255,.7);
  box-shadow:0 0 0 4px rgba(105,75,255,.12);
}

.login{
  width:100%;
  height:54px;
  margin-top:15px;
  border:0;
  border-radius:16px;
  background:#fff;
  color:#080808;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
}

.login:active{
  transform:scale(.97);
}

.login:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  min-height:22px;
  margin-top:16px;
  text-align:center;
  font-size:13px;
  line-height:1.5;
}

.signup{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.08);
  text-align:center;
  color:rgba(255,255,255,.5);
  font-size:13px;
}

.signup a{
  color:#fff;
  font-weight:700;
  text-decoration:none;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:rgba(255,255,255,.4);
  text-decoration:none;
  font-size:13px;
}

.success-icon{
  display:none;
  width:65px;
  height:65px;
  margin:20px auto 5px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(101,255,155,.12);
  border:1px solid rgba(101,255,155,.35);
  color:#8dffa9;
  font-size:30px;
  animation:successPop .5s ease both;
}

.success-icon.show{
  display:flex;
}

@keyframes successPop{
  from{
    opacity:0;
    transform:scale(.4);
  }

  70%{
    transform:scale(1.12);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

</style>

</head>

<body>

<div class="login-box">

  <img
    class="logo"
    src="assets/income-offers-logo.jpg"
    alt="Income Offers"
  >

  <h1>
    Welcome Back
  </h1>

  <p
    class="subtitle"
    id="subtitle"
  >
    Enter your email to continue
  </p>


  <form id="loginForm">

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your Gmail / email"
      autocomplete="email"
      required
    >

    <button
      type="submit"
      class="login"
      id="loginButton"
    >
      Send Login Link
    </button>

  </form>


  <div
    class="success-icon"
    id="successIcon"
  >
    ✓
  </div>


  <div
    class="message"
    id="message"
  ></div>


  <div class="signup">

    Don't have an account?

    <a href="signup.html">
      Create Account
    </a>

  </div>


  <a
    class="back"
    href="index.html"
  >
    ← Back to Home
  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "loginForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const message =
  document.getElementById(
    "message"
  );

const subtitle =
  document.getElementById(
    "subtitle"
  );

const successIcon =
  document.getElementById(
    "successIcon"
  );


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success=false
){

  message.textContent =
    text;

  message.style.color =
    success
      ? "#8dffa9"
      : "#ff7777";

}


/* =========================
   EMAIL FROM URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const emailFromUrl =
  params.get("email");


if(emailFromUrl){

  emailInput.value =
    emailFromUrl;

}


/* =========================
   LOGIN
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    if(!email){

      showMessage(
        "Please enter your email."
      );

      return;

    }


    if(!email.includes("@")){

      showMessage(
        "Please enter a valid email."
      );

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Sending Link...";


    showMessage(
      "Preparing secure login...",
      true
    );


    try{

      const {
        error
      } =
        await supabaseClient
          .auth
          .signInWithOtp({

            email:email,

            options:{

              shouldCreateUser:false,

              emailRedirectTo:
                window.location.origin +
                "/index.html"

            }

          });


      if(error){

        console.error(
          "LOGIN ERROR:",
          error
        );

        showMessage(
          "Login failed: " +
          error.message
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Send Login Link";

        return;

      }


      successIcon.classList.add(
        "show"
      );

      subtitle.textContent =
        "Check your email to continue";

      showMessage(
        "A secure login link has been sent to your email.",
        true
      );

      loginButton.textContent =
        "Login Link Sent";


    }catch(error){

      console.error(
        "LOGIN EXCEPTION:",
        error
      );

      showMessage(
        "Something went wrong. Please try again."
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Send Login Link";

    }

  }
);


/* =========================
   EXISTING SESSION
========================= */

async function checkExistingSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if(error){

      console.error(
        error
      );

      return;

    }


    if(
      data &&
      data.session
    ){

      window.location.replace(
        "index.html"
      );

    }

  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================
   START
========================= */

checkExistingSession();

</script>

</body>
</html>
