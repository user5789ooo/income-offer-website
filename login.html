<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:#050505;
color:white;
font-family:'Geist',Arial,sans-serif;
}

.background{
position:fixed;
inset:0;
z-index:-1;
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.10),transparent 32%),
radial-gradient(circle at 80% 80%,rgba(255,255,255,.07),transparent 32%),
#050505;
}

.login-box{
width:100%;
max-width:410px;
padding:30px 24px;
border:1px solid rgba(255,255,255,.10);
border-radius:24px;
background:rgba(255,255,255,.07);
backdrop-filter:blur(22px);
box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.logo{
width:52px;
height:52px;
margin:0 auto 18px;
display:flex;
align-items:center;
justify-content:center;
border-radius:16px;
background:white;
color:#050505;
font-size:18px;
}

h1{
text-align:center;
font-size:28px;
letter-spacing:-.04em;
}

.subtitle{
margin:8px 0 28px;
text-align:center;
color:rgba(255,255,255,.48);
font-size:14px;
}

label{
display:block;
margin-bottom:7px;
color:rgba(255,255,255,.75);
font-size:13px;
font-weight:600;
}

input{
width:100%;
padding:14px 15px;
margin-bottom:17px;
border:1px solid rgba(255,255,255,.10);
border-radius:13px;
outline:none;
background:rgba(255,255,255,.06);
color:white;
font-size:15px;
}

input::placeholder{
color:rgba(255,255,255,.30);
}

input:focus{
border-color:rgba(255,255,255,.35);
background:rgba(255,255,255,.09);
}

.login-button{
width:100%;
padding:14px;
border:0;
border-radius:13px;
background:white;
color:#050505;
font-size:15px;
font-weight:700;
cursor:pointer;
}

.login-button:disabled{
opacity:.55;
cursor:not-allowed;
}

#message{
min-height:20px;
margin-top:15px;
text-align:center;
font-size:13px;
}

.success{
color:#8dffa9;
}

.error{
color:#ff8f8f;
}

.back{
display:block;
margin-top:20px;
text-align:center;
color:rgba(255,255,255,.5);
font-size:13px;
text-decoration:none;
}

.owner{
margin-top:18px;
text-align:center;
color:rgba(255,255,255,.3);
font-size:11px;
}

#moneyRain{
position:fixed;
inset:0;
z-index:9999;
pointer-events:none;
overflow:hidden;
display:none;
}

#moneyRain.show{
display:block;
}

.money{
position:absolute;
top:-70px;
animation:fall 2.5s ease-out forwards;
}

@keyframes fall{
0%{
opacity:0;
transform:translateY(-70px) rotate(0);
}
10%{opacity:1;}
100%{
opacity:0;
transform:translateY(115vh) rotate(720deg);
}
}

</style>
</head>

<body>

<div class="background"></div>

<div id="moneyRain"></div>

<div class="login-box">

<div class="logo">●</div>

<h1>Welcome back</h1>

<p class="subtitle">
Login to continue
</p>

<form id="loginForm">

<label for="email">
Email
</label>

<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required
>

<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required
>

<button
id="loginButton"
class="login-button"
type="submit"
>
Login
</button>

</form>

<div id="message"></div>

<a class="back" href="index.html">
← Back to Home
</a>

<div class="owner">
Website owner: Sahil
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const form =
document.getElementById("loginForm");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");


function showMessage(text,type=""){
message.textContent=text;
message.className=type;
}


/* Already logged in */

async function checkExistingSession(){

const {data,error} =
await supabaseClient.auth.getSession();

if(error){
console.error(error);
return;
}

if(data.session){

window.location.replace("index.html");

}

}


async function login(){

if(button.disabled)return;

const userEmail =
email.value.trim();

const userPassword =
password.value;


if(!userEmail){
showMessage("Enter your email.","error");
return;
}

if(!userPassword){
showMessage("Enter your password.","error");
return;
}


button.disabled=true;
button.textContent="Logging in...";

showMessage("Checking your account...");


try{

const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:userEmail,
password:userPassword

});


if(error){

console.error(error);

showMessage(
error.message || "Login failed.",
"error"
);

button.disabled=false;
button.textContent="Login";

return;

}


if(!data.session){

showMessage(
"Login failed. Session not created.",
"error"
);

button.disabled=false;
button.textContent="Login";

return;

}


showMessage(
"Welcome back! 💰",
"success"
);

button.textContent="Welcome!";


/* Money animation */

const rain =
document.getElementById("moneyRain");

rain.innerHTML="";

rain.classList.add("show");

const symbols=[
"💰","💵","💸","🪙","💲"
];

for(let i=0;i<45;i++){

const item =
document.createElement("span");

item.className="money";

item.textContent =
symbols[
Math.floor(
Math.random()*symbols.length
)
];

item.style.left =
Math.random()*100+"%";

item.style.fontSize =
20+Math.random()*20+"px";

item.style.animationDelay =
Math.random()*0.8+"s";

rain.appendChild(item);

}


setTimeout(function(){

window.location.replace(
"index.html"
);

},1500);


}catch(error){

console.error(error);

showMessage(
error.message || "Something went wrong.",
"error"
);

button.disabled=false;
button.textContent="Login";

}

}


form.addEventListener(
"submit",
function(event){

event.preventDefault();

login();

}
);


checkExistingSession();

</script>

</body>
</html>
