<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SAHIL - Login</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  background:rgba(255,255,255,.06);
  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 20px;
  border-radius:20px;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:34px;
}

.subtitle{
  text-align:center;
  color:rgba(255,255,255,.5);
  margin:0 0 28px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
  color:rgba(255,255,255,.8);
}

input{
  width:100%;
  padding:15px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  background:rgba(255,255,255,.07);
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:rgba(255,255,255,.35);
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:55px;
}

.show-password{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:45px;
  height:45px;
  border:0;
  background:transparent;
  color:white;
  font-size:20px;
  cursor:pointer;
}

button.login{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:999px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button.login:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  margin-top:16px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

.signup{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.08);
  text-align:center;
  color:rgba(255,255,255,.55);
}

.signup a{
  color:white;
  font-weight:bold;
  text-decoration:none;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:rgba(255,255,255,.45);
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">S</div>

  <h1>Welcome Back</h1>

  <p class="subtitle">
    Login to continue
  </p>

  <form id="loginForm">

    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">
      Password
    </label>

    <div class="password-box">

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        class="show-password"
        id="showPassword"
      >👁️</button>

    </div>

    <button
      type="submit"
      class="login"
      id="loginButton"
    >
      Login
    </button>

  </form>

  <div
    class="message"
    id="message"
  ></div>

  <div class="signup">

    Don't have an account?

    <a href="signup.html">
      Create Account
    </a>

  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Back to Home
  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

let supabaseClient = null;


/* =========================
   SUPABASE
========================= */

function setupSupabase(){

  if(
    !window.supabase ||
    typeof SUPABASE_URL === "undefined" ||
    typeof SUPABASE_ANON_KEY === "undefined"
  ){

    showMessage(
      "Supabase configuration পাওয়া যাচ্ছে না."
    );

    return false;
  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );

  return true;
}


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "loginForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const message =
  document.getElementById(
    "message"
  );

const showPassword =
  document.getElementById(
    "showPassword"
  );


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success=false
){

  message.textContent =
    text;

  message.style.color =
    success
      ? "#8dffa9"
      : "#ff7777";

}


/* =========================
   PASSWORD
========================= */

showPassword.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      showPassword.textContent =
        "🙈";

    }else{

      passwordInput.type =
        "password";

      showPassword.textContent =
        "👁️";

    }

  }
);


/* =========================
   EMAIL FROM URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const emailFromUrl =
  params.get("email");


if(emailFromUrl){

  emailInput.value =
    emailFromUrl;

}


/* =========================
   LOGIN
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    if(!email || !password){

      showMessage(
        "Please enter email and password."
      );

      return;

    }


    if(!setupSupabase()){

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Logging in...";


    showMessage(
      "Logging in...",
      true
    );


    try{

      const result =
        await supabaseClient.auth
          .signInWithPassword({

            email:
              email,

            password:
              password

          });


      const data =
        result.data;

      const error =
        result.error;


      if(error){

        console.error(
          "LOGIN ERROR:",
          error
        );

        showMessage(
          "Login failed: " +
          error.message
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        return;

      }


      if(
        !data ||
        !data.user
      ){

        showMessage(
          "Login failed. User not found."
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        return;

      }


      /* =====================
         VERIFY SESSION
      ===================== */

      const sessionResult =
        await supabaseClient.auth
          .getSession();


      if(
        !sessionResult.data.session
      ){

        showMessage(
          "Login succeeded but session was not saved. Please try again."
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        return;

      }


      showMessage(
        "Login successful! Opening website...",
        true
      );


      /*
        Give Supabase time to
        persist the session.
      */

      await new Promise(
        function(resolve){

          setTimeout(
            resolve,
            500
          );

        }
      );


      /* =====================
         MAIN WEBSITE
      ===================== */

      window.location.replace(
        "index.html"
      );


    }catch(error){

      console.error(
        error
      );

      showMessage(
        "Something went wrong: " +
        error.message
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }

  }
);


/* =========================
   EXISTING SESSION
========================= */

async function checkExistingSession(){

  if(!setupSupabase()){

    return;

  }


  try{

    const result =
      await supabaseClient.auth
        .getSession();


    if(
      result.data &&
      result.data.session
    ){

      window.location.replace(
        "index.html"
      );

    }

  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================
   START
========================= */

checkExistingSession();

</script>

</body>
</html>
