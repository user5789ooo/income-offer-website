<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SAHIL - Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#050505;
  color:white;
  font-family:'Geist',Arial,sans-serif;
}

.login-box{
  width:100%;
  max-width:410px;
  padding:30px 24px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:24px;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  animation:show .6s ease both;
}

@keyframes show{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo svg{
  width:48px;
  height:48px;
  fill:white;
}

.logo h1{
  margin:10px 0 0;
  font-size:28px;
}

.subtitle{
  margin:6px 0 25px;
  text-align:center;
  color:rgba(255,255,255,.55);
  font-size:14px;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:13px;
  font-weight:600;
}

input{
  width:100%;
  padding:14px 15px;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:white;
  font-size:15px;
}

input:focus{
  border-color:rgba(255,255,255,.35);
}

input::placeholder{
  color:rgba(255,255,255,.35);
}

.login-button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:white;
  color:#111;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.login-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.message{
  min-height:22px;
  margin-top:15px;
  text-align:center;
  color:rgba(255,255,255,.7);
  font-size:13px;
  line-height:1.5;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:rgba(255,255,255,.55);
  font-size:13px;
  text-decoration:none;
}

.back:hover{
  color:white;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">

    <svg viewBox="0 0 256 256">
      <path d="
      M128 128
      C128 198.692 70.692 256 0 256
      C0 185.308 57.308 128 128 128Z

      M128 128
      C198.692 128 256 185.308 256 256
      C185.308 256 128 198.692 128 128Z

      M0 0
      C70.692 0 128 57.308 128 128
      C57.308 128 0 70.692 0 0Z

      M256 0
      C256 70.692 198.692 128 128 128
      C128 57.308 185.308 0 256 0Z"/>
    </svg>

    <h1>SAHIL</h1>

  </div>

  <p class="subtitle">
    Login to continue
  </p>

  <form id="loginForm">

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button
      class="login-button"
      id="loginButton"
      type="submit"
    >
      Login
    </button>

  </form>

  <div
    class="message"
    id="message"
  ></div>

  <a
    class="back"
    href="index.html"
  >
    ← Back to Home
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const form =
  document.getElementById("loginForm");

const button =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


function showMessage(text){

  message.textContent = text;

}


/* =========================
   CHECK EXISTING LOGIN
========================= */

async function checkExistingSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();

    if(error){

      console.error(error);
      return;

    }

    if(data.session){

      showMessage(
        "Already logged in. Opening..."
      );

      window.location.replace(
        "offer.html"
      );

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   LOGIN
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    if(!email || !password){

      showMessage(
        "Please enter email and password."
      );

      return;

    }

    button.disabled = true;
    button.textContent = "Logging in...";

    showMessage(
      "Please wait..."
    );

    try{

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email:email,

            password:password

          });


      if(error){

        console.error(error);

        showMessage(
          "Login failed: " +
          error.message
        );

        button.disabled = false;
        button.textContent = "Login";

        return;

      }


      if(!data.session){

        showMessage(
          "Login failed. Session তৈরি হয়নি."
        );

        button.disabled = false;
        button.textContent = "Login";

        return;

      }


      showMessage(
        "Login successful! Opening..."
      );


      /*
        Supabase automatically stores
        the session because
        persistSession=true.
      */

      window.location.replace(
        "offer.html"
      );


    }catch(error){

      console.error(error);

      showMessage(
        "Something went wrong."
      );

      button.disabled = false;
      button.textContent = "Login";

    }

  }
);


/* START */

checkExistingSession();

</script>

</body>
</html>
