<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SAHIL - Create Account</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  background:rgba(255,255,255,.06);
  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 20px;
  border-radius:20px;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:28px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:13px;
  background:#181818;
  color:white;
  font-size:16px;
  outline:none;
}

.field{
  position:relative;
}

.field input{
  padding-right:58px;
}

.eye{
  position:absolute;
  right:5px;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  padding:0;
  border:0;
  background:transparent;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  z-index:5;
}

.create{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:999px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.create:disabled{
  opacity:.5;
}

.message{
  margin-top:16px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

.login{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.1);
  text-align:center;
  color:#888;
}

.login a{
  color:white;
  font-weight:bold;
  text-decoration:none;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:#777;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">S</div>

  <h1>Create Account</h1>

  <p class="subtitle">
    Join SAHIL to continue
  </p>


  <form id="signupForm">

    <label>
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >


    <label>
      Password
    </label>

    <div class="field">

      <input
        id="password"
        type="password"
        placeholder="Create password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button
        type="button"
        class="eye"
        id="eyePassword"
      >
        👁️
      </button>

    </div>


    <label>
      Confirm Password
    </label>

    <div class="field">

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button
        type="button"
        class="eye"
        id="eyeConfirm"
      >
        👁️
      </button>

    </div>


    <button
      type="submit"
      class="create"
      id="createButton"
    >
      Create Account
    </button>

  </form>


  <div
    class="message"
    id="message"
  ></div>


  <div class="login">

    Already have an account?

    <a href="login.html">
      Login
    </a>

  </div>


  <a
    class="back"
    href="index.html"
  >
    ← Back to Home
  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>


<script>

let supabaseClient = null;


/* =========================
   INIT SUPABASE
========================= */

function initSupabase(){

  if(
    !window.supabase ||
    typeof SUPABASE_URL === "undefined" ||
    typeof SUPABASE_ANON_KEY === "undefined"
  ){

    showMessage(
      "Supabase configuration পাওয়া যায়নি।"
    );

    return false;

  }


  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );


  return true;

}


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "signupForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const confirmInput =
  document.getElementById(
    "confirmPassword"
  );

const createButton =
  document.getElementById(
    "createButton"
  );

const message =
  document.getElementById(
    "message"
  );


/* =========================
   SHOW / HIDE PASSWORD
========================= */

document
  .getElementById("eyePassword")
  .addEventListener(
    "click",
    function(){

      if(
        passwordInput.type ===
        "password"
      ){

        passwordInput.type =
          "text";

        this.textContent =
          "🙈";

      }else{

        passwordInput.type =
          "password";

        this.textContent =
          "👁️";

      }

    }
  );


document
  .getElementById("eyeConfirm")
  .addEventListener(
    "click",
    function(){

      if(
        confirmInput.type ===
        "password"
      ){

        confirmInput.type =
          "text";

        this.textContent =
          "🙈";

      }else{

        confirmInput.type =
          "password";

        this.textContent =
          "👁️";

      }

    }
  );


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success = false
){

  message.textContent =
    text;

  message.style.color =
    success
      ? "#8dffa9"
      : "#ff7777";

}


/* =========================
   CREATE ACCOUNT
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    if(!initSupabase()){

      return;

    }


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;

    const confirmPassword =
      confirmInput.value;


    if(!email){

      showMessage(
        "Please enter your email."
      );

      return;

    }


    if(password.length < 6){

      showMessage(
        "Password must be at least 6 characters."
      );

      return;

    }


    if(
      password !==
      confirmPassword
    ){

      showMessage(
        "Passwords do not match."
      );

      return;

    }


    createButton.disabled =
      true;

    createButton.textContent =
      "Creating Account...";


    showMessage(
      "Creating your account...",
      true
    );


    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email:
            email,

          password:
            password

        });


      if(error){

        console.error(
          "SIGNUP ERROR:",
          error
        );


        const errorText =
          error.message ||
          "Signup failed.";


        if(
          errorText
            .toLowerCase()
            .includes(
              "already registered"
            )
        ){

          showMessage(
            "This email is already registered. Please login."
          );

        }else{

          showMessage(
            "Signup failed: " +
            errorText
          );

        }


        createButton.disabled =
          false;

        createButton.textContent =
          "Create Account";

        return;

      }


      /* =====================
         SESSION CREATED
      ===================== */

      if(
        data &&
        data.session &&
        data.user
      ){

        showMessage(
          "Account created successfully! Opening website...",
          true
        );


        await new Promise(
          function(resolve){

            setTimeout(
              resolve,
              500
            );

          }
        );


        window.location.replace(
          "index.html"
        );


        return;

      }


      /* =====================
         EMAIL CONFIRMATION
      ===================== */

      showMessage(
        "Account created! Please verify your email, then login.",
        true
      );


      createButton.disabled =
        false;

      createButton.textContent =
        "Create Account";


      setTimeout(
        function(){

          window.location.replace(
            "login.html"
          );

        },
        2500
      );


    }catch(error){

      console.error(
        "SIGNUP EXCEPTION:",
        error
      );


      showMessage(
        "Something went wrong: " +
        error.message
      );


      createButton.disabled =
        false;

      createButton.textContent =
        "Create Account";

    }

  });


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkExistingSession(){

  if(!initSupabase()){

    return;

  }


  try{

    const {
      data
    } =
      await supabaseClient
        .auth
        .getSession();


    if(
      data &&
      data.session
    ){

      window.location.replace(
        "index.html"
      );

    }

  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================
   START
========================= */

checkExistingSession();

</script>

</body>
</html>
