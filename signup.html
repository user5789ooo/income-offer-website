<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SAHIL - Create Account</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  background:rgba(255,255,255,.06);
  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 20px;
  border-radius:20px;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:28px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

.field{
  position:relative;
}

input{
  width:100%;
  padding:15px;
  padding-right:58px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:13px;
  background:#181818;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#aaa;
}

.eye{
  position:absolute;
  right:5px;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border:0;
  padding:0;
  background:transparent;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  z-index:10;
}

.create{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:999px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.create:disabled{
  opacity:.5;
}

.message{
  margin-top:16px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

.login{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.1);
  text-align:center;
  color:#888;
}

.login a{
  color:white;
  font-weight:bold;
  text-decoration:none;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:#777;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">S</div>

<h1>Create Account</h1>

<p class="subtitle">
Join SAHIL to continue
</p>

<form id="signupForm">

<label>Email</label>

<input
  type="email"
  id="email"
  placeholder="Enter your email"
  autocomplete="email"
  required
>

<label>Password</label>

<div class="field">

<input
  type="password"
  id="password"
  placeholder="Create password"
  minlength="6"
  autocomplete="new-password"
  required
>

<button
  type="button"
  class="eye"
  id="passwordEye"
>
👁️
</button>

</div>

<label>Confirm Password</label>

<div class="field">

<input
  type="password"
  id="confirmPassword"
  placeholder="Confirm password"
  minlength="6"
  autocomplete="new-password"
  required
>

<button
  type="button"
  class="eye"
  id="confirmEye"
>
👁️
</button>

</div>

<button
  type="submit"
  class="create"
  id="createButton"
>
Create Account
</button>

</form>

<div
  class="message"
  id="message"
></div>

<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>

<a
  class="back"
  href="index.html"
>
← Back to Home
</a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

/* =========================
   SUPABASE
========================= */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "signupForm"
  );

const email =
  document.getElementById(
    "email"
  );

const password =
  document.getElementById(
    "password"
  );

const confirmPassword =
  document.getElementById(
    "confirmPassword"
  );

const createButton =
  document.getElementById(
    "createButton"
  );

const message =
  document.getElementById(
    "message"
  );


/* =========================
   PASSWORD EYE
========================= */

document
.getElementById("passwordEye")
.addEventListener(
  "click",
  function(){

    if(
      password.type ===
      "password"
    ){

      password.type =
        "text";

      this.textContent =
        "🙈";

    }else{

      password.type =
        "password";

      this.textContent =
        "👁️";

    }

  }
);


/* =========================
   CONFIRM PASSWORD EYE
========================= */

document
.getElementById("confirmEye")
.addEventListener(
  "click",
  function(){

    if(
      confirmPassword.type ===
      "password"
    ){

      confirmPassword.type =
        "text";

      this.textContent =
        "🙈";

    }else{

      confirmPassword.type =
        "password";

      this.textContent =
        "👁️";

    }

  }
);


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success=false
){

  message.textContent =
    text;

  message.style.color =
    success
      ? "#8dffa9"
      : "#ff7777";

}


/* =========================
   CREATE ACCOUNT
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const emailValue =
      email.value
        .trim()
        .toLowerCase();

    const passwordValue =
      password.value;

    const confirmValue =
      confirmPassword.value;


    if(
      passwordValue.length < 6
    ){

      showMessage(
        "Password must be at least 6 characters."
      );

      return;

    }


    if(
      passwordValue !==
      confirmValue
    ){

      showMessage(
        "Passwords do not match."
      );

      return;

    }


    createButton.disabled =
      true;

    createButton.textContent =
      "Creating Account...";


    showMessage(
      "Please wait...",
      true
    );


    try{

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signUp({

            email:
              emailValue,

            password:
              passwordValue

          });


      if(error){

        console.error(
          error
        );

        showMessage(
          "Signup failed: " +
          error.message
        );

        createButton.disabled =
          false;

        createButton.textContent =
          "Create Account";

        return;

      }


      /*
       IMPORTANT:
       Do NOT call signOut().
       Do NOT call getSession()
       here.
      */


      if(
        data &&
        data.session
      ){

        showMessage(
          "Account created! Opening website...",
          true
        );


        setTimeout(
          function(){

            window.location.replace(
              "index.html"
            );

          },
          700
        );


        return;

      }


      /*
       If Supabase requires
       email confirmation.
      */

      showMessage(
        "Account created successfully! Please verify your email, then login.",
        true
      );


      createButton.disabled =
        false;

      createButton.textContent =
        "Create Account";


      setTimeout(
        function(){

          window.location.replace(
            "login.html"
          );

        },
        2200
      );


    }catch(error){

      console.error(
        error
      );

      showMessage(
        "Something went wrong. Please try again."
      );

      createButton.disabled =
        false;

      createButton.textContent =
        "Create Account";

    }

  });

</script>

</body>
</html>
