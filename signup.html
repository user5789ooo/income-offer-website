<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SAHIL - Create Account</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  background:rgba(255,255,255,.06);
  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 20px;
  border-radius:20px;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:28px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

.field{
  position:relative;
}

input{
  width:100%;
  padding:15px;
  padding-right:55px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:13px;
  background:#181818;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#aaa;
}

.eye{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border:0;
  background:transparent;
  color:white;
  font-size:20px;
  cursor:pointer;
  z-index:5;
}

.create{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:999px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.create:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  margin-top:16px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

.login{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.1);
  text-align:center;
  color:#888;
}

.login a{
  color:white;
  font-weight:bold;
  text-decoration:none;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:#777;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">S</div>

  <h1>Create Account</h1>

  <p class="subtitle">
    Join SAHIL to continue
  </p>

  <form id="signupForm">

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">
      Password
    </label>

    <div class="field">

      <input
        id="password"
        type="password"
        placeholder="Create password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button
        type="button"
        class="eye"
        id="passwordEye"
      >👁️</button>

    </div>

    <label for="confirmPassword">
      Confirm Password
    </label>

    <div class="field">

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button
        type="button"
        class="eye"
        id="confirmEye"
      >👁️</button>

    </div>

    <button
      type="submit"
      class="create"
      id="createButton"
    >
      Create Account
    </button>

  </form>

  <div
    class="message"
    id="message"
  ></div>

  <div class="login">
    Already have an account?
    <a href="login.html">
      Login
    </a>
  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Back to Home
  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

let supabaseClient = null;


/* =========================
   SUPABASE
========================= */

function setupSupabase(){

  if(
    !window.supabase ||
    typeof SUPABASE_URL === "undefined" ||
    typeof SUPABASE_ANON_KEY === "undefined"
  ){

    showMessage(
      "Supabase configuration পাওয়া যাচ্ছে না."
    );

    return false;
  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );

  return true;
}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success = false
){

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;

  message.style.color =
    success
      ? "#8dffa9"
      : "#ff7777";
}


/* =========================
   PASSWORD SHOW/HIDE
========================= */

function togglePassword(
  inputId,
  button
){

  const input =
    document.getElementById(
      inputId
    );

  if(
    input.type === "password"
  ){

    input.type = "text";

    button.textContent =
      "🙈";

  }else{

    input.type = "password";

    button.textContent =
      "👁️";

  }

}


document.getElementById(
  "passwordEye"
).addEventListener(
  "click",
  function(){

    togglePassword(
      "password",
      this
    );

  }
);


document.getElementById(
  "confirmEye"
).addEventListener(
  "click",
  function(){

    togglePassword(
      "confirmPassword",
      this
    );

  }
);


/* =========================
   CREATE ACCOUNT
========================= */

async function createAccount(event){

  event.preventDefault();


  const email =
    document.getElementById(
      "email"
    ).value
     .trim()
     .toLowerCase();


  const password =
    document.getElementById(
      "password"
    ).value;


  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;


  const button =
    document.getElementById(
      "createButton"
    );


  /* =====================
     BASIC VALIDATION
  ===================== */

  if(!email){

    showMessage(
      "Email দিন."
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters."
    );

    return;
  }


  if(password !== confirmPassword){

    showMessage(
      "Passwords do not match."
    );

    return;
  }


  /* =====================
     SUPABASE SETUP
  ===================== */

  if(!setupSupabase()){

    return;
  }


  button.disabled = true;

  button.textContent =
    "Creating Account...";


  showMessage(
    "Creating your account...",
    true
  );


  try{

    /* =====================
       SIGN UP
    ===================== */

    const result =
      await supabaseClient.auth.signUp({

        email: email,

        password: password

      });


    const data =
      result.data;

    const error =
      result.error;


    if(error){

      console.error(
        "SIGNUP ERROR:",
        error
      );

      showMessage(
        "Signup failed: " +
        error.message
      );

      button.disabled = false;

      button.textContent =
        "Create Account";

      return;
    }


    /* =====================
       USER CHECK
    ===================== */

    if(!data || !data.user){

      showMessage(
        "Account তৈরি হয়নি. আবার চেষ্টা কর."
      );

      button.disabled = false;

      button.textContent =
        "Create Account";

      return;
    }


    /* =====================
       SESSION CHECK
    ===================== */

    let session =
      data.session;


    /*
      Supabase যদি একই মুহূর্তে
      session না দেয়, আবার getSession()
      দিয়ে check করা হচ্ছে।
    */

    if(!session){

      const sessionResult =
        await supabaseClient.auth.getSession();

      session =
        sessionResult.data.session;
    }


    /* =====================
       SESSION FOUND
    ===================== */

    if(session){

      showMessage(
        "Account created successfully! Opening website...",
        true
      );


      /*
        একটু সময় দিয়ে session
        localStorage-এ persist হতে দিচ্ছি।
      */

      await new Promise(
        function(resolve){

          setTimeout(
            resolve,
            500
          );

        }
      );


      window.location.replace(
        "index.html"
      );

      return;
    }


    /* =====================
       NO SESSION
    ===================== */

    /*
      এখানে সাধারণত email confirmation
      enabled থাকলে আসবে।
    */

    showMessage(
      "Account created. Please login with your new account.",
      true
    );


    button.disabled = false;

    button.textContent =
      "Create Account";


    setTimeout(
      function(){

        window.location.replace(
          "login.html"
        );

      },
      1500
    );


  }catch(error){

    console.error(
      "CREATE ACCOUNT ERROR:",
      error
    );

    showMessage(
      "Something went wrong: " +
      error.message
    );

    button.disabled = false;

    button.textContent =
      "Create Account";

  }

}


/* =========================
   FORM
========================= */

document.getElementById(
  "signupForm"
).addEventListener(
  "submit",
  createAccount
);


/* =========================
   START
========================= */

setupSupabase();

</script>

</body>
</html>
