<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Income Offers - Create Account</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 20% 15%,rgba(105,75,255,.20),transparent 35%),
radial-gradient(circle at 85% 80%,rgba(0,180,255,.10),transparent 35%),
#050505;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.box{
width:100%;
max-width:430px;
padding:30px;
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
background:rgba(255,255,255,.055);
backdrop-filter:blur(25px);
box-shadow:0 30px 90px rgba(0,0,0,.5);
animation:boxIn .7s ease both;
}

@keyframes boxIn{
from{
opacity:0;
transform:translateY(30px) scale(.96);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.logo{
width:76px;
height:76px;
margin:0 auto 20px;
display:block;
object-fit:cover;
border-radius:50%;
border:2px solid rgba(255,255,255,.45);
box-shadow:0 0 30px rgba(105,75,255,.35);
}

h1{
text-align:center;
font-size:32px;
letter-spacing:-.05em;
}

.subtitle{
margin:9px 0 25px;
text-align:center;
color:rgba(255,255,255,.5);
font-size:14px;
line-height:1.5;
}

label{
display:block;
margin:14px 0 7px;
color:rgba(255,255,255,.8);
font-size:13px;
font-weight:700;
}

.input-box{
position:relative;
}

input{
width:100%;
height:54px;
padding:0 48px 0 16px;
border:1px solid rgba(255,255,255,.12);
border-radius:16px;
outline:none;
background:rgba(255,255,255,.065);
color:#fff;
font-size:16px;
transition:.2s ease;
}

input:focus{
border-color:rgba(150,130,255,.7);
box-shadow:0 0 0 4px rgba(105,75,255,.12);
}

input::placeholder{
color:rgba(255,255,255,.3);
}

.eye{
position:absolute;
right:5px;
top:50%;
transform:translateY(-50%);
width:42px;
height:42px;
border:0;
background:transparent;
color:white;
cursor:pointer;
font-size:18px;
}

.create{
width:100%;
height:54px;
margin-top:18px;
border:0;
border-radius:16px;
background:#fff;
color:#080808;
font-weight:800;
cursor:pointer;
transition:.2s ease;
}

.create:active{
transform:scale(.97);
}

.create:disabled{
opacity:.5;
cursor:not-allowed;
}

.message{
min-height:22px;
margin-top:16px;
text-align:center;
font-size:13px;
line-height:1.5;
}

.login{
margin-top:24px;
padding-top:20px;
border-top:1px solid rgba(255,255,255,.08);
text-align:center;
color:rgba(255,255,255,.5);
font-size:13px;
}

.login a{
color:#fff;
font-weight:700;
text-decoration:none;
}

.back{
display:block;
margin-top:20px;
text-align:center;
color:rgba(255,255,255,.4);
text-decoration:none;
font-size:13px;
}

.success-icon{
display:none;
width:65px;
height:65px;
margin:20px auto 5px;
align-items:center;
justify-content:center;
border-radius:50%;
background:rgba(101,255,155,.12);
border:1px solid rgba(101,255,155,.35);
font-size:30px;
}

.success-icon.show{
display:flex;
}

</style>

</head>

<body>

<div class="box">

<img
class="logo"
src="assets/income-offers-logo.jpg"
alt="Income Offers"
onerror="this.style.display='none'"
>

<h1>Create Account</h1>

<p class="subtitle" id="subtitle">
Create your account with an email and password
</p>

<form id="signupForm">

<label for="email">Email</label>

<input
id="email"
type="email"
placeholder="Enter your Gmail / email"
autocomplete="email"
required
>

<label for="password">Password</label>

<div class="input-box">

<input
id="password"
type="password"
placeholder="Create a password"
autocomplete="new-password"
required
>

<button
class="eye"
id="passwordEye"
type="button"
>
👁️
</button>

</div>

<label for="confirmPassword">Confirm Password</label>

<div class="input-box">

<input
id="confirmPassword"
type="password"
placeholder="Enter password again"
autocomplete="new-password"
required
>

<button
class="eye"
id="confirmEye"
type="button"
>
👁️
</button>

</div>

<button
type="submit"
class="create"
id="createButton"
>
Create Account
</button>

</form>

<div
class="success-icon"
id="successIcon"
>
✓
</div>

<div
class="message"
id="message"
></div>

<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>

<a
class="back"
href="index.html"
>
← Back to Home
</a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

const form =
document.getElementById("signupForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const createButton =
document.getElementById("createButton");

const message =
document.getElementById("message");

const subtitle =
document.getElementById("subtitle");

const successIcon =
document.getElementById("successIcon");

const passwordEye =
document.getElementById("passwordEye");

const confirmEye =
document.getElementById("confirmEye");


/* =========================
   MESSAGE
========================= */

function showMessage(text,success=false){

message.textContent = text;

message.style.color =
success
? "#8dffa9"
: "#ff7777";

}


/* =========================
   PASSWORD VISIBILITY
========================= */

passwordEye.addEventListener(
"click",
function(){

if(passwordInput.type === "password"){

passwordInput.type = "text";
passwordEye.textContent = "🙈";

}else{

passwordInput.type = "password";
passwordEye.textContent = "👁️";

}

});


confirmEye.addEventListener(
"click",
function(){

if(confirmPasswordInput.type === "password"){

confirmPasswordInput.type = "text";
confirmEye.textContent = "🙈";

}else{

confirmPasswordInput.type = "password";
confirmEye.textContent = "👁️";

}

});


/* =========================
   CHECK SESSION
========================= */

async function checkExistingSession(){

try{

const {
data,
error
} =
await supabaseClient.auth.getSession();

if(error){

console.warn(error.message);
return;

}

if(
data &&
data.session &&
data.session.user
){

window.location.replace("offer.html");

}

}catch(error){

console.warn(error);

}

}


/* =========================
   CREATE ACCOUNT
========================= */

form.addEventListener(
"submit",
async function(event){

event.preventDefault();

const email =
emailInput.value
.trim()
.toLowerCase();

const password =
passwordInput.value;

const confirmPassword =
confirmPasswordInput.value;


if(!email){

showMessage(
"Please enter your email."
);

return;

}


if(
!email.includes("@") ||
!email.includes(".")
){

showMessage(
"Please enter a valid email address."
);

return;

}


if(password.length < 6){

showMessage(
"Password must be at least 6 characters."
);

return;

}


if(password !== confirmPassword){

showMessage(
"Passwords do not match."
);

return;

}


createButton.disabled = true;

createButton.textContent =
"Creating Account...";

showMessage(
"Creating your secure account...",
true
);


try{

/*
========================================
PASSWORD ACCOUNT CREATION
========================================
*/

const {
data,
error
} =
await supabaseClient.auth.signUp({

email:email,

password:password

});


if(error){

console.error(
"SIGNUP ERROR:",
error
);

showMessage(
error.message
);

createButton.disabled = false;

createButton.textContent =
"Create Account";

return;

}


/*
========================================
IMPORTANT
========================================

Depending on Supabase Auth settings,
email confirmation may still be required.

If confirmation is disabled,
the user will be logged in immediately.

========================================
*/

if(
data &&
data.session &&
data.user
){

successIcon.classList.add("show");

subtitle.textContent =
"Account created successfully";

showMessage(
"Account created. Opening your offers...",
true
);

createButton.textContent =
"Account Created ✓";


setTimeout(
function(){

window.location.replace(
"offer.html"
);

},
700
);

return;

}


/*
If Supabase requires email confirmation.
*/

successIcon.classList.add("show");

subtitle.textContent =
"Account created";

showMessage(
"Account created. Please complete the email verification required by your account settings.",
true
);

createButton.textContent =
"Account Created ✓";

createButton.disabled = false;


}catch(error){

console.error(
"SIGNUP EXCEPTION:",
error
);

showMessage(
"Something went wrong. Please try again."
);

createButton.disabled = false;

createButton.textContent =
"Create Account";

}

});


/* =========================
   START
========================= */

checkExistingSession();

</script>

</body>
</html>
